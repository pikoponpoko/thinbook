<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
/* Layout: header / pages | spread stage | inspector — a production tool, flat and dense.
   Colors, type, radius and focus follow the Digital Agency Design System (DADS) primitives. */
:root{
  /* DADS neutral: white / solid-gray / opacity-gray */
  --bg:#ffffff; --panel:#f2f2f2; --stage:#e6e6e6; --ink:#1a1a1a; --sub:#666666; --line:#cccccc; --field:#949494; --hover:rgba(0,0,0,0.05);
  /* DADS key color blue-900, hover blue-1000, active blue-1200, selected blue-50 */
  --accent:#0017c1; --accent-hover:#00118f; --accent-active:#000060; --accent-soft:#e8f1fe; --accent-ink:#ffffff;
  --danger:#ce0000; --warn:#c74700; --guide:#8843e1; --paper:#ffffff; --focus:#000000; --scrim:rgba(0,0,0,0.5);
  --ui:"Noto Sans JP","BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Noto Sans Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px; --r-dlg:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#1a1a1a; --stage:#333333; --ink:#f2f2f2; --sub:#b3b3b3; --line:#4d4d4d; --field:#7f7f7f; --hover:#333333;
  --accent:#9db7f9; --accent-hover:#c5d7fb; --accent-active:#d9e6ff; --accent-soft:#000060; --accent-ink:#000000;
  --danger:#ff7171; --warn:#ffa66d; --guide:#bb87ff; --paper:#ffffff; --focus:#ffffff; --scrim:rgba(0,0,0,0.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1a1a1a; --stage:#333333; --ink:#f2f2f2; --sub:#b3b3b3; --line:#4d4d4d; --field:#7f7f7f; --hover:#333333;
  --accent:#9db7f9; --accent-hover:#c5d7fb; --accent-active:#d9e6ff; --accent-soft:#000060; --accent-ink:#000000;
  --danger:#ff7171; --warn:#ffa66d; --guide:#bb87ff; --paper:#ffffff; --focus:#ffffff; --scrim:rgba(0,0,0,0.7); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;letter-spacing:.02em;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:var(--bg);border:1px solid var(--field);border-radius:var(--r);padding:3px 10px;min-height:28px;cursor:pointer;line-height:1.4}
button:hover{background:var(--hover)}
button:active{background:var(--stage)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);text-decoration:underline;text-underline-offset:3px}
button.primary:active{background:var(--accent-active);border-color:var(--accent-active)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
button:disabled,button:disabled:hover{background:var(--panel);border-color:var(--line);color:var(--sub);text-decoration:none;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--field);border-radius:var(--r);padding:3px 6px;min-width:0}
input[type=number],select{min-height:28px}
input[type=number]{font-family:var(--num);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:172px minmax(0,1fr) 280px;grid-template-rows:44px minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.logo{font-weight:700;font-size:16px;letter-spacing:.02em}
.grp{display:flex;gap:4px;align-items:center}
#zoomLbl{font-family:var(--num);min-width:44px;text-align:center}
header button{white-space:nowrap}
#app.k-slide header .bk-only,#app:not(.k-slide) header .sl-only{display:none}
#app.k-master .ph .grp,#app.k-master .tabs [data-tab=notes]{display:none}
.tslot.mlay{padding-left:16px}
#docInfo{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.tools button{padding:6px 4px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.ph .grp button{padding:0 8px}
#pages{padding:8px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.tsp{display:flex;justify-content:center;gap:2px}
.tslot{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumb{border:1px solid var(--line);background:var(--paper);cursor:pointer;display:block}
.thumb.cur{outline:2px solid var(--accent)}
.tno{font-family:var(--num);font-size:12px;color:var(--sub)}
#stage{background:var(--stage);overflow:auto;position:relative;min-width:0}
#spreads{display:flex;flex-direction:column;align-items:center;gap:36px;padding:32px;min-width:max-content}
.spread{display:flex;gap:12px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.page{position:relative;background:var(--paper);touch-action:none}
.page canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0}
.pno{font-family:var(--num);font-size:12px;color:var(--sub)}
.dwr{display:grid;grid-template-columns:84px minmax(0,1fr) 64px 28px;gap:4px;margin-bottom:4px}
.dwh{color:var(--sub);font-size:12px;margin:0}
.tno{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ined{position:absolute;z-index:2;background:var(--paper);border:1px solid var(--accent);padding:0;margin:0;resize:none;outline:none;overflow:auto;border-radius:0}
.selbox{position:absolute;border:1px solid var(--accent);pointer-events:none}
.selbox .h{position:absolute;width:8px;height:8px;background:var(--bg);border:1px solid var(--accent);pointer-events:auto;margin:-5px 0 0 -5px}
.tmpbox{position:absolute;border:1px dashed var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;white-space:nowrap;border:0;border-radius:0;background:transparent;padding:8px 6px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);background:transparent;border-bottom-color:var(--accent);font-weight:700}
.tab{padding:10px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>h3{margin:0;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.02em}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span{font-size:12px;color:var(--sub)}
.f>input,.f>select{width:100%}
.chk{display:flex;align-items:center;gap:6px}
textarea#tText{width:100%;min-height:140px;resize:vertical;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.pf{display:flex;flex-direction:column;gap:4px}
.pfi{display:grid;grid-template-columns:8px 44px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:1px solid var(--line);padding:6px 8px;background:var(--bg)}
.pfi i{width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--sub)}
.pfi.err i{background:var(--danger)}
.pfi.warn i{background:var(--warn)}
.pfi b{font-family:var(--num);font-weight:400;color:var(--sub)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:var(--paper);font-size:12px;line-height:16px;font-family:var(--num)}
.badge.w{background:var(--warn)}
.ok{color:var(--sub)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;padding:3px 0}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-hover);text-decoration-thickness:2px}
.pfi.hp{grid-template-columns:8px minmax(0,1fr);cursor:default}
.hpt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:8px;border:1px solid var(--line);border-radius:var(--r)}
.hpt>span{color:var(--sub)}
.hpd{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto;font-family:var(--num);font-size:12px}
.hps{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center}
.hps>b{font-weight:400;color:var(--sub);text-align:right}
.hph>span{color:var(--sub);text-align:center}
.hpf{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:var(--paper)}
.hpf>i{font-style:normal;text-align:center;padding:2px 0;color:#1a1a1a}
.hpf>i+i{border-left:1px dashed var(--line)}
.hpf>i.b{color:var(--sub)}
.dbx-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.dbx-g{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
.dbx-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:6px 8px}
.dbx-i b{font-family:var(--num);font-weight:400}
.dbx-i span{font-family:var(--num);font-size:12px;color:var(--sub)}
#dbx-msg.err{color:var(--danger)}
#neta{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0;background:var(--bg)}
#app.neta-on>#left,#app.neta-on>#stage,#app.neta-on>#right{display:none}
#app.neta-on header>*:not(#gApps){display:none}
#app.neta-on #gApps>:not(#bNeta){display:none}
#nList{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#nList .ph{border-top:0}
.nbar{display:flex;flex-direction:column;gap:6px;padding:8px}
.nbar input{width:100%}
.ntags{display:flex;flex-wrap:wrap;gap:4px}
.ntags button,.ntag{padding:0 8px;border-radius:10px;font-size:12px;line-height:18px}
.ntag{border:1px solid var(--line);color:var(--sub)}
#nItems{flex:1;overflow:auto;display:flex;flex-direction:column}
.nit{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;border-radius:0;background:transparent;padding:8px 10px 8px 7px}
.nit.cur{background:var(--bg);border-left-color:var(--accent)}
.nit b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nit small{color:var(--sub);font-family:var(--num);font-size:12px}
.nit .ntags{pointer-events:none}
.nfoot{display:flex;gap:4px;padding:8px;border-top:1px solid var(--line)}
#nEdit{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
#nEdit .f>input{width:100%}
#nTitle{font-size:16px;font-weight:700;padding:6px 8px}
#nBody{width:100%;min-height:240px;flex:1;resize:vertical;line-height:1.7;padding:8px}
.nimgs{display:flex;flex-wrap:wrap;gap:8px}
.nimg{position:relative;width:96px;height:96px;border:1px solid var(--line);background:var(--paper)}
.nimg img{width:100%;height:100%;object-fit:contain;display:block}
.nimg button{position:absolute;top:2px;right:2px;padding:0 6px;line-height:18px}
.nimgs.drop{outline:2px dashed var(--accent);outline-offset:2px}
.nact{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between}
.nempty{color:var(--sub);padding:16px}
@media (max-width:820px){
  #app.neta-on{grid-template-rows:44px minmax(0,1fr)}
  #neta{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:start;overflow:auto}
  #nEdit{overflow:visible}
  #nList{border-right:0;border-bottom:1px solid var(--line)}
  #nList .ph{flex-direction:row;justify-content:space-between;border-left:0;padding:6px 8px}
  #nList .ph>span:first-child{display:inline}
  #nList .ph .grp{flex-direction:row}
  #nItems{max-height:40vh}
  #nEdit{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.th{display:flex;flex-direction:column;gap:4px;padding:5px;text-align:left;font-size:12px}
.th.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);outline:1px solid var(--accent)}
.sw{display:block;position:relative;aspect-ratio:16/9;border:1px solid var(--line);overflow:hidden}
.sw i{position:absolute;left:0;top:0;bottom:0;width:9%}
.sw b{position:absolute;left:20%;top:50%;transform:translateY(-50%);font-size:15px;line-height:1}
.lays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.lay{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;font-size:12px}
.lay canvas{width:100%;aspect-ratio:16/9;border:1px solid var(--line);display:block}
.lays.sugs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lay.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);outline:1px solid var(--accent)}
.dlg.owide{width:min(640px,100%)}
textarea.outline{width:100%;min-height:260px;resize:vertical;line-height:1.6;font-family:var(--ui)}
.hint{font-size:12px;color:var(--sub)}
#pNotes{width:100%;min-height:90px;resize:vertical;line-height:1.6}
.aiask{display:flex;gap:6px}
.aiask input{flex:1}
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal[hidden]{display:none!important}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-dlg);padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.dlg h2{margin:0;font-size:18px;line-height:1.5}
.dlg .foot{display:flex;justify-content:flex-end;gap:6px}
.prog{height:6px;background:var(--hover);border-radius:3px;overflow:hidden}
.prog>div{height:100%;width:0;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);z-index:30;max-width:calc(100% - 32px)}
@media (min-width:1280px){
  #app{grid-template-columns:264px minmax(0,1fr) 300px}
  #pages{flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;gap:12px 8px}
  #spreads{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;align-content:flex-start;gap:36px 48px;min-width:min-content}
}
@media (min-width:1680px){
  #app{grid-template-columns:360px minmax(0,1fr) 320px}
}
@media (pointer:coarse){
  .selbox .h{width:18px;height:18px;margin:-10px 0 0 -10px}
}
@media (max-width:820px) and (pointer:coarse){
  #bZo,#bZi,#zoomLbl{display:none}
}
.dlg.dwdlg{width:min(980px,100%);height:min(88vh,900px);max-height:none;padding:0;gap:0;overflow:hidden}
.dw-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dw-bar h2{margin:0 8px 0 0}
.dw-bar .sp{flex:1}
.dw-bar input[type=number]{width:64px}
.dw-cnt{font-family:var(--num);color:var(--sub)}

.dw-side{border-left:1px solid var(--line);background:var(--stage);overflow:auto;min-height:0;display:flex;flex-direction:column}

const SEL=(k,v,opts)=>`<select id="i-${k.replace(/\./g,'-')}" data-k="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`).join('')}</select>`;

  return `<div class="row4">${['c','m','y','k'].map(x=>F(x.toUpperCase(),N(k+'.'+x,c[x],1,'min="0" max="100"'))).join('')}</div>`}

      ${F('台割',`<input type="text" id="pLabel" value="${esc(planOf(pg).title||'')}">`)}

    $('#pNotes').oninput=e=>{pg.notes=e.target.value;clearTimeout(commitT);commitT=setTimeout(commit,600)};
    $('#pTts').onclick=()=>speak(pg.notes||'',(d.pres&&d.pres.lang)||'ja');
    $('#pNoNb').onchange=e=>{pg.noNombre=e.target.checked;dirty(S.page);commit();runPreflight()};
    $('#pLabel').oninput=e=>{pg.plan=Object.assign({},planOf(pg),{title:e.target.value});clearTimeout(commitT);commitT=setTimeout(()=>{commit();rebuild()},600)};

    <div class="sec"><h3>文字</h3>${F('フォント',SEL('font',st.font,FONTS.some(f=>f[0]===st.font)?FONTS:[...FONTS,[st.font,st.font]]))}

      ${F('行送り（%）',N('leading',st.leading,5,'min="80"'))}${F('字送り（1/1000em）',N('track',st.track,10))}
      ${F('組方向',SEL('dir',st.dir,[['v','縦組み'],['h','横組み']]))}${F('揃え',SEL('align',st.align,[['start','行頭'],['center','中央'],['end','行末']]))}

  if($('#bRelink'))$('#bRelink').onclick=()=>relink(it.imageId);
  const vp=$('#bVPick');if(vp)vp.onclick=()=>{vidTarget=it;$('#fVid').click()};const vpl=$('#bVPlay');if(vpl)vpl.onclick=()=>playVideo(it);

function setPath(o,k,v){const ks=k.split('.');let t=o;for(let i=0;i<ks.length-1;i++)t=t[ks[i]];t[ks[ks.length-1]]=v}

  if(t.tagName==='SELECT'&&/^\d+$/.test(t.value)&&t.dataset.k==='weight')return +t.value;return t.value}
let commitT=0;

  const pr=PR();
  let h=`<div class="sec"><h3>書類</h3>${F('名前',`<input type="text" id="d-name" data-dk="name" value="${esc(d.name)}">`)}
    ${F('印刷所',`<select id="d-pr" data-dk="printer">${Object.entries(PRINTERS).map(([k,v])=>`<option value="${k}"${k===(d.printer||'generic')?' selected':''}>${esc(v.name)}</option>`).join('')}</select>`)}

    ${F('カラー',`<select id="d-col" data-dk="color"><option value="mono"${d.color==='mono'?' selected':''}>モノクロ（グレースケール）</option><option value="cmyk"${d.color==='cmyk'?' selected':''}>カラー（CMYK）</option></select>`)}</div></div>
    <div class="sec"><h3>マージン（mm）</h3><div class="row">${F('天',`<input type="number" id="d-mt" data-dk="margins.top" value="${m.top}" step="0.5">`)}${F('地',`<input type="number" id="d-mb" data-dk="margins.bottom" value="${m.bottom}" step="0.5">`)}
    ${F('ノド',`<input type="number" id="d-mi" data-dk="margins.inner" value="${m.inner}" step="0.5">`)}${F('小口',`<input type="number" id="d-mo" data-dk="margins.outer" value="${m.outer}" step="0.5">`)}</div></div>`;
  if(d.kind==='cover'){const sc=d.spineCalc||{pages:32,paper:0,cover:1},sp=pr.spine||'chokotto',papers=sp==='orange'?PAPERS_OR:PAPERS_CH;
    h+=`<div class="sec"><h3>背幅計算</h3><div class="row">${F('本文ページ数',`<input type="number" id="sc-p" value="${sc.pages}" step="4" min="4">`)}
      ${F('本文用紙',`<select id="sc-pa">${papers.map(([n],k)=>`<option value="${k}"${k==sc.paper?' selected':''}>${esc(n)}</option>`).join('')}</select>`)}
      ${sp==='chokotto'?F('表紙用紙',`<select id="sc-co">${COVERS_CH.map(([n],k)=>`<option value="${k}"${k==sc.cover?' selected':''}>${esc(n)}</option>`).join('')}</select>`):''}
      <label class="f"><span>背幅</span><output id="sc-out" class="num"></output></label></div>
      <div class="btns"><button id="sc-apply">背幅に反映</button></div></div>`}
  if(d.kind!=='cover')h+=`<div class="sec"><h3>ノンブル</h3><div class="row">
    ${F('位置',`<select id="d-nbm" data-dk="nombre.mode"><option value="outer"${nb.mode==='outer'?' selected':''}>小口側・下</option><option value="center"${nb.mode==='center'?' selected':''}>中央・下</option><option value="hidden"${nb.mode==='hidden'?' selected':''}>隠しノンブル（ノド側）</option><option value="none"${nb.mode==='none'?' selected':''}>なし</option></select>`)}
    ${F('開始番号',`<input type="number" id="d-nbs" data-dk="nombre.start" value="${nb.start}" step="1" min="1">`)}
    ${F('サイズ（pt）',`<input type="number" id="d-nbz" data-dk="nombre.size" value="${nb.size}" step="0.5" min="4">`)}
    ${F('下端からの距離（mm）',`<input type="number" id="d-nbo" data-dk="nombre.offset" value="${nb.offset}" step="0.5">`)}</div>
    ${F('フォント',`<select id="d-nbf" data-dk="nombre.font">${FONTS.map(([a,b])=>`<option value="${a}"${a===nb.font?' selected':''}>${b}</option>`).join('')}</select>`)}</div>`;
  $('#tab-doc').innerHTML=h;
  if(d.kind==='cover'){const calc=()=>{const v=spineOf(+$('#sc-p').value,+$('#sc-pa').value,$('#sc-co')?+$('#sc-co').value:0);$('#sc-out').textContent=v+' mm';return v};calc();
    for(const x of['#sc-p','#sc-pa','#sc-co'])if($(x))$(x).addEventListener('input',calc);
    $('#sc-apply').onclick=()=>{const v=calc();d.spineCalc={pages:+$('#sc-p').value,paper:+$('#sc-pa').value,cover:$('#sc-co')?+$('#sc-co').value:0};d.spine=v;rebuild();commit();renderDoc();toast('背幅を'+v+'mmにしました')}}

function spineOf(pages,paper,cover){const sp=PR().spine||'chokotto';pages=Math.max(0,pages|0);
  if(sp==='orange'){const t=(PAPERS_OR[paper]||PAPERS_OR[0])[1];return Math.ceil(pages/2*t)}
  const c=(PAPERS_CH[paper]||PAPERS_CH[0])[1],cv=(COVERS_CH[cover]||COVERS_CH[1])[1];return Math.round((pages*c+cv*2)*10)/10}
let docT=0;
$('#tab-doc').addEventListener('input',e=>{const t=e.target,k=t.dataset.dk;if(!k)return;let v=t.type==='number'?parseFloat(t.value):t.value;if(t.type==='number'&&(isNaN(v)||v<0))return;
  if((k==='trimW'||k==='trimH')&&v<20)return;setPath(S.doc,k,v);clearTimeout(docT);
  if(k==='printer'){S.doc.bleed=PR().bleed;rebuild();commit();renderDoc();runPreflight();return}
  const structural=['trimW','trimH','spine','bleed','binding','nombre.start'].includes(k);
  docT=setTimeout(()=>{if(structural)rebuild();else{dirtyAll();updateInfo()}commit();if(k==='color')renderProps()},t.tagName==='SELECT'?0:350)});

/* ---------- pages ---------- */
function addPages(at,n){for(let k=0;k<n;k++)S.doc.pages.splice(at,0,newPage());rebuild();commit();setPage(at);toast(n+'ページ追加しました')}
$('#bAddP').onclick=()=>{if(S.doc.kind==='cover'||S.mv)return;if(S.doc.kind==='slide'){addSlide('content');return}addPages(S.page+1,1)};
$('#bDelP').onclick=()=>{const d=S.doc;if(d.kind==='cover'||d.pages.length<=1||S.mv)return;if(d.pptx){toast('PowerPointファイルではスライドを削除できません');return}d.pages.splice(S.page,1);S.sel=null;S.page=Math.min(S.page,d.pages.length-1);rebuild();commit();renderProps();toast('ページを削除しました（Ctrl+Zで元に戻せます）')};

/* ---------- preflight ---------- */
let pfT=0,PF=[];
function preflight(){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,out=[],pr=PR(),safe=pr.safe||3,nb=d.nombre;
  if(d.kind==='body'&&d.pages.length%4!==0)out.push({lv:pr.pages4?'err':'warn',page:null,msg:`ページ数が4の倍数ではありません（${d.pages.length}ページ）`});
  if(b+1e-6<(pr.bleed||0))out.push({lv:'err',page:null,msg:`塗り足しが${pr.name}の指定（${pr.bleed}mm）より小さくなっています`});
  {const bw=d.trimW,bh=d.trimH;
    if(pr.maxW&&(Math.min(bw,bh)>pr.maxW+0.01||Math.max(bw,bh)>pr.maxH+0.01))out.push({lv:'err',page:null,msg:`${pr.name}の最大サイズ（${pr.maxW}×${pr.maxH}mm）を超えています`});
    if(pr.maxW&&bw>bh)out.push({lv:'warn',page:null,msg:'横長の本は特殊断裁（短辺綴じ）オプションが必要です'});
    if(pr.sizes&&!pr.sizes.some(([a,c])=>Math.abs(a-bw)<0.01&&Math.abs(c-bh)<0.01))out.push({lv:'warn',page:null,msg:`${pr.name}の定型サイズではありません（${bw}×${bh}mm）`})}
  if(d.kind==='body'){
    if(pr.nbReq&&nb.mode==='none')out.push({lv:'err',page:null,msg:'ノンブルは全ページに必要です'});
    else if(nb.mode!=='none'){
      if(pr.nbMin&&nb.size<pr.nbMin)out.push({lv:'err',page:null,msg:`ノンブルは${pr.nbMin}pt以上にしてください`});
      if(nb.mode==='hidden'&&pr.hiddenNg)out.push({lv:'warn',page:null,msg:'隠しノンブルは乱丁・落丁の保証対象外になります'});
      else if(pr.nbEdge&&nb.mode!=='hidden'){const half=nb.size*PT/2;if(nb.offset-half<pr.nbEdge-0.01||(nb.mode==='outer'&&d.margins.outer<pr.nbEdge-0.01))out.push({lv:'err',page:null,msg:`ノンブルは仕上がり線から${pr.nbEdge}mm以上内側に置いてください`})}
      if(pr.nbReq){const off=d.pages.map((p,i)=>p.noNombre?nombreText(i):null).filter(Boolean);if(off.length)out.push({lv:'warn',page:null,msg:`ノンブルを表示しないページがあります（${off.slice(0,6).join('、')}${off.length>6?' ほか':''}）。白紙ページにもノンブルが必要です`})}
    }
  }
  if(d.kind==='cover'&&!(d.spine>0))out.push({lv:'warn',page:0,msg:'背幅が0mmです。印刷所の背幅計算で確認してください'});
  let rgb=false;
  d.pages.forEach((pg,i)=>{
    const lab=d.kind==='cover'?'表紙':nombreText(i);
    for(const it of pg.items){
      const at={page:i,id:it.id,lab};
      if(d.kind==='slide'){if(it.type==='text'&&layout(it).overflow)out.push({lv:'err',...at,msg:'テキストがフレームからあふれています'});continue}
      if(it.type==='text'){
        const L=layout(it);
        if(L.overflow)out.push({lv:'err',...at,msg:'テキストがフレームからあふれています'});
        if(L.bbox){const x0=it.x+L.bbox.x0,x1=it.x+L.bbox.x1,y0=it.y+L.bbox.y0,y1=it.y+L.bbox.y1;
          if(x0<safe||y0<safe||x1>W-safe||y1>H-safe)out.push({lv:'warn',...at,msg:`文字が仕上がり線から${safe}mm以内にあります（断裁で切れる恐れ）`})}
      }else{
        if(it.type==='image'){
          if(!it.imageId)out.push({lv:'warn',...at,msg:'画像が配置されていない画像フレームがあります'});

  await dbxFolder(DROOT);await dbxFolder(DROOT+'/images');await dbxFolder(DROOT+'/backups');

      if(m)out.push({docId:f.name,stamp:m[1],name:m[2],n:+m[3],dir:DROOT+'/backups/'+f.name})}}
  return out.sort((a,b)=>a.stamp<b.stamp?1:-1)}
async function dbxRestore(b,progress){let j='';
  for(let i=1;i<=b.n;i++){progress&&progress('書類');j+=await dbxText(`${b.dir}/${b.stamp}_${b.name}.${i}-${b.n}.txt`)}
  const p=JSON.parse(j),images={};let k=0;const ids=Object.keys(p.images||{});
  for(const id of ids){const m=p.images[id];let src='';progress&&progress(`画像 ${++k}/${ids.length}`);
    for(let i=1;i<=m.parts;i++)src+=await dbxText(`${DROOT}/images/${id}.${i}.txt`);
    src=src.replace(/\s+/g,'');if(m.len&&src.length!==m.len)throw new Error('画像データが壊れています：'+(m.name||id));

function dbxSchedule(){clearInterval(DB.timer);if(!DB.auto||!DB.mcp)return;

const PLAN_KINDS=[['title','扉'],['toc','目次'],['body','本文'],['illust','イラスト'],['colophon','奥付'],['blank','白'],['other','その他']];

function autoDaiwari(sections,opts){
  const d=S.doc;if(d.kind==='cover')return null;opts=Object.assign({unit:4,oddStart:false,colophonLast:true},opts);
  const seq=[];let colophon=null;
  for(const s of sections){const n=Math.max(0,s.pages|0);if(!n)continue;
    if(s.kind==='colophon'&&opts.colophonLast){colophon=s;continue}
    if(opts.oddStart&&seq.length%2===1&&seq.length>0)seq.push({kind:'blank',title:'',note:''});
    for(let k=0;k<n;k++)seq.push({kind:s.kind||'body',title:s.title||'',note:''})}
  const cn=colophon?Math.max(1,colophon.pages|0):0,unit=Math.max(1,opts.unit|0);
  const total=Math.ceil((seq.length+cn)/unit)*unit;
  while(seq.length+cn<total)seq.push({kind:'blank',title:'',note:''});
  for(let k=0;k<cn;k++)seq.push({kind:'colophon',title:colophon.title||'奥付',note:''});
  let removed=0;
  while(d.pages.length<seq.length)d.pages.push(newPage());
  while(d.pages.length>seq.length&&!d.pages[d.pages.length-1].items.length){d.pages.pop();removed++}
  d.pages.forEach((p,i)=>{p.plan=seq[i]?Object.assign({},seq[i]):{kind:'other',title:'',note:''}});
  S.sel=null;S.page=Math.min(S.page,d.pages.length-1);rebuild();commit();renderAll();
  return{total:seq.length,pages:d.pages.length,removed};
}

function hpChecks(P){

function hpDrawSide(ctx,P,sd,o,test){

      ctx.fillStyle='#000000';ctx.textAlign='center';ctx.textBaseline='middle';

      ctx.font=`700 ${fs*0.35}px "BIZ UDPGothic", sans-serif`;ctx.fillText('▲ 上',x0+P.W/2,P.H*0.12);

  const cw=P.cw,H=P.H;

function jpegPDF(pages,dup){
  const parts=[];let len=0;const offs=[];

  const obj=(id,body,stream)=>{offs[id]=len;push(id+' 0 obj\n'+body);if(stream){push('\nstream\n');push(stream);push('\nendstream')}push('\nendobj\n')};
  push('%PDF-1.7\n');push(new Uint8Array([37,226,227,207,211,10]));
  const f=v=>(Math.round(v*MMPT*1000)/1000).toString(),kids=[];let id=4;
  for(const p of pages){
    const pid=id,cid=id+1,iid=id+2;id+=3;kids.push(pid);
    obj(iid,`<< /Type /XObject /Subtype /Image /Width ${p.px[0]} /Height ${p.px[1]} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>`,p.jpg);
    const cs=`q ${f(p.w)} 0 0 ${f(p.h)} 0 0 cm /Im0 Do Q`;
    obj(cid,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(p.w)} ${f(p.h)}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`);
  }
  const vp=`/ViewerPreferences << /PrintScaling /None /Duplex /${dup==='short'?'DuplexFlipShortEdge':dup==='long'?'DuplexFlipLongEdge':'Simplex'} >>`;
  obj(1,`<< /Type /Catalog /Pages 2 0 R ${vp} >>`);
  obj(2,`<< /Type /Pages /Kids [${kids.map(x=>x+' 0 R').join(' ')}] /Count ${kids.length} >>`);
  obj(3,`<< /Title ${pdfStr(S.doc.name||'無題')} /Creator (Thinbook) /Producer (Thinbook) >>`);
  const xref=len,N=id;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let j=1;j<N;j++)x+=String(offs[j]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${N} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
async function hpRender(P,o,sides,test,progress){
  if(!test)await ensureFonts();else await document.fonts.load('700 20px "BIZ UDPGothic"','表裏枚目上白p.0123456789').catch(()=>{});

  const k=dpi/25.4,cv=document.createElement('canvas');cv.width=Math.round(P.pW*k);cv.height=Math.round(P.pH*k);
  const ctx=cv.getContext('2d'),out=[];
  for(let j=0;j<sides.length;j++){
    if(exporting==='cancel')return null;
    ctx.setTransform(k,0,0,k,0,0);hpDrawSide(ctx,P,sides[j],o,test);
    const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));

}

  return`<div class="sv-pos">

      return`<button class="sv-it" data-inc="${it.id}"><b>${esc(it.name||'無題')}</b><span class="p">${yen(it.price)}</span>${rest==null?'':`<span class="r${rest<=0?' out':''}">残 ${rest}</span>`}${c?`<span class="c">×${c}</span>`:''}</button>`}).join('')}</div>
    <div class="sv-cart">

      <label class="f"><span>預かり</span><input type="number" id="sv-paid" inputmode="numeric" min="0" step="1" value="${paid==null?'':paid}"></label>
      <div class="sv-big"><span>お釣り</span><b id="sv-change" class="${change!=null&&change<0?'short':''}">${change==null?'—':change<0?'不足 '+yen(-change):yen(change)}</b></div>
      <div class="sv-row"><button data-act="clear">クリア</button><button class="primary grow" data-act="checkout"${total>0?'':' disabled'}>会計する</button></div>

function svSum(ev){const sold=svSold(ev),total=ev.sales.reduce((a,s)=>a+s.total,0),qty=Object.values(sold).reduce((a,b)=>a+b,0);
  const names={};ev.items.forEach(it=>names[it.id]=it.name);
  const hist=[...ev.sales].reverse().map(s=>{const t=new Date(s.t);
    return`<span class="t">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span><span class="x">${s.lines.map(l=>esc(names[l.i]||l.n)+(l.q>1?' ×'+l.q:'')).join('、')}</span><span class="a">${yen(s.total)}</span><button data-void="${s.id}">取消</button>`}).join('');
  return`<div class="sv-stats">
      <div><span>売上</span><b>${yen(total)}</b></div>
      <div><span>会計数</span><b>${ev.sales.length}</b></div>
      <div><span>頒布数</span><b>${qty}</b></div>
      <div><span>手元現金（釣り銭込み）</span><b>${yen(total+(+ev.float||0))}</b></div>
    </div>
    <table class="sv-tbl"><thead><tr><th>頒布物</th><th>単価</th><th>頒布</th><th>残</th><th>売上</th></tr></thead><tbody>
    ${ev.items.map(it=>{const l=svLeft(ev,it,sold),n=sold[it.id]||0;return`<tr><td>${esc(it.name||'無題')}</td><td>${yen(it.price)}</td><td>${n}</td><td class="${l!=null&&l<=0?'out':''}">${l==null?'—':l}</td><td>${yen(n*(+it.price||0))}</td></tr>`}).join('')}
    </tbody></table>
    <section class="sv-sec"><h3>履歴</h3>${hist?`<div class="sv-hist">${hist}</div>`:'<div class="sv-empty">なし</div>'}</section>
    <div class="sv-row"><button data-act="csv"${ev.sales.length?'':' disabled'}>CSV書き出し</button></div>`}

function svItems(ev){
  return`<section class="sv-sec">
    <div class="sv-edit"><h3>名前</h3><h3>価格</h3><h3>搬入数</h3><span></span></div>
    ${ev.items.map(it=>`<div class="sv-edit" data-item="${it.id}"><input type="text" data-f="name" value="${esc(it.name)}" aria-label="名前"><input type="number" class="num" data-f="price" inputmode="numeric" min="0" step="100" value="${it.price}" aria-label="価格"><input type="number" class="num" data-f="stock" inputmode="numeric" min="0" step="1" value="${it.stock??''}" aria-label="搬入数"><button data-delitem="${it.id}" aria-label="削除">削除</button></div>`).join('')}
    <div class="sv-row"><button data-act="additem">頒布物を追加</button></div></section>
    <label class="f sv-float"><span>釣り銭準備金</span><input type="number" class="num" id="sv-float" inputmode="numeric" min="0" step="1000" value="${ev.float||''}"></label>`}

function svMemo(ev){const others=SV.data.events.filter(e=>e!==ev&&(e.memo||'').trim()).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return`<textarea id="sv-memo" aria-label="反省メモ">${esc(ev.memo||'')}</textarea>
    ${others.length?`<section class="sv-sec"><h3>過去のイベント</h3>${others.map(e=>`<div class="sv-memo"><b>${svYMD(e.date)}　${esc(e.name||'無題のイベント')}</b><p>${esc(e.memo)}</p></div>`).join('')}</section>`:''}`}

function svInfo(ev){const F2=(lab,k,type,wide)=>`<label class="f${wide?' wide':''}"><span>${lab}</span><input type="${type}" data-ef="${k}" value="${esc(ev[k]||'')}"></label>`;
  return`<div class="sv-form">${F2('イベント名','name','text',true)}${F2('開催日','date','date')}${F2('スペース','space','text')}${F2('会場','venue','text',true)}${F2('申込締切','applyDue','date')}${F2('入稿締切','submitDue','date')}</div>
    <div class="sv-row"><button data-act="delev" class="danger">イベントを削除</button></div>`}

function svAddEvent(){const{up,past}=svSorted();const prev=past[0]||up[up.length-1];
  const ev={id:uid(),name:'',date:'',venue:'',space:'',applyDue:'',submitDue:'',float:prev?prev.float||0:0,
    items:prev?prev.items.map(it=>({id:uid(),name:it.name,price:it.price,stock:it.stock})):[],sales:[],memo:''};
  SV.data.events.push(ev);SV.ev=ev.id;SV.tab='info';SV.cart={};SV.paid=null;svSave();svRender();
  const n=$('#sv [data-ef="name"]');if(n)n.focus()}
function svCheckout(ev){const total=svCartTotal(ev);if(!(total>0))return;
  if(SV.paid!=null&&SV.paid<total){toast('預かり金額が不足しています');return}
  const lines=Object.entries(SV.cart).map(([i,q])=>{const it=ev.items.find(x=>x.id===i);return it?{i,n:it.name,q,p:+it.price||0}:null}).filter(Boolean);
  ev.sales.push({id:uid(),t:Date.now(),lines,total,paid:SV.paid==null?total:SV.paid});
  const ch=SV.paid==null?0:SV.paid-total;SV.cart={};SV.paid=null;svSave(true);svRender();toast(`${yen(total)} 会計しました`+(ch>0?`（お釣り ${yen(ch)}）`:''))}
function svCSV(ev){const q=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['日時','頒布物','単価','数量','小計','会計合計','預かり']];
  for(const s of ev.sales){const t=new Date(s.t),ts=`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    s.lines.forEach((l,k)=>rows.push([ts,l.n,l.p,l.q,l.p*l.q,k?'':s.total,k?'':s.paid]))}
  saveFile(`${ev.name||'イベント'}_${ev.date||''}_売上.csv`,new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}))}

$('#sv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ev=svCur(),d=b.dataset;

  if(d.delitem){const it=ev.items.find(x=>x.id===d.delitem);if(it&&(!(svSold(ev)[it.id])||confirm('販売記録のある頒布物です。削除すると集計から外れます。削除しますか？'))){ev.items=ev.items.filter(x=>x!==it);delete SV.cart[it.id];svSave();svRender()}return}
  switch(d.act){
    case'close':svClose();break;

    case'add':svAddEvent();break;

    case'backup':saveFile(`thinbook_イベント_${svToday()}.json`,new Blob([JSON.stringify({app:'thinbook-sales',version:1,...SV.data})],{type:'application/json'}));break;
    case'restore':$('#fSales').click();break;
  }});
$('#sv').addEventListener('input',e=>{const t=e.target,ev=svCur();if(!ev)return;
  if(t.id==='sv-paid'){SV.paid=t.value===''?null:+t.value;const total=svCartTotal(ev),c=SV.paid==null?null:SV.paid-total,o=$('#sv-change');
    o.textContent=c==null?'—':c<0?'不足 '+yen(-c):yen(c);o.classList.toggle('short',c!=null&&c<0);return}

    it[t.dataset.f]=t.dataset.f==='name'?t.value:t.value===''?(t.dataset.f==='stock'?'':0):+t.value;svSave()}});
$('#sv').addEventListener('change',e=>{if(e.target.dataset.ef==='date')svRender()});

window.addEventListener('keydown',e=>{if($('#sv').hidden)return;e.stopPropagation();

const N8={list:[],cur:null,q:'',tag:'',open:false,t:0};
const netaEl=$('#neta');
function netaSave(){clearTimeout(N8.t);N8.t=setTimeout(()=>kvSet('neta',N8.list),400)}
function netaTags(s){return[...new Set(String(s).split(/[,、，\s]+/).map(x=>x.replace(/^#/,'').trim()).filter(Boolean))]}
function netaDate(t){const d=new Date(t);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function netaCur(){return N8.list.find(n=>n.id===N8.cur)||null}
function netaNew(){const t=Date.now(),n={id:uid(),title:'',body:'',tags:N8.tag?[N8.tag]:[],images:[],created:t,updated:t};N8.list.unshift(n);N8.cur=n.id;N8.q='';$('#nQ').value='';netaSave();netaRenderList();netaRenderEdit();$('#nTitle').focus()}
function netaTouch(n){n.updated=Date.now();N8.list.sort((a,b)=>b.updated-a.updated);netaSave()}
function netaMatch(n){if(N8.tag&&!n.tags.includes(N8.tag))return false;if(!N8.q)return true;const q=N8.q.toLowerCase();return(n.title+'\n'+n.body+'\n'+n.tags.join(' ')).toLowerCase().includes(q)}
function netaRenderList(){
  const all=[...new Set(N8.list.flatMap(n=>n.tags))].sort((a,b)=>a.localeCompare(b,'ja'));if(N8.tag&&!all.includes(N8.tag))N8.tag='';
  $('#nTagF').innerHTML=all.map(t=>`<button data-tag="${esc(t)}" class="${t===N8.tag?'on':''}">${esc(t)}</button>`).join('');
  const vis=N8.list.filter(netaMatch);
  $('#nItems').innerHTML=vis.length?vis.map(n=>`<button class="nit${n.id===N8.cur?' cur':''}" data-id="${n.id}"><b>${esc(n.title||'無題')}</b><small>${netaDate(n.updated)}${n.images.length?' ・ 画像'+n.images.length:''}</small>${n.tags.length?`<span class="ntags">${n.tags.map(t=>`<span class="ntag">${esc(t)}</span>`).join('')}</span>`:''}</button>`).join(''):`<div class="nempty">${N8.list.length?'該当なし':'ネタがありません'}</div>`;
}
function netaRenderEdit(){
  const n=netaCur(),el=$('#nEdit');
  if(!n){el.innerHTML=`<div class="nempty"><button class="primary" id="nAdd2">ネタを追加</button></div>`;$('#nAdd2').onclick=netaNew;return}
  el.innerHTML=`<input type="text" id="nTitle" value="${esc(n.title)}" placeholder="タイトル" aria-label="タイトル">
    ${F('タグ',`<input type="text" id="nTagIn" value="${esc(n.tags.join(', '))}" placeholder="カンマ区切り">`)}
    <textarea id="nBody" spellcheck="false" aria-label="本文">${esc(n.body)}</textarea>
    <div class="sec"><h3>画像</h3><div class="nimgs" id="nImgs">${n.images.map((im,k)=>`<div class="nimg"><img src="${im.src}" alt="${esc(im.name||'')}"><button data-rm="${k}" aria-label="画像を削除">×</button></div>`).join('')}<button id="nImgAdd" class="nimg" aria-label="画像を追加">＋</button></div></div>
    <div class="nact"><button id="nDel">削除</button><button class="primary" id="nBook">このネタで新規書類</button></div>`;
  $('#nTitle').oninput=e=>{n.title=e.target.value;netaTouch(n);netaRenderList()};
  $('#nBody').oninput=e=>{n.body=e.target.value;netaTouch(n)};
  $('#nTagIn').onchange=e=>{n.tags=netaTags(e.target.value);e.target.value=n.tags.join(', ');netaTouch(n);netaRenderList()};
  $('#nImgAdd').onclick=()=>$('#fNetaImg').click();
  $('#nImgs').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;n.images.splice(+b.dataset.rm,1);netaTouch(n);netaRenderEdit();netaRenderList()};
  $('#nDel').onclick=()=>{const d=modal(`<h2>「${esc(n.title||'無題')}」を削除しますか？</h2><div class="foot"><button id="nd-c">キャンセル</button><button class="primary" id="nd-ok">削除</button></div>`);
    $('#nd-c').onclick=closeModal;$('#nd-ok').onclick=()=>{N8.list=N8.list.filter(x=>x!==n);N8.cur=(N8.list.find(netaMatch)||{}).id||null;netaSave();closeModal();netaRenderList();netaRenderEdit()}};
  $('#nBook').onclick=()=>netaToBook(n);
}
async function netaAddImages(files){const n=netaCur();if(!n)return;
  for(const f of files){if(!f.type.startsWith('image/'))continue;try{const im=await readImage(f);n.images.push({id:uid(),src:im.src,w:im.w,h:im.h,name:im.name||''})}catch(e){toast(e.message)}}
  netaTouch(n);netaRenderEdit();netaRenderList()}
function netaToBook(n){
  $('#bNew').onclick();const ok=$('#n-ok'),orig=ok.onclick;
  ok.onclick=async()=>{orig();if(!$('#modal').hidden)return;
    const d=S.doc;d.name=n.title||'無題';
    if(d.kind!=='cover'){
      if(n.body.trim()){const m=margBox(0);d.pages[0].items.push(textItem({x:m.x,y:m.y,w:m.w,h:m.h,text:n.body}))}
      let pi=n.body.trim()?1:0;
      for(const im of n.images){
        while(pi>=d.pages.length)d.pages.push({id:uid(),items:[],noNombre:false});
        const img=new Image();await new Promise(r=>{img.onload=img.onerror=r;img.src=im.src});
        const id=uid();S.images[id]={src:im.src,w:im.w,h:im.h,name:im.name,img};
        const m=margBox(pi);d.pages[pi].items.push(imageItem({x:r1(m.x),y:r1(m.y),w:r1(m.w),h:r1(m.h),fit:'contain',imageId:id}));pi++;
      }
    }
    netaShow(false);fitZoom();rebuild();renderAll();resetHistory();toast('ネタから書類を作成しました');
  };
}
function netaShow(on){N8.open=on;$('#app').classList.toggle('neta-on',on);netaEl.hidden=!on;$('#bNeta').textContent=on?'← 冊子':'ネタ帳';
  if(on){if(!netaCur())N8.cur=(N8.list[0]||{}).id||null;netaRenderList();netaRenderEdit()}else{dirtyAll()}}
$('#bNeta').onclick=()=>netaShow(!N8.open);
$('#nAdd').onclick=netaNew;
$('#nQ').oninput=e=>{N8.q=e.target.value.trim();netaRenderList()};
$('#nTagF').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;N8.tag=N8.tag===b.dataset.tag?'':b.dataset.tag;netaRenderList()};
$('#nItems').onclick=e=>{const b=e.target.closest('.nit');if(!b)return;N8.cur=b.dataset.id;netaRenderList();netaRenderEdit()};

$('#nEdit').addEventListener('dragleave',e=>{if(!e.currentTarget.contains(e.relatedTarget)){const g=$('#nImgs');if(g)g.classList.remove('drop')}});
$('#nEdit').addEventListener('drop',e=>{e.preventDefault();const g=$('#nImgs');if(g)g.classList.remove('drop');netaAddImages([...e.dataTransfer.files])});
$('#nEdit').addEventListener('paste',e=>{const fs=[...(e.clipboardData&&e.clipboardData.files)||[]].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();netaAddImages(fs)}});

$('#nExp').onclick=()=>saveFile('ネタ帳.thinbook-neta.json',new Blob([JSON.stringify({app:'thinbook-neta',version:1,notes:N8.list})],{type:'application/json'}));
$('#nImp').onclick=()=>$('#fNeta').click();

  try{const p=JSON.parse(await f.text());if(!p||p.app!=='thinbook-neta'||!Array.isArray(p.notes))throw new Error('ネタ帳のファイルではありません');
    const have=new Set(N8.list.map(n=>n.id));let k=0;for(const n of p.notes){if(!n||!n.id||have.has(n.id))continue;N8.list.push({title:'',body:'',tags:[],images:[],created:Date.now(),updated:Date.now(),...n});k++}
    N8.list.sort((a,b)=>b.updated-a.updated);netaSave();netaRenderList();netaRenderEdit();toast(k+'件読み込みました')}
  catch(err){toast(err.message||'読み込めませんでした')}});

function kindOf(s){s=String(s||'').trim();if(!s)return'body';if(KIND_LABEL[s])return s;if(KIND_ALIAS[s])return KIND_ALIAS[s];for(const[k,v]of Object.entries(KIND_ALIAS))if(s.includes(k))return v;return'other'}

const DW_PROMPT=`画像は冊子（同人誌など）の台割ラフで、紙に手書きされたものです。画像が複数ある場合は続きのページとしてまとめて1つのJSONにしてください。各ページの内容を読み取り、次の形式のJSONだけを返してください。
{"bookTitle": string|null, "total": number|null, "pages": [{"from": number, "to": number, "kind": "body"|"title"|"toc"|"illust"|"colophon"|"blank"|"other", "title": string, "note": string}]}
例: {"bookTitle":"夏の本","total":24,"pages":[{"from":1,"to":1,"kind":"title","title":"夏の本","note":""},{"from":2,"to":2,"kind":"toc","title":"","note":""},{"from":3,"to":12,"kind":"body","title":"第一話","note":""}]}
- from/to は本文のページ番号（1始まり、範囲の両端を含む）。表紙（表1〜表4）は含めない。
- kind: body=本文・漫画・小説、title=扉・中扉、toc=目次、illust=イラスト・口絵、colophon=奥付、blank=白・空白ページ、other=広告・あとがき・その他。
- title はそのページに書かれた作品名・章題・見出し。なければ空文字。
- note はそれ以外の書き込み（カラー、ゲスト名、見開き など）。なければ空文字。
- total は総ページ数。書かれていなければ最後のページ番号。
- ページ番号がない場合は、枠の並び順（右綴じなら右から左、上から下）で数える。
- 読めない文字は推測せず、読めた部分だけを入れる。
専用記入用紙（上部に「Thinbook 台割」と印字、四隅に黒い四角、ページごとの枠）の場合:
- 各枠の左上の太字の数字が印字済みのページ番号。これをそのまま from/to に使う。
- 種類は枠内のチェックボックス（本文・扉・目次・イラスト・奥付・白）のうち、レ点・×・塗りつぶし・丸囲みのあるもの。何も印がなく、タイトルもメモも空なら、その枠は出力しない。
- 「タイトル」欄の手書きを title、「メモ」欄の手書きを note にする。「〃」「同上」や前の枠から続く矢印・線は、前のページと同じ種類・タイトルを意味する。

async function callApi(key,blobs){

async function analyzeRough(){

function hideHTML(text,lvl,lang){
  if(!text)return'';

  if(lvl===3)return `<span class="hid blk" data-rv>${esc(text).replace(/\n/g,'<br>')}</span>`;
  let k=0,h='';
  for(const s of words(text,lang)){
    const t=s.segment;
    if(t.includes('\n')){h+=esc(t).replace(/\n/g,'<br>');continue}
    if(!s.isWordLike){h+=esc(t);continue}
    k++;
    if(lvl===1){h+=(k%3===0||(k%5===2))?`<span class="hid" data-rv>${esc(t)}</span>`:esc(t);continue}
    const ch=[...t];h+=esc(ch[0])+(ch.length>1?`<span class="hid" data-rv>${esc(ch.slice(1).join(''))}</span>`:'');

    let st='';if(h==='center'||h==='centerContinuous'||(!h&&d.center))st+='text-align:center;';else if(h==='left')st+='text-align:left;';
    if(fo){if(fo.b)st+='font-weight:700;';if(fo.i)st+='font-style:italic;';if(fo.u)st+='text-decoration:underline;'}return{k:k.join(' '),st}}
  function render(){
    const sh=X.sheets[X.cur],R=Math.min(Math.max(sh.maxR+20,60),MAXR),C=Math.min(Math.max(sh.maxC+5,26),MAXC);sh.R=R;sh.C=C;
    const cover=new Map();for(const m of sh.merges){for(let r=m.r1;r<=m.r2;r++)for(let c=m.c1;c<=m.c2;c++)cover.set(r+':'+c,r===m.r1&&c===m.c1?m:null)}
    let tw=44,cg='';for(let c=1;c<=C;c++){const w=colPx(sh,c);tw+=w;cg+=`<col style="width:${w}px">`}let h=`<table class="xt" style="width:${tw}px"><colgroup><col style="width:44px">`+cg;h+=`</colgroup><thead><tr><th></th>`;
    for(let c=1;c<=C;c++)h+=`<th data-hc="${c}">${colName(c)}</th>`;h+=`</tr></thead><tbody>`;
    for(let r=1;r<=R;r++){const row=sh.rows.get(r);const hid=row&&/^(1|true)$/.test(row.getAttribute('hidden')||'');const ht=row&&row.getAttribute('ht')?Math.round(+row.getAttribute('ht')*4/3):0;
      h+=`<tr${hid?' hidden':''}${ht?` style="height:${ht}px"`:''}><th data-hr="${r}">${r}</th>`;
      for(let c=1;c<=C;c++){const k=r+':'+c;let span='';if(cover.has(k)){const m=cover.get(k);if(!m)continue;span=` colspan="${Math.min(m.c2,C)-m.c1+1}" rowspan="${Math.min(m.r2,R)-m.r1+1}"`}
        const el=sh.cells.get(k),d=display(sh,el),s=cls(sh,el,d);h+=`<td data-r="${r}" data-c="${c}"${span}${s.k?` class="${s.k}"`:''}${s.st?` style="${s.st}"`:''}>${esc(d.t)}</td>`}
      h+=`</tr>`}
    $('#xlTbl').innerHTML=h+`</tbody></table>`;
    if(sh.maxR>MAXR||sh.maxC>MAXC)toast(`表示は${MAXR}行・${colName(MAXC)}列までです`);
    markSel();
  }
  function tdAt(r,c){return grid().querySelector(`td[data-r="${r}"][data-c="${c}"]`)}
  function mergeAt(sh,r,c){return sh.merges.find(m=>r>=m.r1&&r<=m.r2&&c>=m.c1&&c<=m.c2)}
  function refreshCell(r,c){const sh=X.sheets[X.cur],td=tdAt(r,c);if(!td)return;const el=sh.cells.get(r+':'+c),d=display(sh,el),s=cls(sh,el,d);td.textContent=d.t;td.className=s.k;td.setAttribute('style',s.st)}
  function markSel(){const sh=X.sheets[X.cur];if(!sh)return;grid().querySelectorAll('.sel,.hl').forEach(e=>e.classList.remove('sel','hl'));
    const m=mergeAt(sh,X.sel.r,X.sel.c);if(m)X.sel={r:m.r1,c:m.c1};const td=tdAt(X.sel.r,X.sel.c);
    if(td){td.classList.add('sel');const g=grid(),hd=44,top=g.querySelector('thead').offsetHeight;
      if(td.offsetLeft-hd<g.scrollLeft)g.scrollLeft=td.offsetLeft-hd;else if(td.offsetLeft+td.offsetWidth>g.scrollLeft+g.clientWidth)g.scrollLeft=td.offsetLeft+td.offsetWidth-g.clientWidth;
      if(td.offsetTop-top<g.scrollTop)g.scrollTop=td.offsetTop-top;else if(td.offsetTop+td.offsetHeight>g.scrollTop+g.clientHeight)g.scrollTop=td.offsetTop+td.offsetHeight-g.clientHeight}
    const a=grid().querySelector(`th[data-hc="${X.sel.c}"]`),b=grid().querySelector(`th[data-hr="${X.sel.r}"]`);if(a)a.classList.add('hl');if(b)b.classList.add('hl');
    $('#xlRef').value=ref(X.sel.r,X.sel.c);const v=editText(sh,sh.cells.get(X.sel.r+':'+X.sel.c));$('#xlIn').value=v;$('#xlIn').dataset.orig=v;ed.value='';setMode('ready');placeEd()}
  function move(dr,dc){const sh=X.sheets[X.cur];if(!sh)return;let{r,c}=X.sel;const m=mergeAt(sh,r,c);if(m){if(dr>0)r=m.r2;if(dc>0)c=m.c2}
    r=clamp(r+dr,1,sh.R);c=clamp(c+dc,1,sh.C);X.sel={r,c};markSel()}
  const ed=$('#xlCell'),inp=$('#xlIn');let mode='ready',composing=false;
  function setMode(m){mode=m;ed.classList.toggle('on',m!=='ready');if(m==='ready')ed.style.width=ed.style.minWidth}
  function placeEd(){const td=tdAt(X.sel.r,X.sel.c);if(!td){ed.hidden=true;return}ed.hidden=false;const g=grid(),gr=g.getBoundingClientRect(),r=td.getBoundingClientRect();
    ed.style.left=(r.left-gr.left+g.scrollLeft)+'px';ed.style.top=(r.top-gr.top+g.scrollTop)+'px';ed.style.minWidth=ed.style.width=r.width+'px';ed.style.height=r.height+'px'}
  function focusEd(){if(!$('#xl').hidden&&X.sheets.length&&!ed.hidden)ed.focus({preventScroll:true})}
  function commitInput(){const sh=X.sheets[X.cur];if(!sh||inp.disabled)return false;const v=inp.value;setMode('ready');ed.value='';if(v===inp.dataset.orig)return false;
    const{r,c}=X.sel;const was=sh.cells.get(r+':'+c);const hadShared=was&&kid(was,'f')&&kid(was,'f').hasAttribute('ref');
    setCell(sh,r,c,v);inp.dataset.orig=v;if(hadShared){render();return true}refreshCell(r,c);return true}
  function cancelInput(){inp.value=inp.dataset.orig||'';ed.value='';setMode('ready')}
  function startEdit(){ed.value=inp.value;setMode('edit');ed.style.width=Math.max(parseFloat(ed.style.minWidth)||0,ed.scrollWidth)+'px';ed.focus({preventScroll:true});ed.setSelectionRange(ed.value.length,ed.value.length)}
  function tabs(){$('#xlTabs').innerHTML=X.sheets.map((s,i)=>s.hidden?'':`<button data-i="${i}" class="${i===X.cur?'on':''}${s.dirty?' dirty':''}">${esc(s.name)}</button>`).join('')}
  function hist(){$('#xlUndo').disabled=!X.undo.length;$('#xlRedo').disabled=!X.redo.length}
  function show(on){$('#xl').hidden=!on;if(on)setTimeout(()=>{focusEd();if(!X.sheets.length)$('#xlOpen2').focus()},0)}

  /* ----- events ----- */
  $('#xlBack').onclick=()=>show(false);
  $('#xlOpen').onclick=$('#xlOpen2').onclick=()=>$('#fXl').click();
  $('#fXl').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)});
  async function openFile(f){if(X.dirty&&!confirm('保存していない変更を破棄して開きますか？'))return;show(true);try{await open(f);toast('開きました：'+f.name);focusEd()}catch(err){console.error(err);toast(err.message||'開けませんでした')}}
  $('#xlSave').onclick=async()=>{try{await save()}catch(err){console.error(err);toast('保存できませんでした：'+(err.message||err))}};
  $('#xlUndo').onclick=()=>stepHist(X.undo,X.redo);
  $('#xlRedo').onclick=()=>stepHist(X.redo,X.undo);
  $('#xlTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showSheet(+b.dataset.i).then(focusEd)});
  grid().addEventListener('pointerdown',e=>{const td=e.target.closest('td');if(!td){if(e.target===ed)return;return}e.preventDefault();commitInput();X.sel={r:+td.dataset.r,c:+td.dataset.c};markSel();focusEd()});
  grid().addEventListener('dblclick',e=>{if(e.target===ed&&mode==='ready'||e.target.closest('td'))startEdit()});
  grid().addEventListener('dragover',e=>e.preventDefault());
  grid().addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&/\.xlsx$/i.test(f.name))openFile(f)});
  for(const t of[ed,inp]){t.addEventListener('compositionstart',()=>{composing=true;if(t===ed&&mode==='ready')setMode('enter')});t.addEventListener('compositionend',()=>composing=false)}
  ed.addEventListener('input',()=>{if(mode==='ready')setMode('enter');inp.value=ed.value;ed.style.width=Math.max(parseFloat(ed.style.minWidth)||0,ed.scrollWidth)+'px'});
  ed.addEventListener('copy',e=>{if(mode!=='ready')return;e.preventDefault();e.clipboardData.setData('text/plain',inp.dataset.orig||'')});
  ed.addEventListener('keydown',e=>{if(mode==='ready'||composing||e.isComposing)return;
    const nav={Enter:[e.shiftKey?-1:1,0],Tab:[0,e.shiftKey?-1:1]};if(mode==='enter')Object.assign(nav,{ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]});
    if(e.key==='Enter'&&e.altKey){e.preventDefault();ed.setRangeText('\n',ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input'));return}
    if(nav[e.key]){e.preventDefault();commitInput();move(...nav[e.key]);focusEd();return}
    if(e.key==='Escape'){e.preventDefault();cancelInput()}});
  inp.addEventListener('keydown',e=>{if(composing||e.isComposing)return;
    if(e.key==='Enter'&&!e.altKey){e.preventDefault();commitInput();move(e.shiftKey?-1:1,0);focusEd()}
    else if(e.key==='Enter'&&e.altKey){e.preventDefault();inp.setRangeText('\n',inp.selectionStart,inp.selectionEnd,'end')}
    else if(e.key==='Tab'){e.preventDefault();commitInput();move(0,e.shiftKey?-1:1);focusEd()}
    else if(e.key==='Escape'){e.preventDefault();cancelInput();focusEd()}});
  $('#xl').addEventListener('keydown',e=>e.stopPropagation());
  window.addEventListener('keydown',e=>{
    if($('#xl').hidden)return;
    if(!$('#xl').contains(e.target))e.stopPropagation();
    const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
    if(mod&&k==='s'){e.preventDefault();$('#xlSave').click();return}
    const a=document.activeElement;
    if(!X.sheets.length||!$('#modal').hidden||!(a===ed&&mode==='ready'||a===grid()||a===document.body))return;
    if(mod&&k==='z'){e.preventDefault();e.shiftKey?stepHist(X.redo,X.undo):stepHist(X.undo,X.redo);return}
    if(mod&&k==='y'){e.preventDefault();stepHist(X.redo,X.undo);return}
    const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],Enter:[e.shiftKey?-1:1,0],Tab:[0,e.shiftKey?-1:1]}[e.key];
    if(mv&&!mod){e.preventDefault();move(...mv);focusEd();return}
    if(e.key==='F2'){e.preventDefault();startEdit();return}
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();inp.value='';commitInput();markSel();return}
    if(a!==ed)focusEd();
  },true);
  return{X,open,openFile,save,show,setCell:(r,c,t)=>{const sh=X.sheets[X.cur];setCell(sh,r,c,t);refreshCell(r,c);markSel()},shiftF};
})();
$('#bXl').onclick=()=>XL.show(true);
window.__thinbook.XL=XL;
</script>
