<title>Thinbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
/* Layout: header / pages | spread stage | inspector — a production tool, flat and dense */
:root{
  --bg:#ffffff; --panel:#f3f5f7; --stage:#d9dee4; --ink:#15181c; --sub:#5d6670; --line:#d0d6dc; --hover:#e6eaee;
  --accent:#1d5cff; --accent-ink:#ffffff; --danger:#e0243a; --warn:#c25a00; --guide:#8b3dff; --paper:#ffffff;
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --panel:#1e2125; --stage:#2a2e34; --ink:#e8ebee; --sub:#9aa3ad; --line:#383d44; --hover:#2a2f35;
  --accent:#5c8aff; --accent-ink:#0b0d10; --danger:#ff5468; --warn:#ff9d3d; --guide:#a770ff; --paper:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1e2125; --stage:#2a2e34; --ink:#e8ebee; --sub:#9aa3ad; --line:#383d44; --hover:#2a2f35;
  --accent:#5c8aff; --accent-ink:#0b0d10; --danger:#ff5468; --warn:#ff9d3d; --guide:#a770ff; --paper:#ffffff; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;line-height:1.4}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input[type=number]{font-family:var(--num);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:172px minmax(0,1fr) 280px;grid-template-rows:44px minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.logo{font-weight:700;font-size:15px;letter-spacing:.04em}
.grp{display:flex;gap:4px;align-items:center}
#zoomLbl{font-family:var(--num);min-width:44px;text-align:center}
#docInfo{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.tools button{padding:6px 4px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.ph .grp button{padding:0 8px}
#pages{padding:8px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.tsp{display:flex;justify-content:center;gap:2px}
.tslot{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumb{border:1px solid var(--line);background:var(--paper);cursor:pointer;display:block}
.thumb.cur{outline:2px solid var(--accent)}
.tno{font-family:var(--num);font-size:11px;color:var(--sub)}
#stage{background:var(--stage);overflow:auto;position:relative;min-width:0}
#spreads{display:flex;flex-direction:column;align-items:center;gap:36px;padding:32px;min-width:max-content}
.spread{display:flex;gap:12px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.page{position:relative;background:var(--paper);touch-action:none}
.page canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0}
.pno{font-family:var(--num);font-size:11px;color:var(--sub)}
.dwr{display:grid;grid-template-columns:84px minmax(0,1fr) 64px 28px;gap:4px;margin-bottom:4px}
.dwh{color:var(--sub);font-size:11px;margin:0}
.tno{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ined{position:absolute;z-index:2;background:var(--paper);border:1px solid var(--accent);padding:0;margin:0;resize:none;outline:none;overflow:auto;border-radius:0}
.selbox{position:absolute;border:1px solid var(--accent);pointer-events:none}
.selbox .h{position:absolute;width:8px;height:8px;background:var(--bg);border:1px solid var(--accent);pointer-events:auto;margin:-5px 0 0 -5px}
.tmpbox{position:absolute;border:1px dashed var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 4px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);background:transparent;border-bottom-color:var(--accent);font-weight:700}
.tab{padding:10px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>h3{margin:0;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span{font-size:11px;color:var(--sub)}
.f>input,.f>select{width:100%}
.chk{display:flex;align-items:center;gap:6px}
textarea#tText{width:100%;min-height:140px;resize:vertical;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.pf{display:flex;flex-direction:column;gap:4px}
.pfi{display:grid;grid-template-columns:8px 44px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:1px solid var(--line);padding:6px 8px;background:var(--bg)}
.pfi i{width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--sub)}
.pfi.err i{background:var(--danger)}
.pfi.warn i{background:var(--warn)}
.pfi b{font-family:var(--num);font-weight:400;color:var(--sub)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:var(--paper);font-size:10px;line-height:16px;font-family:var(--num)}
.badge.w{background:var(--warn)}
.ok{color:var(--sub)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;padding:3px 0}
a{color:var(--accent)}
.pfi.hp{grid-template-columns:8px minmax(0,1fr);cursor:default}
.hpt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:8px;border:1px solid var(--line);border-radius:4px}
.hpt>span{color:var(--sub)}
.hpd{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto;font-family:var(--num);font-size:11px}
.hps{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center}
.hps>b{font-weight:400;color:var(--sub);text-align:right}
.hph>span{color:var(--sub);text-align:center}
.hpf{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:var(--paper)}
.hpf>i{font-style:normal;text-align:center;padding:2px 0;color:#15181c}
.hpf>i+i{border-left:1px dashed var(--line)}
.hpf>i.b{color:var(--sub)}
.dbx-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.dbx-g{font-size:11px;color:var(--sub);font-weight:700;margin-top:4px}
.dbx-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:6px 8px}
.dbx-i b{font-family:var(--num);font-weight:400}
.dbx-i span{font-family:var(--num);font-size:11px;color:var(--sub)}
#dbx-msg.err{color:var(--danger)}
#neta{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0;background:var(--bg)}
#app.neta-on>#left,#app.neta-on>#stage,#app.neta-on>#right{display:none}
#app.neta-on header>*:not(#gApps){display:none}
#app.neta-on #gApps>:not(#bNeta){display:none}
#nList{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#nList .ph{border-top:0}
.nbar{display:flex;flex-direction:column;gap:6px;padding:8px}
.nbar input{width:100%}
.ntags{display:flex;flex-wrap:wrap;gap:4px}
.ntags button,.ntag{padding:0 8px;border-radius:10px;font-size:11px;line-height:18px}
.ntag{border:1px solid var(--line);color:var(--sub)}
#nItems{flex:1;overflow:auto;display:flex;flex-direction:column}
.nit{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;border-radius:0;background:transparent;padding:8px 10px 8px 7px}
.nit.cur{background:var(--bg);border-left-color:var(--accent)}
.nit b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nit small{color:var(--sub);font-family:var(--num);font-size:11px}
.nit .ntags{pointer-events:none}
.nfoot{display:flex;gap:4px;padding:8px;border-top:1px solid var(--line)}
#nEdit{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
#nEdit .f>input{width:100%}
#nTitle{font-size:16px;font-weight:700;padding:6px 8px}
#nBody{width:100%;min-height:240px;flex:1;resize:vertical;line-height:1.7;padding:8px}
.nimgs{display:flex;flex-wrap:wrap;gap:8px}
.nimg{position:relative;width:96px;height:96px;border:1px solid var(--line);background:var(--paper)}
.nimg img{width:100%;height:100%;object-fit:contain;display:block}
.nimg button{position:absolute;top:2px;right:2px;padding:0 6px;line-height:18px}
.nimgs.drop{outline:2px dashed var(--accent);outline-offset:2px}
.nact{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between}
.nempty{color:var(--sub);padding:16px}
@media (max-width:820px){
  #app.neta-on{grid-template-rows:44px minmax(0,1fr)}
  #neta{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:start;overflow:auto}
  #nEdit{overflow:visible}
  #nList{border-right:0;border-bottom:1px solid var(--line)}
  #nList .ph{flex-direction:row;justify-content:space-between;border-left:0;padding:6px 8px}
  #nList .ph>span:first-child{display:inline}
  #nList .ph .grp{flex-direction:row}
  #nItems{max-height:40vh}
  #nEdit{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
#modal{position:fixed;inset:0;background:rgba(21,24,28,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal[hidden]{display:none!important}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.dlg h2{margin:0;font-size:15px}
.dlg .foot{display:flex;justify-content:flex-end;gap:6px}
.prog{height:6px;background:var(--hover);border-radius:3px;overflow:hidden}
.prog>div{height:100%;width:0;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;z-index:30;max-width:calc(100% - 32px)}
@media (min-width:1280px){
  #app{grid-template-columns:264px minmax(0,1fr) 300px}
  #pages{flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;gap:12px 8px}
  #spreads{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;align-content:flex-start;gap:36px 48px;min-width:min-content}
}
@media (min-width:1680px){
  #app{grid-template-columns:360px minmax(0,1fr) 320px}
}
@media (pointer:coarse){
  .selbox .h{width:18px;height:18px;margin:-10px 0 0 -10px}
}
@media (max-width:820px) and (pointer:coarse){
  #bZo,#bZi,#zoomLbl{display:none}
}
.dlg.wide{width:min(980px,100%);height:min(88vh,900px);max-height:none;padding:0;gap:0;overflow:hidden}
.dw-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dw-bar h2{margin:0 8px 0 0}
.dw-bar .sp{flex:1}
.dw-bar input[type=number]{width:64px}
.dw-cnt{font-family:var(--num);color:var(--sub)}
.dw-cnt.warn{color:var(--warn)}
.dw-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.dw-body.img{grid-template-columns:minmax(0,1fr) minmax(200px,38%)}
.dw-grid{overflow:auto;min-height:0}
.dw-grid table{border-collapse:collapse;width:100%;table-layout:fixed}
.dw-grid th,.dw-grid td{border:1px solid var(--line);padding:0;height:28px}
.dw-grid thead th{position:sticky;top:0;background:var(--panel);font-size:11px;color:var(--sub);font-weight:700;text-align:left;padding:0 6px;z-index:1}
.dw-grid tbody th{background:var(--panel);font-family:var(--num);font-weight:400;color:var(--sub);text-align:right;padding:0 6px;cursor:grab;user-select:none;width:52px}
.dw-grid tbody tr.sel th{background:var(--accent);color:var(--accent-ink)}
.dw-grid tbody tr.spr>*{border-bottom:2px solid var(--sub)}
.dw-grid tbody tr.drop>*{border-top:2px solid var(--accent)}
.dw-grid td input{width:100%;height:100%;border:0;border-radius:0;background:transparent;padding:0 6px}
.dw-grid td input:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dw-grid tr.k-title input,.dw-grid tr.k-toc input,.dw-grid tr.k-colophon input{font-weight:700}
.dw-grid tr.k-blank td input{color:var(--sub)}
.dw-side{border-left:1px solid var(--line);background:var(--stage);overflow:auto;min-height:0;display:flex;flex-direction:column}
.dw-side img{width:100%;height:auto;display:block}
.dw-side .dw-ib{display:flex;justify-content:flex-end;gap:4px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line)}
.dw-key{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.dw-key input{flex:1}
.dw-msg{padding:6px 12px;border-bottom:1px solid var(--line)}
.dw-msg.err{color:var(--danger)}
.dw-foot{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.dw-foot .sp{flex:1}
@media (max-width:820px){.dw-body.img{grid-template-columns:minmax(0,1fr);grid-template-rows:30% minmax(0,1fr)}.dw-side{border-left:0;border-top:1px solid var(--line);order:-1}}
@media (max-width:820px){
  html,body{height:100dvh}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) auto auto;height:100dvh}
  header{gap:8px;overflow-x:auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  header>*{flex:none}
  .logo,#docInfo{display:none}
  header button{padding:6px 8px}
  .grp{gap:2px}
  #stage{touch-action:pan-x pan-y}
  #spreads{gap:20px;padding:12px}
  #left{grid-row:3;border-right:0;border-top:1px solid var(--line);flex-direction:row;align-items:stretch;overflow:hidden}
  .tools{grid-template-columns:1fr 1fr;padding:6px;flex:none;width:112px;align-content:center}
  .tools button{padding:8px 2px}
  .ph{flex-direction:column;justify-content:center;gap:4px;border-top:0;border-bottom:0;border-left:1px solid var(--line);padding:6px 4px}
  .ph>span:first-child{display:none}
  .ph .grp{flex-direction:column}
  .ph .grp button{padding:4px 10px}
  #pages{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:10px;border-left:1px solid var(--line)}
  .tsp{flex:none}
  #right{grid-row:4;border-left:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs{border-bottom:0}
  #app.sheet .tabs{border-bottom:1px solid var(--line)}
  .tabs button{padding:10px 4px}
  #app:not(.sheet) #right .tab{display:none!important}
  #right .tab{max-height:42dvh}
  #left,#right{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
}
/* ---------- event sales ---------- */
#sv{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;font-size:14px;overflow:hidden}
#sv .svh{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
#sv .svh h2{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sv .svh .num{color:var(--sub)}
#sv .svt{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
#sv .svt button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 8px;border-bottom:2px solid transparent;white-space:nowrap}
#sv .svt button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
#sv .svb{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
#sv .svb>*{width:100%;max-width:880px;margin-inline:auto}
#sv button{padding:8px 12px}
#sv input,#sv select,#sv textarea{padding:7px 8px}
#sv h3{margin:0;font-size:12px;color:var(--sub);letter-spacing:.04em}
#sv .num{font-family:var(--num);font-variant-numeric:tabular-nums}
#sv .danger{color:var(--danger)}
.sv-sec{display:flex;flex-direction:column;gap:8px}
.sv-ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line)}
#sv .sv-ev{padding:10px 12px}
.sv-ev .d{font-family:var(--num);font-weight:700}
.sv-ev .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-ev .m{grid-column:2/-1;color:var(--sub);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px}
.sv-ev .m .warn{color:var(--warn);font-weight:700}
.sv-ev .m .err{color:var(--danger);font-weight:700}
.sv-pos{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.sv-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sv-it{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:76px;background:var(--panel);border:1px solid var(--line)}
#sv .sv-it{padding:10px}
.sv-it b{font-size:14px;word-break:break-all}
.sv-it .p{font-family:var(--num);font-size:16px;font-weight:700}
.sv-it .r{font-family:var(--num);font-size:11px;color:var(--sub)}
.sv-it .r.out{color:var(--danger);font-weight:700}
.sv-it .c{align-self:flex-end;margin-top:auto;font-family:var(--num);font-weight:700;color:var(--accent)}
.sv-cart{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.sv-cart .f input{width:100%}
.sv-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.sv-line .q{display:flex;align-items:center;gap:4px}
#sv .sv-line .q button{padding:2px 10px}
.sv-big{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sv-big span{color:var(--sub)}
.sv-big b{font-family:var(--num);font-size:26px}
.sv-big b.short{color:var(--danger)}
.sv-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#sv .sv-cash button{padding:8px 2px;font-family:var(--num)}
.sv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sv-stats div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sv-stats span{color:var(--sub);font-size:12px}
.sv-stats b{font-family:var(--num);font-size:20px}
.sv-tbl{width:100%;border-collapse:collapse}
.sv-tbl th,.sv-tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;white-space:nowrap}
.sv-tbl th{color:var(--sub);font-size:12px;font-weight:700}
.sv-tbl th:first-child,.sv-tbl td:first-child{text-align:left;white-space:normal}
.sv-tbl td{font-family:var(--num)}
.sv-tbl td:first-child{font-family:var(--ui)}
.sv-tbl td.out{color:var(--danger);font-weight:700}
.sv-hist{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 10px;align-items:center}
.sv-hist .t{font-family:var(--num);color:var(--sub)}
.sv-hist .x{font-size:12px;color:var(--sub);min-width:0}
.sv-hist .a{font-family:var(--num);font-weight:700}
#sv .sv-hist button{padding:2px 8px}
.sv-edit{display:grid;grid-template-columns:minmax(0,1fr) 96px 80px auto;gap:6px;align-items:end}
.sv-edit input{width:100%}
.sv-float{max-width:200px}
.sv-float input{width:100%}
.sv-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sv-form .f input{width:100%}
.sv-form .wide{grid-column:1/-1}
#sv textarea{width:100%;min-height:200px;resize:vertical;line-height:1.7}
.sv-memo{border-left:2px solid var(--line);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.sv-memo b{font-size:12px;color:var(--sub)}
.sv-memo p{margin:0;white-space:pre-wrap;line-height:1.7}
.sv-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sv-row .grow{flex:1}
.sv-empty{color:var(--sub);padding:12px 0}
.sv-cart .sv-empty{padding:0}
@media (max-width:820px){
  .sv-pos{grid-template-columns:minmax(0,1fr)}
  .sv-cart{position:sticky;bottom:0}
  .sv-edit{grid-template-columns:minmax(0,1fr) 80px 64px auto}
  .sv-form{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  const out=[],sz=it.size*PT,tr=it.track/1000*sz,ch=Array.isArray(str)?str:[...str];

        else if(u.k==='tcy'){let w=0;for(const x of u.s)w+=cw(x,it.font,it.weight);if(w>1)g.sx=1/w}
        else if(ROT.has(u.s))g.rot=true;
        else if(PUNCT.has(u.s)){g.dx=.55;g.dy=-.55}
        else if(SMALL.has(u.s)){g.dx=.1;g.dy=-.1}

/* ---------- images: PSD / linked files ---------- */
function parsePSD(buf){
  const v=new DataView(buf),u8=new Uint8Array(buf);
  if(v.getUint32(0)!==0x38425053)throw new Error('PSDファイルではありません');
  if(v.getUint16(4)!==1)throw new Error('PSB形式には対応していません');
  const nch=v.getUint16(12),h=v.getUint32(14),w=v.getUint32(18),depth=v.getUint16(22),mode=v.getUint16(24);
  const need={0:1,1:1,8:1,3:3,4:4}[mode];if(!need)throw new Error('このカラーモードのPSDには対応していません（グレースケール・RGB・CMYK・モノクロ2階調のみ）');
  if(![1,8,16].includes(depth))throw new Error('32bitのPSDには対応していません');
  let p=26;p+=4+v.getUint32(p);p+=4+v.getUint32(p);p+=4+v.getUint32(p);
  const comp=v.getUint16(p);p+=2;if(comp>1)throw new Error('圧縮形式がZIPのPSDには対応していません');
  const rb=depth===1?Math.ceil(w/8):w*depth/8,planes=[];let counts=null;
  if(comp===1){counts=new Uint16Array(nch*h);for(let k=0;k<nch*h;k++){counts[k]=v.getUint16(p);p+=2}}
  const row=new Uint8Array(rb);
  for(let c=0;c<need;c++){
    const pl=new Uint8Array(w*h);
    for(let y=0;y<h;y++){
      if(comp===1){const end=p+counts[c*h+y];let o=0;
        while(p<end&&o<rb){const n=(u8[p++]<<24)>>24;if(n>=0){row.set(u8.subarray(p,p+n+1),o);o+=n+1;p+=n+1}else if(n>-128){row.fill(u8[p++],o,o+1-n);o+=1-n}}
        p=end;}
      else{row.set(u8.subarray(p,p+rb));p+=rb}
      const base=y*w;
      if(depth===1)for(let x=0;x<w;x++)pl[base+x]=(row[x>>3]>>(7-(x&7)))&1?0:255;
      else if(depth===16)for(let x=0;x<w;x++)pl[base+x]=row[x*2];
      else pl.set(row.subarray(0,w),base);
    }
    planes.push(pl);
  }
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d'),id=cx.createImageData(w,h),a=id.data;
  for(let q=0,n=w*h;q<n;q++){const o=q*4;let r,g,b;
    if(need===1)r=g=b=planes[0][q];
    else if(need===3){r=planes[0][q];g=planes[1][q];b=planes[2][q]}
    else{const k=planes[3][q]/255;r=planes[0][q]*k;g=planes[1][q]*k;b=planes[2][q]*k}
    a[o]=r;a[o+1]=g;a[o+2]=b;a[o+3]=255}
  cx.putImageData(id,0,0);return cv;
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('画像を読み込めませんでした'));i.src=src})}
async function readImage(file){
  const head=new Uint8Array(await file.slice(0,4).arrayBuffer());let src,cv=null;
  if(head[0]===0x38&&head[1]===0x42&&head[2]===0x50&&head[3]===0x53)cv=parsePSD(await file.arrayBuffer());
  else src=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)});
  let img=cv||await loadImg(src),w=cv?cv.width:img.naturalWidth,h=cv?cv.height:img.naturalHeight;const MAX=16e6;
  if(w*h>MAX){const k=Math.sqrt(MAX/(w*h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cv=c;w=c.width;h=c.height}
  if(cv){src=cv.toDataURL('image/png');img=await loadImg(src)}
  return{src,w,h,img,name:file.name,mtime:file.lastModified};
}
const handles={};
async function placeImageInto(it,file,handle){
  try{const im=await readImage(file);const id=uid();S.images[id]=im;it.imageId=id;if(handle){handles[id]=handle;saveHandles()}
    sepCache.clear();dirty(S.sel?S.sel.page:S.page);commit();renderProps()}catch(e){toast(e.message)}}
async function pickImage(it){
  if(window.showOpenFilePicker){
    try{const [h]=await window.showOpenFilePicker({types:[{description:'画像',accept:{'image/*':['.png','.jpg','.jpeg','.psd','.webp','.gif','.bmp']}}]});await placeImageInto(it,await h.getFile(),h);return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  imgTarget=it;$('#fImg').click();
}
function saveHandles(){const o={};for(const [id,h] of Object.entries(handles))if(S.images[id])o[id]=h;kvSet('handles',o)}
let linkBusy=false;
async function checkLinks(force){
  if(linkBusy||!S.doc)return;linkBusy=true;
  try{for(const [id,h] of Object.entries(handles)){
    const im=S.images[id];if(!im)continue;
    try{if(h.queryPermission&&await h.queryPermission({mode:'read'})!=='granted'){im.lost=true;continue}
      const f=await h.getFile();im.lost=false;
      if(force||f.lastModified!==im.mtime){const n=await readImage(f);Object.assign(im,n);sepCache.clear();
        S.doc.pages.forEach((p,i)=>{if(p.items.some(x=>x.imageId===id))dirty(i)});autosave();toast('画像を更新しました：'+f.name)}}
    catch(e){im.lost=true}
  }}finally{linkBusy=false}
}
async function relink(id){const h=handles[id];if(!h)return;try{if(h.requestPermission&&await h.requestPermission({mode:'read'})==='granted'){await checkLinks(true);renderProps()}}catch(e){toast('再接続できませんでした')}}
setInterval(()=>{if(document.visibilityState==='visible'&&Object.keys(handles).length)checkLinks()},2000);
window.addEventListener('focus',()=>checkLinks());

/* ---------- align / page ops ---------- */
function alignBox(pi,ref){const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH;
  if(ref==='trim')return{x:0,y:0,w:W,h:H};if(ref==='bleed')return{x:-b,y:-b,w:W+2*b,h:H+2*b};
  return d.kind==='cover'?{x:d.margins.outer,y:d.margins.top,w:W-2*d.margins.outer,h:H-d.margins.top-d.margins.bottom}:margBox(pi)}
function alignSel(how){const it=selItem();if(!it)return;const r=alignBox(S.sel.page,S.alignRef||'margin');
  if(how==='l')it.x=r.x;else if(how==='c')it.x=r.x+(r.w-it.w)/2;else if(how==='r')it.x=r.x+r.w-it.w;
  else if(how==='t')it.y=r.y;else if(how==='m')it.y=r.y+(r.h-it.h)/2;else if(how==='b')it.y=r.y+r.h-it.h;
  else if(how==='fit'){it.x=r.x;it.y=r.y;it.w=r.w;it.h=r.h}
  it.x=r1(it.x);it.y=r1(it.y);it.w=r1(it.w);it.h=r1(it.h);dirty(S.sel.page);commit();renderProps()}
function dupPage(i){const d=S.doc,c=JSON.parse(JSON.stringify(d.pages[i]));c.id=uid();const map={};for(const it of c.items){const n=uid();map[it.id]=n;it.id=n}
  for(const it of c.items)if(it.next)it.next=map[it.next]||null;
  d.pages.splice(i+1,0,c);rebuild();commit();setPage(i+1);toast('ページを複製しました')}
function movePage(i,dir){const d=S.doc,j=i+dir;if(j<0||j>=d.pages.length)return;const [p]=d.pages.splice(i,1);d.pages.splice(j,0,p);S.sel=null;rebuild();commit();S.page=-1;setPage(j);renderProps()}

/* ---------- interaction ---------- */
function toMM(e,el){const r=el.getBoundingClientRect(),b=S.doc.bleed;return{x:(e.clientX-r.left)/S.s-b,y:(e.clientY-r.top)/S.s-b}}
function hit(pi,p){const its=S.doc.pages[pi].items;for(let k=its.length-1;k>=0;k--){const it=its[k];if(p.x>=it.x&&p.x<=it.x+it.w&&p.y>=it.y&&p.y<=it.y+it.h)return it}return null}
function snapLines(pi){const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,m=d.kind==='cover'?{x:d.margins.outer,y:d.margins.top,w:W-2*d.margins.outer,h:H-d.margins.top-d.margins.bottom}:margBox(pi);
  const xs=[-b,0,W/2,W,W+b,m.x,m.x+m.w],ys=[-b,0,H/2,H,H+b,m.y,m.y+m.h];if(d.kind==='cover')xs.push(d.trimW,d.trimW+d.spine);return{xs,ys}}
function snap1(vals,lines){const th=6/S.s;let best=null;for(const v of vals)for(const l of lines){const dd=l-v;if(Math.abs(dd)<th&&(best===null||Math.abs(dd)<Math.abs(best)))best=dd}return best||0}
spreadsEl.addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('ined'))return;
  const pg=e.target.closest('.page');if(!pg||e.button>0)return;
  const pi=+pg.dataset.i,p=toMM(e,pg);setPage(pi);
  if(S.linkFrom){const t=hit(pi,p);if(t&&t.type==='text'){linkTo(pi,t);e.preventDefault();return}}
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(S.tool==='select'){
    if(e.target.classList.contains('h')){const it=selItem();S.drag={mode:'resize',pi,id:it.id,dir:e.target.dataset.d,p0:p,o:{x:it.x,y:it.y,w:it.w,h:it.h}}}
    else{const it=hit(pi,p);if(it){select(pi,it.id);S.drag={mode:'move',pi,id:it.id,p0:p,o:{x:it.x,y:it.y,w:it.w,h:it.h}}}else{select(null);if(e.pointerType!=='touch')return;S.drag={mode:'pan',x0:e.clientX,y0:e.clientY,sl:stage.scrollLeft,st:stage.scrollTop}}}
  }else S.drag={mode:'create',pi,p0:p,rect:null};
  pg.setPointerCapture(e.pointerId);e.preventDefault();
});
spreadsEl.addEventListener('pointermove',e=>{
  const D=S.drag;if(!D)return;if(D.mode==='pan'){stage.scrollLeft=D.sl-(e.clientX-D.x0);stage.scrollTop=D.st-(e.clientY-D.y0);return}const pe=S.pageEls[D.pi];const p=toMM(e,pe.el);let dx=p.x-D.p0.x,dy=p.y-D.p0.y;
  if(D.mode==='create'){const x=Math.min(p.x,D.p0.x),y=Math.min(p.y,D.p0.y);D.rect={x,y,w:Math.abs(dx),h:Math.abs(dy)};drawOverlay(D.pi);return}
  const it=findItem({page:D.pi,id:D.id});if(!it)return;const o=D.o,L=snapLines(D.pi);
  if(D.mode==='move'){
    if(e.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0}
    let nx=o.x+dx,ny=o.y+dy;nx+=snap1([nx,nx+o.w/2,nx+o.w],L.xs);ny+=snap1([ny,ny+o.h/2,ny+o.h],L.ys);it.x=r1(nx);it.y=r1(ny);
  }else{
    let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;const dd=D.dir;
    if(dd.includes('w')){x0+=dx;x0+=snap1([x0],L.xs)}if(dd.includes('e')){x1+=dx;x1+=snap1([x1],L.xs)}
    if(dd.includes('n')){y0+=dy;y0+=snap1([y0],L.ys)}if(dd.includes('s')){y1+=dy;y1+=snap1([y1],L.ys)}
    it.x=r1(Math.min(x0,x1-1));it.y=r1(Math.min(y0,y1-1));it.w=r1(Math.max(1,Math.abs(x1-x0)));it.h=r1(Math.max(1,Math.abs(y1-y0)));
  }

});
function endDrag(){
  const D=S.drag;if(!D)return;S.drag=null;if(D.mode==='pan')return;
  if(D.mode==='create'){
    let r=D.rect;if(!r||r.w<2||r.h<2){const W=S.tool==='text'?40:40;r={x:D.p0.x,y:D.p0.y,w:W,h:W}}
    r={x:r1(r.x),y:r1(r.y),w:r1(r.w),h:r1(r.h)};
    const mk=S.tool==='text'?textItem:S.tool==='image'?imageItem:rectItem;const it=mk(r);
    if(S.tool==='rect'&&S.doc.color==='mono')it.fill={c:0,m:0,y:0,k:20};
    S.doc.pages[D.pi].items.push(it);setTool('select');select(D.pi,it.id);dirty(D.pi);commit();
    if(it.type==='text')setTimeout(()=>editText(D.pi,it),0);
    if(it.type==='image')pickImage(it);
    return;
  }
  commit();renderProps();
}
spreadsEl.addEventListener('pointerup',endDrag);spreadsEl.addEventListener('pointercancel',endDrag);
spreadsEl.addEventListener('dblclick',e=>{if(e.target.classList.contains('ined'))return;const it=selItem();if(it&&it.type==='text')editText(S.sel.page,it);else if(it&&it.type==='image')pickImage(it)});
stage.addEventListener('pointerdown',e=>{if(e.target===stage||e.target===spreadsEl||e.target.classList.contains('spread')||e.target.classList.contains('slot'))select(null)});
let imgTarget=null;
$('#fImg').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&imgTarget)placeImageInto(imgTarget,f)});
spreadsEl.addEventListener('dragover',e=>{if(e.target.closest('.page'))e.preventDefault()});
spreadsEl.addEventListener('drop',async e=>{
  const pg=e.target.closest('.page');if(!pg)return;e.preventDefault();
  const di=[...e.dataTransfer.items].find(x=>x.kind==='file'),hp=di&&di.getAsFileSystemHandle?di.getAsFileSystemHandle():null;

pagesEl.addEventListener('click',e=>{const c=e.target.closest('.thumb');if(!c)return;const i=+c.dataset.i;setPage(i);S.pageEls[i].el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})});
function setTool(t){S.tool=t;$$('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));stage.style.cursor=t==='select'?'':'crosshair'}
$$('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function nudge(dx,dy){const it=selItem();if(!it)return;it.x=r1(it.x+dx);it.y=r1(it.y+dy);dirty(S.sel.page);commit();renderProps()}
function delSel(){const it=selItem();if(!it)return;const pg=S.doc.pages[S.sel.page];pg.items=pg.items.filter(x=>x!==it);const p=S.sel.page;select(null);dirty(p);commit()}
function dupSel(){const it=selItem();if(!it)return;const c=JSON.parse(JSON.stringify(it));c.id=uid();c.x+=5;c.y+=5;S.doc.pages[S.sel.page].items.push(c);select(S.sel.page,c.id);dirty(S.sel.page);commit()}
function order(dir){const it=selItem();if(!it)return;const a=S.doc.pages[S.sel.page].items,i=a.indexOf(it);a.splice(i,1);if(dir>0)a.push(it);else a.unshift(it);dirty(S.sel.page);commit()}
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;const typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel();return}
  if(mod&&(e.key==='='||e.key==='+')){e.preventDefault();zoomBy(1.25);return}
  if(mod&&e.key==='-'){e.preventDefault();zoomBy(0.8);return}
  if(e.key==='Delete'||e.key==='Backspace'){if(S.sel){e.preventDefault();delSel()}return}
  if(e.key==='Escape'){select(null);setTool('select');return}
  const st=e.shiftKey?5:0.5;
  if(e.key==='ArrowLeft'){e.preventDefault();nudge(-st,0)}else if(e.key==='ArrowRight'){e.preventDefault();nudge(st,0)}
  else if(e.key==='ArrowUp'){e.preventDefault();nudge(0,-st)}else if(e.key==='ArrowDown'){e.preventDefault();nudge(0,st)}
  else if(!mod){const t={v:'select',t:'text',i:'image',r:'rect'}[e.key.toLowerCase()];if(t)setTool(t)}
});

/* ---------- touch: pinch zoom, page tracking ---------- */
const touches=new Map();let pinch=null;
function pinchInfo(){const [a,b]=[...touches.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}}
stage.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size!==2)return;e.stopPropagation();e.preventDefault();
  const D=S.drag;S.drag=null;
  if(D&&(D.mode==='move'||D.mode==='resize')){const it=findItem({page:D.pi,id:D.id});if(it)Object.assign(it,D.o);dirty(D.pi)}
  else if(D&&D.mode==='create')drawOverlay(D.pi);
  const p=pinchInfo(),r=spreadsEl.getBoundingClientRect();
  pinch={d0:p.d,z0:S.zoom,k:1,ox:p.cx-r.left,oy:p.cy-r.top,cx:p.cx,cy:p.cy};
  spreadsEl.style.transformOrigin=pinch.ox+'px '+pinch.oy+'px'},true);
stage.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!pinch||touches.size<2)return;const p=pinchInfo();pinch.k=clamp(pinch.z0*p.d/pinch.d0,0.2,6)/pinch.z0;
  spreadsEl.style.transform=`translate(${p.cx-pinch.cx}px,${p.cy-pinch.cy}px) scale(${pinch.k})`},true);
function touchEnd(e){if(!touches.delete(e.pointerId)||!pinch||touches.size>=2)return;
  const P=pinch;pinch=null;spreadsEl.style.transform='';spreadsEl.style.transformOrigin='';
  S.zoom=P.z0*P.k;rebuild();if(S.sel)drawOverlay(S.sel.page);
  const r=spreadsEl.getBoundingClientRect();
  stage.scrollLeft+=r.left+P.ox*P.k-P.cx;stage.scrollTop+=r.top+P.oy*P.k-P.cy;
  touches.clear()}
stage.addEventListener('pointerup',touchEnd,true);stage.addEventListener('pointercancel',touchEnd,true);
let scrT=0;
stage.addEventListener('scroll',()=>{if(!S.single||pinch)return;clearTimeout(scrT);scrT=setTimeout(()=>{
  const sr=stage.getBoundingClientRect(),c=sr.top+sr.height/2;let best=-1,bd=1e9;
  S.pageEls.forEach((pe,i)=>{const r=pe.el.getBoundingClientRect();const dd=Math.abs(r.top+r.height/2-c);if(dd<bd){bd=dd;best=i}});
  if(best>=0&&best!==S.page){setPage(best);const t=S.thumbEls[best];if(t)t.scrollIntoView({block:'nearest',inline:'nearest'})}},120)},{passive:true});
MQW.addEventListener('change',()=>{if(S.doc){rebuild();if(S.sel)drawOverlay(S.sel.page)}});

function showTab(t){S.tab=t;$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));for(const k of['props','doc','pf'])$('#tab-'+k).hidden=k!==t;if(t==='doc')renderDoc();if(t==='pf')runPreflight();if(t==='props')renderProps();if(S.single)setSheet(true)}
function setSheet(on){const a=$('#app');if(a.classList.contains('sheet')===on)return;a.classList.toggle('sheet',on);$$('.tabs button').forEach(b=>b.setAttribute('aria-expanded',on&&b.dataset.tab===S.tab));
  if(on&&S.sel)requestAnimationFrame(()=>{const bx=S.pageEls[S.sel.page]&&S.pageEls[S.sel.page].ov.querySelector('.selbox');if(bx)bx.scrollIntoView({block:'nearest',inline:'nearest'})})}
$$('.tabs button').forEach(b=>b.onclick=()=>{if(S.single&&S.tab===b.dataset.tab&&$('#app').classList.contains('sheet'))setSheet(false);else showTab(b.dataset.tab)});
const F=(label,inner)=>`<label class="f"><span>${label}</span>${inner}</label>`;
const N=(k,v,step=0.1,extra='')=>`<input type="number" id="i-${k.replace(/\./g,'-')}" data-k="${k}" value="${v}" step="${step}" ${extra}>`;
const SEL=(k,v,opts)=>`<select id="i-${k.replace(/\./g,'-')}" data-k="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
function colorFields(k,c){if(S.doc.color==='mono')return `<div class="row">${F('K（%）',N(k+'.k',c.k,1,'min="0" max="100"'))}</div>`;
  return `<div class="row4">${['c','m','y','k'].map(x=>F(x.toUpperCase(),N(k+'.'+x,c[x],1,'min="0" max="100"'))).join('')}</div>`}
function renderProps(){
  if(S.tab!=='props')return;const el=$('#tab-props'),it=selItem(),d=S.doc;
  if(!it){

function spineOf(pages,paper,cover){const sp=PR().spine||'chokotto';pages=Math.max(0,pages|0);

/* ---------- preflight ---------- */
let pfT=0,PF=[];
function preflight(){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,out=[],pr=PR(),safe=pr.safe||3,nb=d.nombre;
  if(d.kind==='body'&&d.pages.length%4!==0)out.push({lv:pr.pages4?'err':'warn',page:null,msg:`ページ数が4の倍数ではありません（${d.pages.length}ページ）`});
  if(b+1e-6<(pr.bleed||0))out.push({lv:'err',page:null,msg:`塗り足しが${pr.name}の指定（${pr.bleed}mm）より小さくなっています`});
  {const bw=d.trimW,bh=d.trimH;
    if(pr.maxW&&(Math.min(bw,bh)>pr.maxW+0.01||Math.max(bw,bh)>pr.maxH+0.01))out.push({lv:'err',page:null,msg:`${pr.name}の最大サイズ（${pr.maxW}×${pr.maxH}mm）を超えています`});
    if(pr.maxW&&bw>bh)out.push({lv:'warn',page:null,msg:'横長の本は特殊断裁（短辺綴じ）オプションが必要です'});
    if(pr.sizes&&!pr.sizes.some(([a,c])=>Math.abs(a-bw)<0.01&&Math.abs(c-bh)<0.01))out.push({lv:'warn',page:null,msg:`${pr.name}の定型サイズではありません（${bw}×${bh}mm）`})}
  if(d.kind==='body'){
    if(pr.nbReq&&nb.mode==='none')out.push({lv:'err',page:null,msg:'ノンブルは全ページに必要です'});
    else if(nb.mode!=='none'){
      if(pr.nbMin&&nb.size<pr.nbMin)out.push({lv:'err',page:null,msg:`ノンブルは${pr.nbMin}pt以上にしてください`});
      if(nb.mode==='hidden'&&pr.hiddenNg)out.push({lv:'warn',page:null,msg:'隠しノンブルは乱丁・落丁の保証対象外になります'});
      else if(pr.nbEdge&&nb.mode!=='hidden'){const half=nb.size*PT/2;if(nb.offset-half<pr.nbEdge-0.01||(nb.mode==='outer'&&d.margins.outer<pr.nbEdge-0.01))out.push({lv:'err',page:null,msg:`ノンブルは仕上がり線から${pr.nbEdge}mm以上内側に置いてください`})}
      if(pr.nbReq){const off=d.pages.map((p,i)=>p.noNombre?nombreText(i):null).filter(Boolean);if(off.length)out.push({lv:'warn',page:null,msg:`ノンブルを表示しないページがあります（${off.slice(0,6).join('、')}${off.length>6?' ほか':''}）。白紙ページにもノンブルが必要です`})}
    }
  }
  if(d.kind==='cover'&&!(d.spine>0))out.push({lv:'warn',page:0,msg:'背幅が0mmです。印刷所の背幅計算で確認してください'});
  let rgb=false;
  d.pages.forEach((pg,i)=>{
    const lab=d.kind==='cover'?'表紙':nombreText(i);
    for(const it of pg.items){
      const at={page:i,id:it.id,lab};
      if(it.type==='text'){
        const L=layout(it);
        if(L.overflow)out.push({lv:'err',...at,msg:'テキストがフレームからあふれています'});
        if(L.bbox){const x0=it.x+L.bbox.x0,x1=it.x+L.bbox.x1,y0=it.y+L.bbox.y0,y1=it.y+L.bbox.y1;
          if(x0<safe||y0<safe||x1>W-safe||y1>H-safe)out.push({lv:'warn',...at,msg:`文字が仕上がり線から${safe}mm以内にあります（断裁で切れる恐れ）`})}
      }else{
        if(it.type==='image'){
          if(!it.imageId)out.push({lv:'warn',...at,msg:'画像が配置されていない画像フレームがあります'});
          else{const ppi=effPpi(it);if(ppi<300)out.push({lv:'warn',...at,msg:`画像の実効解像度が低めです（${ppi}ppi、推奨350ppi以上）`});if(d.color==='cmyk')rgb=true}
        }
        if(it.type==='rect'&&!it.fill&&!it.stroke)continue;
        if(pr.gray&&d.color==='mono'&&it.type==='rect'&&it.fill){const k=it.fill.k;if((k>0&&k<10)||(k>90&&k<100))out.push({lv:'warn',...at,msg:`グレー濃度${k}%は印刷で${k<10?'飛ぶ':'つぶれる'}恐れがあります（15〜80%推奨）`})}
        const e=0.01;const short=(it.x<-e&&it.x>-b+e)||(it.y<-e&&it.y>-b+e)||(it.x+it.w>W+e&&it.x+it.w<W+b-e)||(it.y+it.h>H+e&&it.y+it.h<H+b-e);
        const touchTrim=(Math.abs(it.x)<0.3)||(Math.abs(it.y)<0.3)||(Math.abs(it.x+it.w-W)<0.3)||(Math.abs(it.y+it.h-H)<0.3);
        if(short)out.push({lv:'err',...at,msg:`塗り足しが不足しています（仕上がり線の外へ${b}mmまで伸ばしてください）`});
        else if(touchTrim)out.push({lv:'warn',...at,msg:'オブジェクトの端が仕上がり線ぴったりです。断裁ずれで白が出る恐れがあります'});
      }
    }
  });
  if(rgb)out.push({lv:'info',page:null,msg:'RGB画像は書き出し時にCMYKへ変換されます。色味が変わる場合があります'});
  return out;
}
function runPreflight(){

  $('#pfBadge').innerHTML=e?`<span class="badge">${e}</span>`:w?`<span class="badge w">${w}</span>`:'';
  if(S.tab!=='pf')return;

}

function fitZoom(){const d=S.doc,h=stage.clientHeight||700,w=stage.clientWidth||900,pad=S.single?24:70;const ph=(d.trimH+2*d.bleed)*PX,spw=(S.single||d.kind==='cover'?pw(d)+2*d.bleed:(pw(d)+2*d.bleed)*2)*PX+(S.single?0:12);

const DBX='Dropbox',DROOT='/Thinbook',CH=600000;

function dbxErr(e){const c=e&&e.code;
  if(c==='needs_reauth')return 'Dropboxの再接続が必要です（claude.ai の設定 → コネクタ）';
  if(c==='server_not_connected'||c==='server_not_found')return 'Dropboxが接続されていません（claude.ai の設定 → コネクタで追加）';
  if(c==='selection_required')return '使用するDropboxコネクタを選択してください';
  if(c==='not_in_manifest'||c==='approval_required'||c==='not_granted')return 'Dropboxへのアクセスが許可されていません';
  if(c==='blocked_by_policy')return '組織のポリシーでDropboxが使用できません';
  if(c==='server_unavailable'||c==='rate_limited')return 'Dropboxに接続できません。時間をおいて再度お試しください';
  return 'Dropboxエラー：'+((e&&e.message)||c||'不明');}
async function dbxCall(tool,input){const r=await DB.mcp.callTool(DBX,tool,input,{cache:false});let p=r.payload;
  if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}return p}
async function dbxFolder(path){if(DB.folders.has(path))return;
  try{await dbxCall('create_folder',{path})}catch(e){if(!(e&&e.code==='tool_error'&&/ALREADY_EXISTS|already exists|conflict/i.test(e.message||'')))throw e}
  DB.folders.add(path)}
async function dbxList(path){const out=[];let p;
  try{p=await dbxCall('list_folder',{path,recursive:false,object_types:['file','folder'],max_results:600})}
  catch(e){if(e&&e.code==='tool_error')return out;throw e}
  for(;;){out.push(...((p&&p.entries)||[]));if(!(p&&p.has_more&&p.cursor))break;p=await dbxCall('list_folder',{cursor:p.cursor})}
  return out}
async function dbxText(path){const p=await dbxCall('fetch',{id:path});const t=p&&typeof p==='object'?p.text:p;if(typeof t!=='string')throw new Error('読み込めませんでした');return t}
function chunks(s){const a=[];let i=0;while(i<s.length){let e=Math.min(i+CH,s.length);while(e<s.length&&e>i+1&&/\s/.test(s[e-1]+s[e]))e--;a.push(s.slice(i,e));i=e}return a.length?a:['']}
function stamp(t){const d=new Date(t),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`}
function stampLabel(s){const m=/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)$/.exec(s);return m?`${m[1]}/${m[2]}/${m[3]} ${m[4]}:${m[5]}`:s}
function safeName(n){return (String(n||'無題').normalize('NFC').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/\./g,'・').trim().slice(0,60))||'無題'}
async function dbxBackup(progress){
  if(!S.doc.id){S.doc.id=uid();S.last=JSON.stringify(S.doc);autosave()}
  const used=new Set();S.doc.pages.forEach(p=>p.items.forEach(it=>{if(it.imageId&&S.images[it.imageId])used.add(it.imageId)}));
  await dbxFolder(DROOT);await dbxFolder(DROOT+'/images');await dbxFolder(DROOT+'/backups');
  const dir=DROOT+'/backups/'+S.doc.id;await dbxFolder(dir);
  if(!DB.imgs)DB.imgs=new Set((await dbxList(DROOT+'/images')).map(e=>e.name));
  const images={};let k=0;
  for(const id of used){const im=S.images[id],parts=chunks(im.src);images[id]={w:im.w,h:im.h,name:im.name||'',parts:parts.length,len:im.src.length};
    for(let i=0;i<parts.length;i++){const nm=`${id}.${i+1}.txt`;if(DB.imgs.has(nm))continue;
      progress&&progress(`画像 ${k+1}/${used.size}`);await dbxCall('create_file',{path:DROOT+'/images/'+nm,content:parts[i]});DB.imgs.add(nm)}
    k++}
  const j=JSON.stringify({app:'thinbook',version:1,store:'dropbox',doc:S.doc,images}),parts=chunks(j),t=Date.now(),base=`${stamp(t)}_${safeName(S.doc.name)}`;
  for(let i=0;i<parts.length;i++){progress&&progress('書類');await dbxCall('create_file',{path:`${dir}/${base}.${i+1}-${parts.length}.txt`,content:parts[i]})}
  DB.lastJ=S.last;DB.lastAt=t;return base}
async function dbxBackups(){const out=[];
  for(const f of await dbxList(DROOT+'/backups')){if(f.object_type==='file')continue;
    for(const e of await dbxList(DROOT+'/backups/'+f.name)){const m=/^(\d{8}-\d{6})_(.*)\.1-(\d+)\.txt$/.exec(e.name);
      if(m)out.push({docId:f.name,stamp:m[1],name:m[2],n:+m[3],dir:DROOT+'/backups/'+f.name})}}
  return out.sort((a,b)=>a.stamp<b.stamp?1:-1)}
async function dbxRestore(b,progress){let j='';
  for(let i=1;i<=b.n;i++){progress&&progress('書類');j+=await dbxText(`${b.dir}/${b.stamp}_${b.name}.${i}-${b.n}.txt`)}
  const p=JSON.parse(j),images={};let k=0;const ids=Object.keys(p.images||{});
  for(const id of ids){const m=p.images[id];let src='';progress&&progress(`画像 ${++k}/${ids.length}`);
    for(let i=1;i<=m.parts;i++)src+=await dbxText(`${DROOT}/images/${id}.${i}.txt`);
    src=src.replace(/\s+/g,'');if(m.len&&src.length!==m.len)throw new Error('画像データが壊れています：'+(m.name||id));
    images[id]={src,w:m.w,h:m.h,name:m.name}}
  await loadProject({app:'thinbook',version:1,doc:p.doc,images});DB.lastJ=S.last}
function dbxSchedule(){clearInterval(DB.timer);if(!DB.auto||!DB.mcp)return;
  DB.timer=setInterval(async()=>{if(DB.busy||exporting||!S.doc||S.last===DB.lastJ)return;DB.busy=true;
    try{await dbxBackup()}catch(e){DB.auto=false;dbxSchedule();toast('自動バックアップを停止しました：'+dbxErr(e))}finally{DB.busy=false}},10*60*1000)}
$('#bDbx').onclick=()=>{
  modal(`<h2>Dropbox</h2>
    <div class="btns"><button class="primary" id="d-up">バックアップ</button></div>
    <label class="chk"><input type="checkbox" id="d-auto"${DB.auto?' checked':''}>自動バックアップ（10分ごと）</label>
    <div id="dbx-msg" class="ok">${DB.lastAt?'最終バックアップ '+stampLabel(stamp(DB.lastAt)):''}</div>
    <div class="sec"><h3>復元</h3><div class="dbx-list" id="d-list"><span class="ok">読み込み中…</span></div></div>
    <div class="foot"><button id="d-close">閉じる</button></div>`);
  const msg=(t,err)=>{const m=$('#dbx-msg');if(!m)return;m.textContent=t;m.className=err?'err':'ok'};
  const lock=v=>{DB.busy=v;$$('#modal button:not(#d-close)').forEach(b=>b.disabled=v)};
  $('#d-close').onclick=closeModal;
  $('#d-auto').onchange=e=>{DB.auto=e.target.checked;kvSet('dbxAuto',DB.auto);dbxSchedule()};
  const load=async()=>{const L=$('#d-list');try{const bs=await dbxBackups();if(!$('#d-list'))return;
      if(!bs.length){L.innerHTML='<span class="ok">バックアップはありません</span>';return}
      const cur=S.doc.id,groups=new Map();for(const b of bs){if(!groups.has(b.docId))groups.set(b.docId,[]);groups.get(b.docId).push(b)}
      const order=[...groups.keys()].sort((a,b)=>(b===cur)-(a===cur));let h='';
      for(const g of order){const items=groups.get(g);h+=`<div class="dbx-g">${esc(items[0].name)}</div>`;
        h+=items.slice(0,20).map(b=>`<button class="dbx-i" data-k="${bs.indexOf(b)}"><b>${stampLabel(b.stamp)}</b><span>開く</span></button>`).join('')}
      L.innerHTML=h;
      L.querySelectorAll('.dbx-i').forEach(el=>el.onclick=async()=>{const b=bs[+el.dataset.k];
        if(S.last!==DB.lastJ&&!confirm('現在の書類を閉じて、'+stampLabel(b.stamp)+' のバックアップを開きますか？'))return;
        lock(true);try{await dbxRestore(b,t=>msg('読み込み中：'+t));closeModal();toast('開きました：'+b.name+' '+stampLabel(b.stamp))}
        catch(e){msg(e&&e.code?dbxErr(e):(e.message||'開けませんでした'),true)}finally{lock(false)}})}
    catch(e){if($('#d-list'))L.innerHTML=`<span class="ok">${esc(dbxErr(e))}</span>`}};
  $('#d-up').onclick=async()=>{lock(true);try{await dbxBackup(t=>msg('送信中：'+t));msg('最終バックアップ '+stampLabel(stamp(DB.lastAt)));load()}
    catch(e){msg(dbxErr(e),true)}finally{lock(false)}};
  load();
};

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function makeZip(){

        h.setUint16(12,dt,true);h.setUint16(14,dd,true);h.setUint32(16,e.crc,true);h.setUint32(20,e.cs,true);h.setUint32(24,e.us,true);h.setUint16(28,e.nm.length,true);h.setUint32(42,e.off,true);

async function pngEnc(r){

/* mode: gray(1ch, 255=白) / cmyk(4ch, インキ量) / rgb(3ch) */
async function rasterPage(i,opt,mode,tick){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,ext=opt.marks?b+12:opt.bleed?b:0,mw=W+2*ext,mh=H+2*ext,s=opt.dpi/25.4;

      if(exporting==='cancel')return null;
      const bh=Math.min(band,pxH-y0);
      ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,pxW,band);
      ctx.setTransform(s,0,0,s,ext*s,ext*s-y0);

const PLAN_KINDS=[['title','扉'],['toc','目次'],['body','本文'],['illust','イラスト'],['colophon','奥付'],['blank','白'],['other','その他']];

function autoDaiwari(sections,opts){
  const d=S.doc;if(d.kind==='cover')return null;opts=Object.assign({unit:4,oddStart:false,colophonLast:true},opts);
  const seq=[];let colophon=null;
  for(const s of sections){const n=Math.max(0,s.pages|0);if(!n)continue;
    if(s.kind==='colophon'&&opts.colophonLast){colophon=s;continue}
    if(opts.oddStart&&seq.length%2===1&&seq.length>0)seq.push({kind:'blank',title:'',note:''});
    for(let k=0;k<n;k++)seq.push({kind:s.kind||'body',title:s.title||'',note:''})}

  while(seq.length+cn<total)seq.push({kind:'blank',title:'',note:''});
  for(let k=0;k<cn;k++)seq.push({kind:'colophon',title:colophon.title||'奥付',note:''});
  let removed=0;
  while(d.pages.length<seq.length)d.pages.push(newPage());
  while(d.pages.length>seq.length&&!d.pages[d.pages.length-1].items.length){d.pages.pop();removed++}
  d.pages.forEach((p,i)=>{p.plan=seq[i]?Object.assign({},seq[i]):{kind:'other',title:'',note:''}});
  S.sel=null;S.page=Math.min(S.page,d.pages.length-1);rebuild();commit();renderAll();
  return{total:seq.length,pages:d.pages.length,removed};
}

const PAPERS={A4:[210,297],B5:[182,257],A3:[297,420],B4:[257,364],'レター':[215.9,279.4],A5:[148,210]};

function hpPlan(o){

function jpegPDF(pages,dup){
  const parts=[];let len=0;const offs=[];
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(id,body,stream)=>{offs[id]=len;push(id+' 0 obj\n'+body);if(stream){push('\nstream\n');push(stream);push('\nendstream')}push('\nendobj\n')};
  push('%PDF-1.7\n');push(new Uint8Array([37,226,227,207,211,10]));
  const f=v=>(Math.round(v*MMPT*1000)/1000).toString(),kids=[];let id=4;
  for(const p of pages){
    const pid=id,cid=id+1,iid=id+2;id+=3;kids.push(pid);
    obj(iid,`<< /Type /XObject /Subtype /Image /Width ${p.px[0]} /Height ${p.px[1]} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>`,p.jpg);
    const cs=`q ${f(p.w)} 0 0 ${f(p.h)} 0 0 cm /Im0 Do Q`;
    obj(cid,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(p.w)} ${f(p.h)}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`);
  }
  const vp=`/ViewerPreferences << /PrintScaling /None /Duplex /${dup==='short'?'DuplexFlipShortEdge':dup==='long'?'DuplexFlipLongEdge':'Simplex'} >>`;
  obj(1,`<< /Type /Catalog /Pages 2 0 R ${vp} >>`);
  obj(2,`<< /Type /Pages /Kids [${kids.map(x=>x+' 0 R').join(' ')}] /Count ${kids.length} >>`);
  obj(3,`<< /Title ${pdfStr(S.doc.name||'無題')} /Creator (Thinbook) /Producer (Thinbook) >>`);
  const xref=len,N=id;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let j=1;j<N;j++)x+=String(offs[j]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${N} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
async function hpRender(P,o,sides,test,progress){
  if(!test)await ensureFonts();else await document.fonts.load('700 20px "BIZ UDPGothic"','表裏枚目上白p.0123456789').catch(()=>{});
  let dpi=300;while((P.pW*dpi/25.4)*(P.pH*dpi/25.4)>16e6)dpi-=25;
  const k=dpi/25.4,cv=document.createElement('canvas');cv.width=Math.round(P.pW*k);cv.height=Math.round(P.pH*k);
  const ctx=cv.getContext('2d'),out=[];
  for(let j=0;j<sides.length;j++){
    if(exporting==='cancel')return null;
    ctx.setTransform(k,0,0,k,0,0);hpDrawSide(ctx,P,sides[j],o,test);
    const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
    out.push({w:P.pW,h:P.pH,px:[cv.width,cv.height],jpg:new Uint8Array(await bl.arrayBuffer())});
    sepCache.clear();progress&&progress(j+1,sides.length);await new Promise(r=>setTimeout(r,0));
  }
  return out;
}
function hpSettingsRows(P,o){

}
function hpDiagram(P){

    if(d.f)k.push('xf');const h=xf&&xf.h;if(h==='right'||(!h||h==='general')&&d.n)k.push('xn');if(xf&&xf.wrap)k.push('xw');
    let st='';if(h==='center'||h==='centerContinuous'||(!h&&d.center))st+='text-align:center;';else if(h==='left')st+='text-align:left;';
    if(fo){if(fo.b)st+='font-weight:700;';if(fo.i)st+='font-style:italic;';if(fo.u)st+='text-decoration:underline;'}return{k:k.join(' '),st}}
  function render(){
    const sh=X.sheets[X.cur],R=Math.min(Math.max(sh.maxR+20,60),MAXR),C=Math.min(Math.max(sh.maxC+5,26),MAXC);sh.R=R;sh.C=C;
    const cover=new Map();for(const m of sh.merges){for(let r=m.r1;r<=m.r2;r++)for(let c=m.c1;c<=m.c2;c++)cover.set(r+':'+c,r===m.r1&&c===m.c1?m:null)}
    let tw=44,cg='';for(let c=1;c<=C;c++){const w=colPx(sh,c);tw+=w;cg+=`<col style="width:${w}px">`}let h=`<table class="xt" style="width:${tw}px"><colgroup><col style="width:44px">`+cg;h+=`</colgroup><thead><tr><th></th>`;
    for(let c=1;c<=C;c++)h+=`<th data-hc="${c}">${colName(c)}</th>`;h+=`</tr></thead><tbody>`;
    for(let r=1;r<=R;r++){const row=sh.rows.get(r);const hid=row&&/^(1|true)$/.test(row.getAttribute('hidden')||'');const ht=row&&row.getAttribute('ht')?Math.round(+row.getAttribute('ht')*4/3):0;
      h+=`<tr${hid?' hidden':''}${ht?` style="height:${ht}px"`:''}><th data-hr="${r}">${r}</th>`;
      for(let c=1;c<=C;c++){const k=r+':'+c;let span='';if(cover.has(k)){const m=cover.get(k);if(!m)continue;span=` colspan="${Math.min(m.c2,C)-m.c1+1}" rowspan="${Math.min(m.r2,R)-m.r1+1}"`}
        const el=sh.cells.get(k),d=display(sh,el),s=cls(sh,el,d);h+=`<td data-r="${r}" data-c="${c}"${span}${s.k?` class="${s.k}"`:''}${s.st?` style="${s.st}"`:''}>${esc(d.t)}</td>`}
      h+=`</tr>`}
    $('#xlTbl').innerHTML=h+`</tbody></table>`;
    if(sh.maxR>MAXR||sh.maxC>MAXC)toast(`表示は${MAXR}行・${colName(MAXC)}列までです`);
    markSel();
  }
  function tdAt(r,c){return grid().querySelector(`td[data-r="${r}"][data-c="${c}"]`)}
  function mergeAt(sh,r,c){return sh.merges.find(m=>r>=m.r1&&r<=m.r2&&c>=m.c1&&c<=m.c2)}
  function refreshCell(r,c){const sh=X.sheets[X.cur],td=tdAt(r,c);if(!td)return;const el=sh.cells.get(r+':'+c),d=display(sh,el),s=cls(sh,el,d);td.textContent=d.t;td.className=s.k;td.setAttribute('style',s.st)}
  function markSel(){const sh=X.sheets[X.cur];if(!sh)return;grid().querySelectorAll('.sel,.hl').forEach(e=>e.classList.remove('sel','hl'));
    const m=mergeAt(sh,X.sel.r,X.sel.c);if(m)X.sel={r:m.r1,c:m.c1};const td=tdAt(X.sel.r,X.sel.c);
    if(td){td.classList.add('sel');const g=grid(),hd=44,top=g.querySelector('thead').offsetHeight;
      if(td.offsetLeft-hd<g.scrollLeft)g.scrollLeft=td.offsetLeft-hd;else if(td.offsetLeft+td.offsetWidth>g.scrollLeft+g.clientWidth)g.scrollLeft=td.offsetLeft+td.offsetWidth-g.clientWidth;
      if(td.offsetTop-top<g.scrollTop)g.scrollTop=td.offsetTop-top;else if(td.offsetTop+td.offsetHeight>g.scrollTop+g.clientHeight)g.scrollTop=td.offsetTop+td.offsetHeight-g.clientHeight}
    const a=grid().querySelector(`th[data-hc="${X.sel.c}"]`),b=grid().querySelector(`th[data-hr="${X.sel.r}"]`);if(a)a.classList.add('hl');if(b)b.classList.add('hl');
    $('#xlRef').value=ref(X.sel.r,X.sel.c);const v=editText(sh,sh.cells.get(X.sel.r+':'+X.sel.c));$('#xlIn').value=v;$('#xlIn').dataset.orig=v;ed.value='';setMode('ready');placeEd()}
  function move(dr,dc){const sh=X.sheets[X.cur];if(!sh)return;let{r,c}=X.sel;const m=mergeAt(sh,r,c);if(m){if(dr>0)r=m.r2;if(dc>0)c=m.c2}
    r=clamp(r+dr,1,sh.R);c=clamp(c+dc,1,sh.C);X.sel={r,c};markSel()}
  const ed=$('#xlCell'),inp=$('#xlIn');let mode='ready',composing=false;
  function setMode(m){mode=m;ed.classList.toggle('on',m!=='ready');if(m==='ready')ed.style.width=ed.style.minWidth}
  function placeEd(){const td=tdAt(X.sel.r,X.sel.c);if(!td){ed.hidden=true;return}ed.hidden=false;const g=grid(),gr=g.getBoundingClientRect(),r=td.getBoundingClientRect();
    ed.style.left=(r.left-gr.left+g.scrollLeft)+'px';ed.style.top=(r.top-gr.top+g.scrollTop)+'px';ed.style.minWidth=ed.style.width=r.width+'px';ed.style.height=r.height+'px'}
  function focusEd(){if(!$('#xl').hidden&&X.sheets.length&&!ed.hidden)ed.focus({preventScroll:true})}
  function commitInput(){const sh=X.sheets[X.cur];if(!sh||inp.disabled)return false;const v=inp.value;setMode('ready');ed.value='';if(v===inp.dataset.orig)return false;
    const{r,c}=X.sel;const was=sh.cells.get(r+':'+c);const hadShared=was&&kid(was,'f')&&kid(was,'f').hasAttribute('ref');
    setCell(sh,r,c,v);inp.dataset.orig=v;if(hadShared){render();return true}refreshCell(r,c);return true}
  function cancelInput(){inp.value=inp.dataset.orig||'';ed.value='';setMode('ready')}
  function startEdit(){ed.value=inp.value;setMode('edit');ed.style.width=Math.max(parseFloat(ed.style.minWidth)||0,ed.scrollWidth)+'px';ed.focus({preventScroll:true});ed.setSelectionRange(ed.value.length,ed.value.length)}
  function tabs(){$('#xlTabs').innerHTML=X.sheets.map((s,i)=>s.hidden?'':`<button data-i="${i}" class="${i===X.cur?'on':''}${s.dirty?' dirty':''}">${esc(s.name)}</button>`).join('')}
  function hist(){$('#xlUndo').disabled=!X.undo.length;$('#xlRedo').disabled=!X.redo.length}
  function show(on){$('#xl').hidden=!on;if(on)setTimeout(()=>{focusEd();if(!X.sheets.length)$('#xlOpen2').focus()},0)}

  /* ----- events ----- */
  $('#xlBack').onclick=()=>show(false);
  $('#xlOpen').onclick=$('#xlOpen2').onclick=()=>$('#fXl').click();
  $('#fXl').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)openFile(f)});
  async function openFile(f){if(X.dirty&&!confirm('保存していない変更を破棄して開きますか？'))return;show(true);try{await open(f);toast('開きました：'+f.name);focusEd()}catch(err){console.error(err);toast(err.message||'開けませんでした')}}
  $('#xlSave').onclick=async()=>{try{await save()}catch(err){console.error(err);toast('保存できませんでした：'+(err.message||err))}};
  $('#xlUndo').onclick=()=>stepHist(X.undo,X.redo);
  $('#xlRedo').onclick=()=>stepHist(X.redo,X.undo);
  $('#xlTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showSheet(+b.dataset.i).then(focusEd)});
  grid().addEventListener('pointerdown',e=>{const td=e.target.closest('td');if(!td){if(e.target===ed)return;return}e.preventDefault();commitInput();X.sel={r:+td.dataset.r,c:+td.dataset.c};markSel();focusEd()});
  grid().addEventListener('dblclick',e=>{if(e.target===ed&&mode==='ready'||e.target.closest('td'))startEdit()});
  grid().addEventListener('dragover',e=>e.preventDefault());
  grid().addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&/\.xlsx$/i.test(f.name))openFile(f)});
  for(const t of[ed,inp]){t.addEventListener('compositionstart',()=>{composing=true;if(t===ed&&mode==='ready')setMode('enter')});t.addEventListener('compositionend',()=>composing=false)}
  ed.addEventListener('input',()=>{if(mode==='ready')setMode('enter');inp.value=ed.value;ed.style.width=Math.max(parseFloat(ed.style.minWidth)||0,ed.scrollWidth)+'px'});
  ed.addEventListener('copy',e=>{if(mode!=='ready')return;e.preventDefault();e.clipboardData.setData('text/plain',inp.dataset.orig||'')});
  ed.addEventListener('keydown',e=>{if(mode==='ready'||composing||e.isComposing)return;
    const nav={Enter:[e.shiftKey?-1:1,0],Tab:[0,e.shiftKey?-1:1]};if(mode==='enter')Object.assign(nav,{ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]});
    if(e.key==='Enter'&&e.altKey){e.preventDefault();ed.setRangeText('\n',ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input'));return}
    if(nav[e.key]){e.preventDefault();commitInput();move(...nav[e.key]);focusEd();return}
    if(e.key==='Escape'){e.preventDefault();cancelInput()}});
  inp.addEventListener('keydown',e=>{if(composing||e.isComposing)return;
    if(e.key==='Enter'&&!e.altKey){e.preventDefault();commitInput();move(e.shiftKey?-1:1,0);focusEd()}
    else if(e.key==='Enter'&&e.altKey){e.preventDefault();inp.setRangeText('\n',inp.selectionStart,inp.selectionEnd,'end')}
    else if(e.key==='Tab'){e.preventDefault();commitInput();move(0,e.shiftKey?-1:1);focusEd()}
    else if(e.key==='Escape'){e.preventDefault();cancelInput();focusEd()}});
  $('#xl').addEventListener('keydown',e=>e.stopPropagation());
  window.addEventListener('keydown',e=>{
    if($('#xl').hidden)return;
    if(!$('#xl').contains(e.target))e.stopPropagation();
    const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
    if(mod&&k==='s'){e.preventDefault();$('#xlSave').click();return}
    const a=document.activeElement;
    if(!X.sheets.length||!$('#modal').hidden||!(a===ed&&mode==='ready'||a===grid()||a===document.body))return;
    if(mod&&k==='z'){e.preventDefault();e.shiftKey?stepHist(X.redo,X.undo):stepHist(X.undo,X.redo);return}
    if(mod&&k==='y'){e.preventDefault();stepHist(X.redo,X.undo);return}
    const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],Enter:[e.shiftKey?-1:1,0],Tab:[0,e.shiftKey?-1:1]}[e.key];
    if(mv&&!mod){e.preventDefault();move(...mv);focusEd();return}
    if(e.key==='F2'){e.preventDefault();startEdit();return}
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();inp.value='';commitInput();markSel();return}
    if(a!==ed)focusEd();
  },true);
  return{X,open,openFile,save,show,setCell:(r,c,t)=>{const sh=X.sheets[X.cur];setCell(sh,r,c,t);refreshCell(r,c);markSel()},shiftF};
})();
$('#bXl').onclick=()=>XL.show(true);
window.__thinbook.XL=XL;
</script>
