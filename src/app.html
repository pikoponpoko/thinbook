<style>
/* Layout: header / pages | spread stage | inspector — a production tool, flat and dense */
:root{
  --bg:#ffffff; --panel:#f3f5f7; --stage:#d9dee4; --ink:#15181c; --sub:#5d6670; --line:#d0d6dc; --hover:#e6eaee;
  --accent:#1d5cff; --accent-ink:#ffffff; --danger:#e0243a; --warn:#c25a00; --guide:#8b3dff; --paper:#ffffff;
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --panel:#1e2125; --stage:#2a2e34; --ink:#e8ebee; --sub:#9aa3ad; --line:#383d44; --hover:#2a2f35;
  --accent:#5c8aff; --accent-ink:#0b0d10; --danger:#ff5468; --warn:#ff9d3d; --guide:#a770ff; --paper:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1e2125; --stage:#2a2e34; --ink:#e8ebee; --sub:#9aa3ad; --line:#383d44; --hover:#2a2f35;
  --accent:#5c8aff; --accent-ink:#0b0d10; --danger:#ff5468; --warn:#ff9d3d; --guide:#a770ff; --paper:#ffffff; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;line-height:1.4}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input[type=number]{font-family:var(--num);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:172px minmax(0,1fr) 280px;grid-template-rows:44px minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.logo{font-weight:700;font-size:15px;letter-spacing:.04em}
.grp{display:flex;gap:4px;align-items:center}
#zoomLbl{font-family:var(--num);min-width:44px;text-align:center}
#docInfo{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.tools button{padding:6px 4px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.ph .grp button{padding:0 8px}
#pages{padding:8px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.tsp{display:flex;justify-content:center;gap:2px}
.tslot{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumb{border:1px solid var(--line);background:var(--paper);cursor:pointer;display:block}
.thumb.cur{outline:2px solid var(--accent)}
.tno{font-family:var(--num);font-size:11px;color:var(--sub)}
#stage{background:var(--stage);overflow:auto;position:relative;min-width:0}
#spreads{display:flex;flex-direction:column;align-items:center;gap:36px;padding:32px;min-width:max-content}
.spread{display:flex;gap:12px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.page{position:relative;background:var(--paper);touch-action:none}
.page canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0}
.pno{font-family:var(--num);font-size:11px;color:var(--sub)}
.selbox{position:absolute;border:1px solid var(--accent);pointer-events:none}
.selbox .h{position:absolute;width:8px;height:8px;background:var(--bg);border:1px solid var(--accent);pointer-events:auto;margin:-5px 0 0 -5px}
.tmpbox{position:absolute;border:1px dashed var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 4px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);background:transparent;border-bottom-color:var(--accent);font-weight:700}
.tab{padding:10px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>h3{margin:0;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span{font-size:11px;color:var(--sub)}
.f>input,.f>select{width:100%}
.chk{display:flex;align-items:center;gap:6px}
textarea#tText{width:100%;min-height:140px;resize:vertical;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.pf{display:flex;flex-direction:column;gap:4px}
.pfi{display:grid;grid-template-columns:8px 44px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:1px solid var(--line);padding:6px 8px;background:var(--bg)}
.pfi i{width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--sub)}
.pfi.err i{background:var(--danger)}
.pfi.warn i{background:var(--warn)}
.pfi b{font-family:var(--num);font-weight:400;color:var(--sub)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:var(--paper);font-size:10px;line-height:16px;font-family:var(--num)}
.badge.w{background:var(--warn)}
.ok{color:var(--sub)}
#neta{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0;background:var(--bg)}
#app.neta-on>#left,#app.neta-on>#stage,#app.neta-on>#right{display:none}
#app.neta-on header>*:not(.logo):not(#bNeta){display:none}
#app.neta-on #bNeta{margin-left:auto}
#nList{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#nList .ph{border-top:0}
.nbar{display:flex;flex-direction:column;gap:6px;padding:8px}
.nbar input{width:100%}
.ntags{display:flex;flex-wrap:wrap;gap:4px}
.ntags button,.ntag{padding:0 8px;border-radius:10px;font-size:11px;line-height:18px}
.ntag{border:1px solid var(--line);color:var(--sub)}
#nItems{flex:1;overflow:auto;display:flex;flex-direction:column}
.nit{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;border-radius:0;background:transparent;padding:8px 10px 8px 7px}
.nit.cur{background:var(--bg);border-left-color:var(--accent)}
.nit b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nit small{color:var(--sub);font-family:var(--num);font-size:11px}
.nit .ntags{pointer-events:none}
.nfoot{display:flex;gap:4px;padding:8px;border-top:1px solid var(--line)}
#nEdit{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
#nEdit .f>input{width:100%}
#nTitle{font-size:16px;font-weight:700;padding:6px 8px}
#nBody{width:100%;min-height:240px;flex:1;resize:vertical;line-height:1.7;padding:8px}
.nimgs{display:flex;flex-wrap:wrap;gap:8px}
.nimg{position:relative;width:96px;height:96px;border:1px solid var(--line);background:var(--paper)}
.nimg img{width:100%;height:100%;object-fit:contain;display:block}
.nimg button{position:absolute;top:2px;right:2px;padding:0 6px;line-height:18px}
.nimgs.drop{outline:2px dashed var(--accent);outline-offset:2px}
.nact{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between}
.nempty{color:var(--sub);padding:16px}
@media (max-width:820px){
  #app.neta-on{grid-template-rows:auto auto}
  #neta{grid-template-columns:minmax(0,1fr)}
  #nList{border-right:0;border-bottom:1px solid var(--line)}
  #nItems{max-height:40vh}
  #nEdit{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
#modal{position:fixed;inset:0;background:rgba(21,24,28,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal[hidden]{display:none!important}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.dlg h2{margin:0;font-size:15px}
.dlg .foot{display:flex;justify-content:flex-end;gap:6px}
.prog{height:6px;background:var(--hover);border-radius:3px;overflow:hidden}
.prog>div{height:100%;width:0;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 60vh auto auto;height:auto}
  header{flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #docInfo{flex-basis:100%;order:9}
  #left{border-right:0;border-bottom:1px solid var(--line)}
  #pages{flex-direction:row;overflow-x:auto}
  .tools{grid-template-columns:repeat(4,1fr)}
  #left,#right{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

function pw(d){return d.kind==='cover'?d.trimW*2+d.spine:d.trimW}

function newDoc(o){
  const d={kind:o.kind,name:o.name||'無題',trimW:o.w,trimH:o.h,spine:o.spine||0,bleed:3,binding:o.binding,color:o.color,
    margins:{top:15,bottom:15,inner:15,outer:12},nombre:{mode:o.kind==='cover'?'none':'outer',start:1,size:8,font:'Noto Sans JP',offset:8},pages:[]};

}
function margBox(i){const d=S.doc,m=d.margins,W=pw(d),H=d.trimH;
  if(d.kind==='cover')return{x:m.outer,y:m.top,w:W-m.outer*2,h:H-m.top-m.bottom};

function sampleDoc(){
  const d=newDoc({kind:'body',name:'サンプル',w:148,h:210,binding:'right',color:'mono',pages:8});
  S.doc=d;
  const t='縦書き本文の組版確認用テキストです。句読点「、」「。」の位置、二重かぎ括弧『』、長音ー、三点リーダ……、ダッシュ――の向きを確認できます。\n数字は2桁まで縦中横になります（例：12月31日）。英単語 Thinbook は90度回転して組まれます。\n行頭に句読点が来る場合はぶら下げ、閉じ括弧は追い出しで処理します。';
  const m0=margBox(0);
  d.pages[0].items.push(textItem({x:m0.x+m0.w-30,y:m0.y+20,w:24,h:120,text:'サンプル本',font:'Shippori Mincho',weight:700,size:28,leading:120,track:100}));
  const m1=margBox(1);
  d.pages[1].items.push(textItem({x:m1.x,y:m1.y,w:m1.w,h:m1.h,text:(t+'\n').repeat(4).trim(),size:9,leading:175}));
  const m2=margBox(2);
  d.pages[2].items.push(rectItem({x:-3,y:-3,w:154,h:70,fill:{c:0,m:0,y:0,k:15}}));
  d.pages[2].items.push(imageItem({x:m2.x,y:80,w:m2.w,h:80}));
  d.pages[2].items.push(textItem({x:m2.x,y:170,w:m2.w,h:20,text:'横組みの例：見出し Heading 2026',font:'Noto Sans JP',weight:700,size:12,leading:150,dir:'h'}));
  return d;
}

/* ---------- color ---------- */
function cmykCss(c){const k=1-c.k/100;return `rgb(${Math.round(255*(1-c.c/100)*k)},${Math.round(255*(1-c.m/100)*k)},${Math.round(255*(1-c.y/100)*k)})`}

const REG={c:100,m:100,y:100,k:100};
let TOK={};
function readTokens(){const cs=getComputedStyle(document.documentElement);for(const k of['guide','danger','sub','line','accent','paper'])TOK[k]=cs.getPropertyValue('--'+k).trim()}

/* ---------- text layout ---------- */
const NO_START=new Set([...'、。，．,.)）」』】〕〉》］｝ー々ゝゞぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ！？!?・：；…‥〜～']);
const NO_END=new Set([...'(（「『【〔〈《［｛']);
const HANG=new Set([...'、。，．,.']);
const SMALL=new Set([...'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ']);
const ROT=new Set([...'ー－—―…‥～〜（）「」『』【】〔〕［］｛｝〈〉《》＜＞→←＝｜：；']);
const PUNCT=new Set([...'、。，．']);
const mctx=document.createElement('canvas').getContext('2d');
const wcache=new Map(), lcache=new Map(), fontReq=new Set();
function cw(ch,f,w){const k=f+'|'+w+'|'+ch;let v=wcache.get(k);if(v==null){mctx.font=`${w} 100px "${f}", serif`;v=mctx.measureText(ch).width/100;wcache.set(k,v)}return v}
function needFont(f,w,text){const k=f+'|'+w+'|'+text;if(fontReq.has(k))return;fontReq.add(k);
  if(document.fonts&&document.fonts.load)document.fonts.load(`${w} 20px "${f}"`,text||'あ').then(()=>{wcache.clear();lcache.clear();dirtyAll()}).catch(()=>{})}
function units(str,it,V){
  const out=[],sz=it.size*PT,tr=it.track/1000*sz,ch=[...str];
  for(let i=0;i<ch.length;){
    const c=ch[i];
    if(V&&/[\x21-\x7e]/.test(c)){
      let j=i;while(j<ch.length&&/[\x20-\x7e]/.test(ch[j]))j++;

      if(/^(\d{1,2}|[!?]{1,2})$/.test(run))out.push({s:run,k:'tcy',adv:sz+tr});

function layout(it){
  const key=[it.text,it.font,it.weight,it.size,it.leading,it.track,it.dir,it.align,it.w,it.h].join('\u0001');

}

/* ---------- drawing ---------- */
const sepCache=new Map();
function sepCanvas(id,ch){
  const key=id+ch;let c=sepCache.get(key);if(c)return c;
  const im=S.images[id];c=document.createElement('canvas');c.width=im.w;c.height=im.h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im.img,0,0);
  const d=x.getImageData(0,0,im.w,im.h),a=d.data;
  for(let p=0;p<a.length;p+=4){
    const r=a[p]/255,g=a[p+1]/255,b=a[p+2]/255;let v;
    if(ch==='g')v=0.299*r+0.587*g+0.114*b;

      if(ch==='k')ink=K;else{const q=ch==='c'?C:ch==='m'?M:Y;ink=K>=1?0:(q-K)/(1-K)}

    const gv=Math.round(v*255);a[p]=a[p+1]=a[p+2]=gv;

  x.putImageData(d,0,0);sepCache.set(key,c);return c;
}
function drawText(ctx,it,ch,preview){
  const L=layout(it),sz=it.size*PT,K=100;
  needFont(it.font,it.weight,it.text);
  ctx.save();ctx.fillStyle=col(it.color,ch);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${it.weight} ${sz*K}px "${it.font}", serif`;
  for(const g of L.glyphs){
    if(!g.s.trim())continue;
    ctx.save();ctx.translate(it.x+g.x,it.y+g.y);ctx.scale(1/K,1/K);
    if(g.rot)ctx.rotate(Math.PI/2);
    if(g.sx!==1)ctx.scale(g.sx,1);
    ctx.fillText(g.s,g.dx*sz*K,g.dy*sz*K);ctx.restore();
  }
  ctx.restore();
  if(preview&&L.overflow){const q=2.2;ctx.fillStyle=TOK.danger;ctx.fillRect(it.x+it.w-q,it.y+it.h-q,q,q)}
}
function drawItem(ctx,it,ch,preview){
  if(it.type==='rect'){
    if(it.fill){ctx.fillStyle=col(it.fill,ch);ctx.fillRect(it.x,it.y,it.w,it.h)}
    if(it.stroke&&it.sw>0){ctx.strokeStyle=col(it.stroke,ch);ctx.lineWidth=it.sw;ctx.strokeRect(it.x,it.y,it.w,it.h)}
  }else if(it.type==='image'){
    const im=it.imageId&&S.images[it.imageId];
    if(im&&im.img){
      const sc=it.fit==='contain'?Math.min(it.w/im.w,it.h/im.h):Math.max(it.w/im.w,it.h/im.h);
      const dw=im.w*sc,dh=im.h*sc;
      ctx.save();ctx.beginPath();ctx.rect(it.x,it.y,it.w,it.h);ctx.clip();
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(ch?sepCanvas(it.imageId,ch):im.img,it.x+(it.w-dw)/2,it.y+(it.h-dh)/2,dw,dh);ctx.restore();
    }else if(preview){
      ctx.save();ctx.strokeStyle=TOK.sub;ctx.lineWidth=0.2;ctx.beginPath();ctx.rect(it.x,it.y,it.w,it.h);
      ctx.moveTo(it.x,it.y);ctx.lineTo(it.x+it.w,it.y+it.h);ctx.moveTo(it.x+it.w,it.y);ctx.lineTo(it.x,it.y+it.h);ctx.stroke();ctx.restore();
    }
  }else if(it.type==='text'){
    if(preview&&S.guides){ctx.save();ctx.strokeStyle=TOK.line;ctx.lineWidth=0.2;ctx.setLineDash([1,1]);ctx.strokeRect(it.x,it.y,it.w,it.h);ctx.restore()}

}
function nombreText(i){return String(S.doc.nombre.start+i)}
function drawNombre(ctx,i,ch){
  const d=S.doc,nb=d.nombre;if(d.kind==='cover'||nb.mode==='none'||d.pages[i].noNombre)return;
  const W=pw(d),H=d.trimH,L=isLeft(i),t=nombreText(i);
  let size=nb.size,x,y=H-nb.offset;
  if(nb.mode==='hidden'){size=Math.min(size,6);const half=t.length*size*PT*0.3+0.6;x=L?W-half-0.8:half+0.8;y=H-25}
  else if(nb.mode==='center')x=W/2;

  ctx.save();ctx.fillStyle=col({c:0,m:0,y:0,k:100},ch);ctx.textBaseline='middle';
  ctx.textAlign=nb.mode==='outer'?(L?'left':'right'):'center';
  const K=100;ctx.translate(x,y);ctx.scale(1/K,1/K);ctx.font=`400 ${size*PT*K}px "${nb.font}", sans-serif`;ctx.fillText(t,0,0);ctx.restore();

function drawGuides(ctx,i){

function drawPage(ctx,i,o){

function drawMarks(ctx,W,H,b,ext,ch){
  const mk=ext-1;ctx.save();ctx.strokeStyle=col(REG,ch);ctx.lineWidth=0.1;ctx.beginPath();

  for(const [cx,sx] of [[0,-1],[W,1]])for(const [cy,sy] of [[0,-1],[H,1]]){
    L(cx+sx*b,cy,cx+sx*mk,cy);L(cx,cy+sy*b,cx+sx*mk,cy+sy*b);
    L(cx,cy+sy*b,cx,cy+sy*mk);L(cx+sx*b,cy,cx+sx*b,cy+sy*mk);

/* ---------- view ---------- */
const spreadsEl=$('#spreads'),pagesEl=$('#pages'),stage=$('#stage');

  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH;S.s=PX*S.zoom;
  io.disconnect();spreadsEl.innerHTML='';pagesEl.innerHTML='';S.pageEls=[];S.thumbEls=[];S.visible.clear();lcache.clear();

    for(const sl of slots){

      const ts=document.createElement('div');ts.className='tslot';ts.style.minWidth=Math.round(W*tS)+'px';
      for(const i of sl){

        const cv=document.createElement('canvas');const ov=document.createElement('div');ov.className='ov';pg.append(cv,ov);
        const no=document.createElement('div');no.className='pno';no.textContent=d.kind==='cover'?'表紙':nombreText(i);
        s.append(pg,no);S.pageEls[i]={el:pg,cv,ov};io.observe(pg);

function updateInfo(){const d=S.doc;const sz=Object.entries(SIZES).find(([k,v])=>v[0]===d.trimW&&v[1]===d.trimH);
  $('#docInfo').textContent=[d.name,(d.kind==='cover'?'表紙 ':'')+(sz?sz[0]+' ':'')+d.trimW+'×'+d.trimH+'mm'+(d.kind==='cover'?' 背幅'+d.spine+'mm':''),d.binding==='right'?'右綴じ':'左綴じ',d.color==='mono'?'モノクロ':'カラー',d.kind==='cover'?'':d.pages.length+'ページ'].filter(Boolean).join(' ・ ')}
let raf=0,tthumb=0;

function dirty(i){S.dirty.add(i);S.tdirty.add(i);schedule()}

function flush(){
  raf=0;readTokens();

function renderPage(i){

function projectData(){const used=new Set();S.doc.pages.forEach(p=>p.items.forEach(it=>{if(it.imageId)used.add(it.imageId)}));
  const images={};for(const id of used){const im=S.images[id];if(im)images[id]={src:im.src,w:im.w,h:im.h,name:im.name||''}}

async function loadProject(p){
  if(!p||!['thinbook','kumi'].includes(p.app)||!p.doc)throw new Error('Thinbookのプロジェクトファイルではありません');
  S.images={};
  await Promise.all(Object.entries(p.images||{}).map(([id,m])=>new Promise(res=>{const img=new Image();img.onload=()=>{S.images[id]={...m,img};res()};img.onerror=res;img.src=m.src})));

let dlCap=null;

  try{const dl=dlCap&&await dlCap;if(dl){await dl.save({filename:name,data:blob});toast('保存しました：'+name);return}}
  catch(e){if(e&&e.code==='declined')return;if(e&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)){toast('保存できませんでした（'+(e.code||e.message)+'）');return}}

  if(w*h>MAX){const k=Math.sqrt(MAX/(w*h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c.toDataURL('image/jpeg',0.95);w=c.width;h=c.height;

  res({src,w,h,img,name:file.name})};img.onerror=()=>rej(new Error('画像を読み込めませんでした'));img.src=fr.result};fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)})}

/* ---------- interaction ---------- */
function toMM(e,el){const r=el.getBoundingClientRect(),b=S.doc.bleed;return{x:(e.clientX-r.left)/S.s-b,y:(e.clientY-r.top)/S.s-b}}
function hit(pi,p){const its=S.doc.pages[pi].items;for(let k=its.length-1;k>=0;k--){const it=its[k];if(p.x>=it.x&&p.x<=it.x+it.w&&p.y>=it.y&&p.y<=it.y+it.h)return it}return null}
function snapLines(pi){const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,m=d.kind==='cover'?{x:d.margins.outer,y:d.margins.top,w:W-2*d.margins.outer,h:H-d.margins.top-d.margins.bottom}:margBox(pi);
  const xs=[-b,0,W/2,W,W+b,m.x,m.x+m.w],ys=[-b,0,H/2,H,H+b,m.y,m.y+m.h];if(d.kind==='cover')xs.push(d.trimW,d.trimW+d.spine);return{xs,ys}}
function snap1(vals,lines){const th=6/S.s;let best=null;for(const v of vals)for(const l of lines){const dd=l-v;if(Math.abs(dd)<th&&(best===null||Math.abs(dd)<Math.abs(best)))best=dd}return best||0}
spreadsEl.addEventListener('pointerdown',e=>{
  const pg=e.target.closest('.page');if(!pg||e.button>0)return;
  const pi=+pg.dataset.i,p=toMM(e,pg);setPage(pi);
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(S.tool==='select'){
    if(e.target.classList.contains('h')){const it=selItem();S.drag={mode:'resize',pi,id:it.id,dir:e.target.dataset.d,p0:p,o:{x:it.x,y:it.y,w:it.w,h:it.h}}}
    else{const it=hit(pi,p);if(it){select(pi,it.id);S.drag={mode:'move',pi,id:it.id,p0:p,o:{x:it.x,y:it.y,w:it.w,h:it.h}}}else{select(null);return}}
  }else S.drag={mode:'create',pi,p0:p,rect:null};
  pg.setPointerCapture(e.pointerId);e.preventDefault();
});
spreadsEl.addEventListener('pointermove',e=>{
  const D=S.drag;if(!D)return;const pe=S.pageEls[D.pi];const p=toMM(e,pe.el);let dx=p.x-D.p0.x,dy=p.y-D.p0.y;
  if(D.mode==='create'){const x=Math.min(p.x,D.p0.x),y=Math.min(p.y,D.p0.y);D.rect={x,y,w:Math.abs(dx),h:Math.abs(dy)};drawOverlay(D.pi);return}
  const it=findItem({page:D.pi,id:D.id});if(!it)return;const o=D.o,L=snapLines(D.pi);
  if(D.mode==='move'){
    if(e.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0}
    let nx=o.x+dx,ny=o.y+dy;nx+=snap1([nx,nx+o.w/2,nx+o.w],L.xs);ny+=snap1([ny,ny+o.h/2,ny+o.h],L.ys);it.x=r1(nx);it.y=r1(ny);
  }else{
    let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;const dd=D.dir;
    if(dd.includes('w')){x0+=dx;x0+=snap1([x0],L.xs)}if(dd.includes('e')){x1+=dx;x1+=snap1([x1],L.xs)}
    if(dd.includes('n')){y0+=dy;y0+=snap1([y0],L.ys)}if(dd.includes('s')){y1+=dy;y1+=snap1([y1],L.ys)}
    it.x=r1(Math.min(x0,x1-1));it.y=r1(Math.min(y0,y1-1));it.w=r1(Math.max(1,Math.abs(x1-x0)));it.h=r1(Math.max(1,Math.abs(y1-y0)));
  }
  dirty(D.pi);
});
function endDrag(){
  const D=S.drag;if(!D)return;S.drag=null;
  if(D.mode==='create'){
    let r=D.rect;if(!r||r.w<2||r.h<2){const W=S.tool==='text'?40:40;r={x:D.p0.x,y:D.p0.y,w:W,h:W}}
    r={x:r1(r.x),y:r1(r.y),w:r1(r.w),h:r1(r.h)};
    const mk=S.tool==='text'?textItem:S.tool==='image'?imageItem:rectItem;const it=mk(r);
    if(S.tool==='rect'&&S.doc.color==='mono')it.fill={c:0,m:0,y:0,k:20};
    S.doc.pages[D.pi].items.push(it);setTool('select');select(D.pi,it.id);dirty(D.pi);commit();
    if(it.type==='text')setTimeout(()=>{const t=$('#tText');if(t)t.focus()},0);
    if(it.type==='image'){imgTarget=it;$('#fImg').click()}
    return;
  }
  commit();renderProps();
}
spreadsEl.addEventListener('pointerup',endDrag);spreadsEl.addEventListener('pointercancel',endDrag);
spreadsEl.addEventListener('dblclick',e=>{const it=selItem();if(it&&it.type==='text'){showTab('props');const t=$('#tText');if(t){t.focus()}}else if(it&&it.type==='image'){imgTarget=it;$('#fImg').click()}});
stage.addEventListener('pointerdown',e=>{if(e.target===stage||e.target===spreadsEl||e.target.classList.contains('spread')||e.target.classList.contains('slot'))select(null)});
let imgTarget=null;
$('#fImg').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&imgTarget)placeImageInto(imgTarget,f)});
spreadsEl.addEventListener('dragover',e=>{if(e.target.closest('.page'))e.preventDefault()});
spreadsEl.addEventListener('drop',async e=>{
  const pg=e.target.closest('.page');if(!pg)return;e.preventDefault();const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(!f)return;
  const pi=+pg.dataset.i,p=toMM(e,pg);setPage(pi);let it=hit(pi,p);
  if(!it||it.type!=='image'){const m=margBox(pi);it=imageItem({x:r1(m.x),y:r1(m.y),w:r1(m.w),h:r1(m.h),fit:'contain'});S.doc.pages[pi].items.push(it)}
  select(pi,it.id);await placeImageInto(it,f);
});
pagesEl.addEventListener('click',e=>{const c=e.target.closest('.thumb');if(!c)return;const i=+c.dataset.i;setPage(i);S.pageEls[i].el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})});
function setTool(t){S.tool=t;$$('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));stage.style.cursor=t==='select'?'':'crosshair'}
$$('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function nudge(dx,dy){const it=selItem();if(!it)return;it.x=r1(it.x+dx);it.y=r1(it.y+dy);dirty(S.sel.page);commit();renderProps()}
function delSel(){const it=selItem();if(!it)return;const pg=S.doc.pages[S.sel.page];pg.items=pg.items.filter(x=>x!==it);const p=S.sel.page;select(null);dirty(p);commit()}
function dupSel(){const it=selItem();if(!it)return;const c=JSON.parse(JSON.stringify(it));c.id=uid();c.x+=5;c.y+=5;S.doc.pages[S.sel.page].items.push(c);select(S.sel.page,c.id);dirty(S.sel.page);commit()}
function order(dir){const it=selItem();if(!it)return;const a=S.doc.pages[S.sel.page].items,i=a.indexOf(it);a.splice(i,1);if(dir>0)a.push(it);else a.unshift(it);dirty(S.sel.page);commit()}
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;const typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel();return}
  if(mod&&(e.key==='='||e.key==='+')){e.preventDefault();zoomBy(1.25);return}
  if(mod&&e.key==='-'){e.preventDefault();zoomBy(0.8);return}
  if(e.key==='Delete'||e.key==='Backspace'){if(S.sel){e.preventDefault();delSel()}return}
  if(e.key==='Escape'){select(null);setTool('select');return}
  const st=e.shiftKey?5:0.5;
  if(e.key==='ArrowLeft'){e.preventDefault();nudge(-st,0)}else if(e.key==='ArrowRight'){e.preventDefault();nudge(st,0)}
  else if(e.key==='ArrowUp'){e.preventDefault();nudge(0,-st)}else if(e.key==='ArrowDown'){e.preventDefault();nudge(0,st)}
  else if(!mod){const t={v:'select',t:'text',i:'image',r:'rect'}[e.key.toLowerCase()];if(t)setTool(t)}
});

/* ---------- inspector ---------- */
function showTab(t){S.tab=t;$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));for(const k of['props','doc','pf'])$('#tab-'+k).hidden=k!==t;if(t==='doc')renderDoc();if(t==='pf')runPreflight();if(t==='props')renderProps()}
$$('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
const F=(label,inner)=>`<label class="f"><span>${label}</span>${inner}</label>`;
const N=(k,v,step=0.1,extra='')=>`<input type="number" id="i-${k.replace(/\./g,'-')}" data-k="${k}" value="${v}" step="${step}" ${extra}>`;
const SEL=(k,v,opts)=>`<select id="i-${k.replace(/\./g,'-')}" data-k="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
function colorFields(k,c){if(S.doc.color==='mono')return `<div class="row">${F('K（%）',N(k+'.k',c.k,1,'min="0" max="100"'))}</div>`;
  return `<div class="row4">${['c','m','y','k'].map(x=>F(x.toUpperCase(),N(k+'.'+x,c[x],1,'min="0" max="100"'))).join('')}</div>`}
function renderProps(){
  if(S.tab!=='props')return;const el=$('#tab-props'),it=selItem(),d=S.doc;

    $('#pNoNb').onchange=e=>{pg.noNombre=e.target.checked;dirty(S.page);commit();runPreflight()};

  let h=`<div class="sec"><h3>位置とサイズ（mm）</h3><div class="row">${F('X',N('x',it.x))}${F('Y',N('y',it.y))}${F('幅',N('w',it.w))}${F('高さ',N('h',it.h))}</div></div>`;
  if(it.type==='text'){
    h+=`<div class="sec"><h3>テキスト</h3><textarea id="tText" data-k="text" spellcheck="false">${esc(it.text)}</textarea></div>
    <div class="sec"><h3>文字</h3>${F('フォント',SEL('font',it.font,FONTS))}
      <div class="row">${F('太さ',SEL('weight',it.weight,[[400,'標準'],[700,'太字']]))}${F('サイズ（pt）',N('size',it.size,0.5,'min="1"'))}
      ${F('行送り（%）',N('leading',it.leading,5,'min="80"'))}${F('字送り（1/1000em）',N('track',it.track,10))}
      ${F('組方向',SEL('dir',it.dir,[['v','縦組み'],['h','横組み']]))}${F('揃え',SEL('align',it.align,[['start','行頭'],['center','中央'],['end','行末']]))}</div></div>
    <div class="sec"><h3>文字色</h3>${colorFields('color',it.color)}</div>`;
    const L=layout(it);if(L.overflow)h+=`<div class="sec"><span style="color:var(--danger)">テキストがフレームからあふれています</span></div>`;
  }else if(it.type==='image'){
    const im=S.images[it.imageId];const ppi=effPpi(it);
    h+=`<div class="sec"><h3>画像</h3><div class="btns"><button id="bPick">${im?'画像を差し替え':'画像を選択'}</button></div>
      ${F('配置',SEL('fit',it.fit,[['cover','フレームを埋める'],['contain','全体を表示']]))}
      ${im?`<div class="ok">${esc(im.name||'')} ${im.w}×${im.h}px ・ <span style="color:${ppi<300?'var(--warn)':'inherit'}">実効 ${ppi}ppi</span></div>`:''}</div>`;
  }else if(it.type==='rect'){
    h+=`<div class="sec"><h3><label class="chk"><input type="checkbox" data-null="fill" ${it.fill?'checked':''}> 塗り</label></h3>${it.fill?colorFields('fill',it.fill):''}</div>
    <div class="sec"><h3><label class="chk"><input type="checkbox" data-null="stroke" ${it.stroke?'checked':''}> 線</label></h3>${it.stroke?colorFields('stroke',it.stroke)+`<div class="row">${F('線幅（mm）',N('sw',it.sw,0.05,'min="0"'))}</div>`:''}</div>`;
  }
  h+=`<div class="sec"><h3>配置</h3><div class="btns"><button id="bFront">最前面へ</button><button id="bBack">最背面へ</button><button id="bDup">複製</button><button id="bDel">削除</button></div></div>`;
  el.innerHTML=h;
  const pick=$('#bPick');if(pick)pick.onclick=()=>{imgTarget=it;$('#fImg').click()};
  $('#bFront').onclick=()=>order(1);$('#bBack').onclick=()=>order(-1);$('#bDup').onclick=dupSel;$('#bDel').onclick=delSel;

function setPath(o,k,v){const ks=k.split('.');let t=o;for(let i=0;i<ks.length-1;i++)t=t[ks[i]];t[ks[ks.length-1]]=v}
function readVal(t){if(t.type==='checkbox')return t.checked;if(t.type==='number'){const v=parseFloat(t.value);return isNaN(v)?null:v}
  if(t.tagName==='SELECT'&&/^\d+$/.test(t.value)&&t.dataset.k==='weight')return +t.value;return t.value}
let commitT=0;
$('#tab-props').addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k,it=selItem();if(!k||!it)return;const v=readVal(t);if(v===null)return;
  setPath(it,k,v);dirty(S.sel.page);clearTimeout(commitT);commitT=setTimeout(()=>{commit();if(t.tagName!=='TEXTAREA'&&t.type!=='number')renderProps()},t.tagName==='TEXTAREA'?600:250);
  if(t.tagName==='SELECT'){clearTimeout(commitT);commit();renderProps()}

$('#tab-props').addEventListener('change',e=>{const t=e.target,n=t.dataset.null,it=selItem();if(!n||!it)return;it[n]=t.checked?(n==='fill'?{c:0,m:0,y:0,k:20}:{c:0,m:0,y:0,k:100}):null;dirty(S.sel.page);commit();renderProps()});

let docT=0;
$('#tab-doc').addEventListener('input',e=>{const t=e.target,k=t.dataset.dk;if(!k)return;let v=t.type==='number'?parseFloat(t.value):t.value;if(t.type==='number'&&(isNaN(v)||v<0))return;
  if((k==='trimW'||k==='trimH')&&v<20)return;setPath(S.doc,k,v);clearTimeout(docT);
  const structural=['trimW','trimH','spine','bleed','binding','nombre.start'].includes(k);
  docT=setTimeout(()=>{if(structural)rebuild();else{dirtyAll();updateInfo()}commit();if(k==='color')renderProps()},t.tagName==='SELECT'?0:350)});

/* ---------- pages ---------- */
function addPages(at,n){for(let k=0;k<n;k++)S.doc.pages.splice(at,0,{id:uid(),items:[],noNombre:false});rebuild();commit();setPage(at);toast(n+'ページ追加しました')}
$('#bAddP').onclick=()=>{if(S.doc.kind==='cover')return;addPages(S.page+1,1)};
$('#bDelP').onclick=()=>{const d=S.doc;if(d.kind==='cover'||d.pages.length<=1)return;d.pages.splice(S.page,1);S.sel=null;S.page=Math.min(S.page,d.pages.length-1);rebuild();commit();renderProps();toast('ページを削除しました（Ctrl+Zで元に戻せます）')};

/* ---------- preflight ---------- */
let pfT=0,PF=[];
function preflight(){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,out=[],safe=3;
  if(d.kind==='body'&&d.pages.length%4!==0)out.push({lv:'warn',page:null,msg:`ページ数が4の倍数ではありません（${d.pages.length}ページ）`});
  if(d.kind==='cover'&&!(d.spine>0))out.push({lv:'warn',page:0,msg:'背幅が0mmです。印刷所の背幅計算で確認してください'});
  let rgb=false;
  d.pages.forEach((pg,i)=>{
    const lab=d.kind==='cover'?'表紙':nombreText(i);
    for(const it of pg.items){
      const at={page:i,id:it.id,lab};
      if(it.type==='text'){
        const L=layout(it);
        if(L.overflow)out.push({lv:'err',...at,msg:'テキストがフレームからあふれています'});
        if(L.bbox){const x0=it.x+L.bbox.x0,x1=it.x+L.bbox.x1,y0=it.y+L.bbox.y0,y1=it.y+L.bbox.y1;
          if(x0<safe||y0<safe||x1>W-safe||y1>H-safe)out.push({lv:'warn',...at,msg:`文字が仕上がり線から${safe}mm以内にあります（断裁で切れる恐れ）`})}
      }else{
        if(it.type==='image'){
          if(!it.imageId)out.push({lv:'warn',...at,msg:'画像が配置されていない画像フレームがあります'});
          else{const ppi=effPpi(it);if(ppi<300)out.push({lv:'warn',...at,msg:`画像の実効解像度が低めです（${ppi}ppi、推奨350ppi以上）`});if(d.color==='cmyk')rgb=true}
        }
        if(it.type==='rect'&&!it.fill&&!it.stroke)continue;
        const e=0.01;const short=(it.x<-e&&it.x>-b+e)||(it.y<-e&&it.y>-b+e)||(it.x+it.w>W+e&&it.x+it.w<W+b-e)||(it.y+it.h>H+e&&it.y+it.h<H+b-e);
        const touchTrim=(Math.abs(it.x)<0.3)||(Math.abs(it.y)<0.3)||(Math.abs(it.x+it.w-W)<0.3)||(Math.abs(it.y+it.h-H)<0.3);
        if(short)out.push({lv:'err',...at,msg:`塗り足しが不足しています（仕上がり線の外へ${b}mmまで伸ばしてください）`});
        else if(touchTrim)out.push({lv:'warn',...at,msg:'オブジェクトの端が仕上がり線ぴったりです。断裁ずれで白が出る恐れがあります'});
      }
    }
  });
  if(rgb)out.push({lv:'info',page:null,msg:'RGB画像は書き出し時にCMYKへ変換されます。色味が変わる場合があります'});
  return out;
}
function runPreflight(){
  PF=preflight();const e=PF.filter(x=>x.lv==='err').length,w=PF.filter(x=>x.lv==='warn').length;
  $('#pfBadge').innerHTML=e?`<span class="badge">${e}</span>`:w?`<span class="badge w">${w}</span>`:'';
  if(S.tab!=='pf')return;
  $('#tab-pf').innerHTML=PF.length?`<div class="pf">${PF.map((x,k)=>`<button class="pfi ${x.lv}" data-k="${k}"><i></i><b>${x.lab?'p.'+esc(x.lab):'全体'}</b><span>${esc(x.msg)}</span></button>`).join('')}</div>`
    :`<div class="ok">問題は見つかりませんでした</div>`;
}
$('#tab-pf').addEventListener('click',e=>{const b=e.target.closest('.pfi');if(!b)return;const x=PF[+b.dataset.k];if(x.page==null)return;setPage(x.page);
  S.pageEls[x.page].el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});if(x.id)select(x.page,x.id)});

/* ---------- zoom ---------- */
function zoomBy(k){S.zoom=clamp(S.zoom*k,0.2,6);rebuild();if(S.sel)drawOverlay(S.sel.page)}
function fitZoom(){const d=S.doc,h=stage.clientHeight||700,w=stage.clientWidth||900;const ph=(d.trimH+2*d.bleed)*PX,spw=(d.kind==='cover'?pw(d)+2*d.bleed:(pw(d)+2*d.bleed)*2)*PX+12;
  S.zoom=clamp(Math.min((h-90)/ph,(w-70)/spw,1.5),0.2,1.5)}
$('#bZi').onclick=()=>zoomBy(1.25);$('#bZo').onclick=()=>zoomBy(0.8);
$('#bGuide').onclick=()=>{S.guides=!S.guides;$('#bGuide').classList.toggle('on',S.guides);dirtyAll()};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
function renderAll(){renderProps();renderDoc();runPreflight()}

/* ---------- new / open / save ---------- */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;return m.firstChild}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal'&&!exporting)closeModal()});
$('#bNew').onclick=()=>{
  const dlg=modal(`<h2>新規書類</h2>
    <div class="row">${F('種類','<select id="n-kind"><option value="body">本文</option><option value="cover">表紙（表1・背・表4）</option></select>')}
    ${F('仕上がりサイズ',`<select id="n-size">${Object.keys(SIZES).map(k=>`<option${k==='A5'?' selected':''}>${k}</option>`).join('')}<option value="custom">カスタム</option></select>`)}
    ${F('幅（mm）','<input type="number" id="n-w" value="148" step="1">')}${F('高さ（mm）','<input type="number" id="n-h" value="210" step="1">')}
    ${F('綴じ','<select id="n-bind"><option value="right">右綴じ（縦書き）</option><option value="left">左綴じ（横書き）</option></select>')}
    ${F('カラー','<select id="n-col"><option value="mono">モノクロ</option><option value="cmyk">カラー（CMYK）</option></select>')}
    <span id="n-pw">${F('ページ数','<input type="number" id="n-pages" value="24" step="4" min="1">')}</span>
    <span id="n-sw" hidden>${F('背幅（mm）','<input type="number" id="n-spine" value="3" step="0.1" min="0">')}</span></div>
    <div class="foot"><button id="n-cancel">キャンセル</button><button class="primary" id="n-ok">作成</button></div>`);
  const sync=()=>{const k=$('#n-size').value;if(k!=='custom'){$('#n-w').value=SIZES[k][0];$('#n-h').value=SIZES[k][1]}const cv=$('#n-kind').value==='cover';$('#n-pw').hidden=cv;$('#n-sw').hidden=!cv};
  $('#n-size').onchange=sync;$('#n-kind').onchange=sync;
  $('#n-cancel').onclick=closeModal;
  $('#n-ok').onclick=()=>{const w=+$('#n-w').value,h=+$('#n-h').value;if(!(w>=20&&h>=20)){toast('サイズを20mm以上で入力してください');return}
    const kind=$('#n-kind').value;S.doc=newDoc({kind,name:'無題',w,h,binding:$('#n-bind').value,color:$('#n-col').value,pages:+$('#n-pages').value,spine:+$('#n-spine').value});
    S.images={};S.sel=null;S.page=0;closeModal();fitZoom();rebuild();renderAll();resetHistory()};
};
$('#bOpen').onclick=()=>$('#fOpen').click();
$('#fOpen').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await loadProject(JSON.parse(await f.text()));toast('開きました：'+f.name)}catch(err){toast(err.message||'開けませんでした')}});
function saveProject(){const j=JSON.stringify(projectData());saveFile((S.doc.name||'無題')+'.thinbook.json',new Blob([j],{type:'application/json'}))}
$('#bSave').onclick=saveProject;

/* ---------- PDF export ---------- */
let exporting=false;
$('#bExport').onclick=()=>{
  runPreflight();const d=S.doc,e=PF.filter(x=>x.lv==='err').length,w=PF.filter(x=>x.lv==='warn').length,n=d.pages.length;
  const dlg=modal(`<h2>入稿用PDF書き出し</h2>
    <div class="row">${F('ページ範囲',`<select id="x-range"><option value="all">すべて（${n}ページ）</option><option value="cur">現在のページ</option></select>`)}
    ${F('トンボ','<select id="x-marks"><option value="0">なし（塗り足し込みサイズ）</option><option value="1">あり（日本式）</option></select>')}
    ${F('解像度',`<select id="x-dpi"><option value="600"${d.color==='mono'?' selected':''}>600dpi</option><option value="350"${d.color==='cmyk'?' selected':''}>350dpi</option></select>`)}
    ${F('カラー',`<input type="text" id="x-col" value="${d.color==='mono'?'グレースケール':'CMYK'}" readonly>`)}</div>
    ${F('ファイル名',`<input type="text" id="x-name" value="${esc((d.name||'無題')+(d.kind==='cover'?'_表紙':'_本文'))}.pdf">`)}
    ${e||w?`<div style="color:${e?'var(--danger)':'var(--warn)'}">プリフライト：エラー ${e}件・警告 ${w}件</div>`:''}
    <div class="prog" id="x-prog" hidden><div></div></div><div class="ok" id="x-msg"></div>
    <div class="foot"><button id="x-cancel">閉じる</button><button class="primary" id="x-go">書き出し</button></div>`);
  $('#x-cancel').onclick=()=>{if(exporting){exporting='cancel';return}closeModal()};
  $('#x-go').onclick=async()=>{
    const opt={marks:$('#x-marks').value==='1',dpi:+$('#x-dpi').value,range:$('#x-range').value==='cur'?[S.page]:d.pages.map((_,i)=>i)};
    let name=$('#x-name').value.trim()||'thinbook.pdf';if(!/\.pdf$/i.test(name))name+='.pdf';
    $('#x-go').disabled=true;$('#x-prog').hidden=false;exporting=true;
    try{const blob=await exportPDF(opt,(k,t,msg)=>{$('#x-prog').firstChild.style.width=(k/t*100)+'%';$('#x-msg').textContent=msg});
      if(blob){$('#x-msg').textContent=`完了：${(blob.size/1048576).toFixed(1)}MB`;await saveFile(name,blob)}else $('#x-msg').textContent='中止しました'}
    catch(err){console.error(err);$('#x-msg').textContent='書き出しに失敗しました：'+(err.message||err)}
    exporting=false;$('#x-go').disabled=false;
  };
};
const enc=new TextEncoder();
async function deflate(u8){const s=new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate'));return new Uint8Array(await new Response(s).arrayBuffer())}
function pdfStr(s){let h='FEFF';for(const c of s){const cp=c.codePointAt(0);if(cp>0xffff){const v=cp-0x10000;h+=((0xd800+(v>>10)).toString(16)+(0xdc00+(v&0x3ff)).toString(16)).toUpperCase()}else h+=cp.toString(16).padStart(4,'0').toUpperCase()}return '<'+h+'>'}
async function ensureFonts(){
  const ps=[];const d=S.doc;
  for(const pg of d.pages)for(const it of pg.items)if(it.type==='text')ps.push(document.fonts.load(`${it.weight} 20px "${it.font}"`,it.text||'あ'));
  ps.push(document.fonts.load(`400 20px "${d.nombre.font}"`,'0123456789'));
  await Promise.all(ps.map(p=>p.catch(()=>{})));await document.fonts.ready;wcache.clear();lcache.clear();
}
async function exportPDF(opt,progress){
  await ensureFonts();
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,ext=opt.marks?b+12:b,mw=W+2*ext,mh=H+2*ext,s=opt.dpi/25.4;
  const pxW=Math.round(mw*s),pxH=Math.round(mh*s),cmyk=d.color==='cmyk',chans=cmyk?['c','m','y','k']:['g'],nc=chans.length;
  const band=Math.max(16,Math.min(pxH,Math.floor(4e6/pxW)));
  const cv=document.createElement('canvas');cv.width=pxW;cv.height=band;const ctx=cv.getContext('2d',{willReadFrequently:true});
  const parts=[];let len=0;const offs=[];
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(id,body,stream)=>{offs[id]=len;push(id+' 0 obj\n'+body);if(stream){push('\nstream\n');push(stream);push('\nendstream')}push('\nendobj\n')};
  push('%PDF-1.3\n');push(new Uint8Array([37,226,227,207,211,10]));
  const k=MMPT,f=v=>(Math.round(v*k*1000)/1000).toString();
  const kids=[];let id=5;const total=opt.range.length*nc;let step=0;
  for(const i of opt.range){
    const raw=new Uint8Array(pxW*pxH*nc);
    for(let ci=0;ci<nc;ci++){
      const ch=chans[ci];
      for(let y0=0;y0<pxH;y0+=band){
        if(exporting==='cancel')return null;
        const bh=Math.min(band,pxH-y0);
        ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,pxW,band);
        ctx.setTransform(s,0,0,s,ext*s,ext*s-y0);
        drawPage(ctx,i,{ch,preview:false,guides:false});if(opt.marks)drawMarks(ctx,W,H,b,ext,ch);
        const px=ctx.getImageData(0,0,pxW,bh).data;const base=y0*pxW;
        if(cmyk){for(let p=0,n=pxW*bh;p<n;p++)raw[(base+p)*4+ci]=255-px[p*4]}
        else{for(let p=0,n=pxW*bh;p<n;p++)raw[base+p]=px[p*4]}
        await new Promise(r=>setTimeout(r,0));
      }
      sepCache.clear();step++;progress(step,total,`${step<total?'処理中':'圧縮中'}：${d.kind==='cover'?'表紙':'p.'+nombreText(i)}（${Math.ceil(step/nc)} / ${opt.range.length}）`);
    }
    const z=await deflate(raw);
    const pid=id,cid=id+1,iid=id+2;id+=3;kids.push(pid);
    obj(iid,`<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /${cmyk?'DeviceCMYK':'DeviceGray'} /BitsPerComponent 8 /Filter /FlateDecode /Length ${z.length} >>`,z);
    const cs=`q ${f(mw)} 0 0 ${f(mh)} 0 0 cm /Im0 Do Q`;
    obj(cid,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(mw)} ${f(mh)}] /BleedBox [${f(ext-b)} ${f(ext-b)} ${f(ext+W+b)} ${f(ext+H+b)}] /TrimBox [${f(ext)} ${f(ext)} ${f(ext+W)} ${f(ext+H)}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageB /ImageC] >> /Contents ${cid} 0 R >>`);
  }
  const now=new Date(),dt='D:'+now.toISOString().replace(/[-:T]/g,'').slice(0,14)+'Z';
  obj(1,'<< /Type /Catalog /Pages 2 0 R /OutputIntents [3 0 R] >>');
  obj(2,`<< /Type /Pages /Kids [${kids.map(x=>x+' 0 R').join(' ')}] /Count ${kids.length} >>`);
  obj(3,'<< /Type /OutputIntent /S /GTS_PDFX /OutputConditionIdentifier (JC200103) /OutputCondition (Japan Color 2001 Coated) /RegistryName (http://www.color.org) /Info (Japan Color 2001 Coated) >>');
  obj(4,`<< /Title ${pdfStr(d.name||'無題')} /Creator (Thinbook) /Producer (Thinbook) /CreationDate (${dt}) /ModDate (${dt}) /GTS_PDFXVersion (PDF/X-1:2001) /GTS_PDFXConformance (PDF/X-1a:2001) /Trapped /False >>`);
  const xref=len,N=id;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let j=1;j<N;j++)x+=String(offs[j]).padStart(10,'0')+' 00000 n \n';
  const fid=[...crypto.getRandomValues(new Uint8Array(16))].map(v=>v.toString(16).padStart(2,'0')).join('');
  push(x+`trailer\n<< /Size ${N} /Root 1 0 R /Info 4 0 R /ID [<${fid}> <${fid}>] >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

/* ---------- neta (idea notes) ---------- */
const N8={list:[],cur:null,q:'',tag:'',open:false,t:0};
const netaEl=$('#neta');
function netaSave(){clearTimeout(N8.t);N8.t=setTimeout(()=>kvSet('neta',N8.list),400)}
function netaTags(s){return[...new Set(String(s).split(/[,、，\s]+/).map(x=>x.replace(/^#/,'').trim()).filter(Boolean))]}
function netaDate(t){const d=new Date(t);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}
function netaCur(){return N8.list.find(n=>n.id===N8.cur)||null}
function netaNew(){const t=Date.now(),n={id:uid(),title:'',body:'',tags:N8.tag?[N8.tag]:[],images:[],created:t,updated:t};N8.list.unshift(n);N8.cur=n.id;N8.q='';$('#nQ').value='';netaSave();netaRenderList();netaRenderEdit();$('#nTitle').focus()}
function netaTouch(n){n.updated=Date.now();N8.list.sort((a,b)=>b.updated-a.updated);netaSave()}
function netaMatch(n){if(N8.tag&&!n.tags.includes(N8.tag))return false;if(!N8.q)return true;const q=N8.q.toLowerCase();return(n.title+'\n'+n.body+'\n'+n.tags.join(' ')).toLowerCase().includes(q)}
function netaRenderList(){
  const all=[...new Set(N8.list.flatMap(n=>n.tags))].sort((a,b)=>a.localeCompare(b,'ja'));if(N8.tag&&!all.includes(N8.tag))N8.tag='';
  $('#nTagF').innerHTML=all.map(t=>`<button data-tag="${esc(t)}" class="${t===N8.tag?'on':''}">${esc(t)}</button>`).join('');
  const vis=N8.list.filter(netaMatch);
  $('#nItems').innerHTML=vis.length?vis.map(n=>`<button class="nit${n.id===N8.cur?' cur':''}" data-id="${n.id}"><b>${esc(n.title||'無題')}</b><small>${netaDate(n.updated)}${n.images.length?' ・ 画像'+n.images.length:''}</small>${n.tags.length?`<span class="ntags">${n.tags.map(t=>`<span class="ntag">${esc(t)}</span>`).join('')}</span>`:''}</button>`).join(''):`<div class="nempty">${N8.list.length?'該当なし':'ネタがありません'}</div>`;
}
function netaRenderEdit(){
  const n=netaCur(),el=$('#nEdit');
  if(!n){el.innerHTML=`<div class="nempty"><button class="primary" id="nAdd2">ネタを追加</button></div>`;$('#nAdd2').onclick=netaNew;return}
  el.innerHTML=`<input type="text" id="nTitle" value="${esc(n.title)}" placeholder="タイトル" aria-label="タイトル">
    ${F('タグ',`<input type="text" id="nTagIn" value="${esc(n.tags.join(', '))}" placeholder="カンマ区切り">`)}
    <textarea id="nBody" spellcheck="false" aria-label="本文">${esc(n.body)}</textarea>
    <div class="sec"><h3>画像</h3><div class="nimgs" id="nImgs">${n.images.map((im,k)=>`<div class="nimg"><img src="${im.src}" alt="${esc(im.name||'')}"><button data-rm="${k}" aria-label="画像を削除">×</button></div>`).join('')}<button id="nImgAdd" class="nimg" aria-label="画像を追加">＋</button></div></div>
    <div class="nact"><button id="nDel">削除</button><button class="primary" id="nBook">このネタで新規書類</button></div>`;
  $('#nTitle').oninput=e=>{n.title=e.target.value;netaTouch(n);netaRenderList()};
  $('#nBody').oninput=e=>{n.body=e.target.value;netaTouch(n)};
  $('#nTagIn').onchange=e=>{n.tags=netaTags(e.target.value);e.target.value=n.tags.join(', ');netaTouch(n);netaRenderList()};
  $('#nImgAdd').onclick=()=>$('#fNetaImg').click();
  $('#nImgs').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;n.images.splice(+b.dataset.rm,1);netaTouch(n);netaRenderEdit();netaRenderList()};
  $('#nDel').onclick=()=>{const d=modal(`<h2>「${esc(n.title||'無題')}」を削除しますか？</h2><div class="foot"><button id="nd-c">キャンセル</button><button class="primary" id="nd-ok">削除</button></div>`);
    $('#nd-c').onclick=closeModal;$('#nd-ok').onclick=()=>{N8.list=N8.list.filter(x=>x!==n);N8.cur=(N8.list.find(netaMatch)||{}).id||null;netaSave();closeModal();netaRenderList();netaRenderEdit()}};
  $('#nBook').onclick=()=>netaToBook(n);
}
async function netaAddImages(files){const n=netaCur();if(!n)return;
  for(const f of files){if(!f.type.startsWith('image/'))continue;try{const im=await readImage(f);n.images.push({id:uid(),src:im.src,w:im.w,h:im.h,name:im.name||''})}catch(e){toast(e.message)}}
  netaTouch(n);netaRenderEdit();netaRenderList()}
function netaToBook(n){
  $('#bNew').onclick();const ok=$('#n-ok'),orig=ok.onclick;
  ok.onclick=async()=>{orig();if(!$('#modal').hidden)return;
    const d=S.doc;d.name=n.title||'無題';
    if(d.kind!=='cover'){
      if(n.body.trim()){const m=margBox(0);d.pages[0].items.push(textItem({x:m.x,y:m.y,w:m.w,h:m.h,text:n.body}))}
      let pi=n.body.trim()?1:0;
      for(const im of n.images){
        while(pi>=d.pages.length)d.pages.push({id:uid(),items:[],noNombre:false});
        const img=new Image();await new Promise(r=>{img.onload=img.onerror=r;img.src=im.src});
        const id=uid();S.images[id]={src:im.src,w:im.w,h:im.h,name:im.name,img};
        const m=margBox(pi);d.pages[pi].items.push(imageItem({x:r1(m.x),y:r1(m.y),w:r1(m.w),h:r1(m.h),fit:'contain',imageId:id}));pi++;
      }
    }
    netaShow(false);fitZoom();rebuild();renderAll();resetHistory();toast('ネタから書類を作成しました');
  };
}
function netaShow(on){N8.open=on;$('#app').classList.toggle('neta-on',on);netaEl.hidden=!on;$('#bNeta').classList.toggle('on',on);
  if(on){if(!netaCur())N8.cur=(N8.list[0]||{}).id||null;netaRenderList();netaRenderEdit()}else{dirtyAll()}}
$('#bNeta').onclick=()=>netaShow(!N8.open);
$('#nAdd').onclick=netaNew;
$('#nQ').oninput=e=>{N8.q=e.target.value.trim();netaRenderList()};
$('#nTagF').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;N8.tag=N8.tag===b.dataset.tag?'':b.dataset.tag;netaRenderList()};
$('#nItems').onclick=e=>{const b=e.target.closest('.nit');if(!b)return;N8.cur=b.dataset.id;netaRenderList();netaRenderEdit()};
$('#fNetaImg').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';netaAddImages(fs)});
$('#nEdit').addEventListener('dragover',e=>{if(!netaCur())return;e.preventDefault();const g=$('#nImgs');if(g)g.classList.add('drop')});
$('#nEdit').addEventListener('dragleave',e=>{if(!e.currentTarget.contains(e.relatedTarget)){const g=$('#nImgs');if(g)g.classList.remove('drop')}});
$('#nEdit').addEventListener('drop',e=>{e.preventDefault();const g=$('#nImgs');if(g)g.classList.remove('drop');netaAddImages([...e.dataTransfer.files])});
$('#nEdit').addEventListener('paste',e=>{const fs=[...(e.clipboardData&&e.clipboardData.files)||[]].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();netaAddImages(fs)}});
document.addEventListener('keydown',e=>{if(N8.open){if(e.key==='Escape'&&!$('#modal').hidden)return;e.stopImmediatePropagation()}},true);
$('#nExp').onclick=()=>saveFile('ネタ帳.thinbook-neta.json',new Blob([JSON.stringify({app:'thinbook-neta',version:1,notes:N8.list})],{type:'application/json'}));
$('#nImp').onclick=()=>$('#fNeta').click();
$('#fNeta').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||p.app!=='thinbook-neta'||!Array.isArray(p.notes))throw new Error('ネタ帳のファイルではありません');
    const have=new Set(N8.list.map(n=>n.id));let k=0;for(const n of p.notes){if(!n||!n.id||have.has(n.id))continue;N8.list.push({title:'',body:'',tags:[],images:[],created:Date.now(),updated:Date.now(),...n});k++}
    N8.list.sort((a,b)=>b.updated-a.updated);netaSave();netaRenderList();netaRenderEdit();toast(k+'件読み込みました')}
  catch(err){toast(err.message||'読み込めませんでした')}});
kvGet('neta').then(v=>{if(Array.isArray(v))N8.list=v;if(N8.open){netaRenderList();netaRenderEdit()}});

/* ---------- boot ---------- */
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(dirtyAll,150)});
if(document.fonts)document.fonts.addEventListener('loadingdone',()=>{wcache.clear();lcache.clear();if(S.doc)dirtyAll()});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>dirtyAll());
(async()=>{
  const saved=await kvGet('project');
  try{if(saved&&saved.doc){await loadProject(saved);return}}catch(e){}
  S.doc=sampleDoc();fitZoom();rebuild();renderAll();resetHistory();
})();
window.__thinbook={S,exportPDF,preflight,layout};
</script>
