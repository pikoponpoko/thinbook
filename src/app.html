<style>
/* Layout: header / pages | spread stage | inspector — a production tool, flat and dense */
:root{
  --bg:#ffffff; --panel:#f3f5f7; --stage:#d9dee4; --ink:#15181c; --sub:#5d6670; --line:#d0d6dc; --hover:#e6eaee;
  --accent:#1d5cff; --accent-ink:#ffffff; --danger:#e0243a; --warn:#c25a00; --guide:#8b3dff; --paper:#ffffff;
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --panel:#1e2125; --stage:#2a2e34; --ink:#e8ebee; --sub:#9aa3ad; --line:#383d44; --hover:#2a2f35;
  --accent:#5c8aff; --accent-ink:#0b0d10; --danger:#ff5468; --warn:#ff9d3d; --guide:#a770ff; --paper:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1e2125; --stage:#2a2e34; --ink:#e8ebee; --sub:#9aa3ad; --line:#383d44; --hover:#2a2f35;
  --accent:#5c8aff; --accent-ink:#0b0d10; --danger:#ff5468; --warn:#ff9d3d; --guide:#a770ff; --paper:#ffffff; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;line-height:1.4}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-width:0}
input[type=number]{font-family:var(--num);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:172px minmax(0,1fr) 280px;grid-template-rows:44px minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.logo{font-weight:700;font-size:15px;letter-spacing:.04em}
.grp{display:flex;gap:4px;align-items:center}
#zoomLbl{font-family:var(--num);min-width:44px;text-align:center}
#docInfo{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.tools button{padding:6px 4px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:700}
.ph .grp button{padding:0 8px}
#pages{padding:8px;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.tsp{display:flex;justify-content:center;gap:2px}
.tslot{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumb{border:1px solid var(--line);background:var(--paper);cursor:pointer;display:block}
.thumb.cur{outline:2px solid var(--accent)}
.tno{font-family:var(--num);font-size:11px;color:var(--sub)}
#stage{background:var(--stage);overflow:auto;position:relative;min-width:0}
#spreads{display:flex;flex-direction:column;align-items:center;gap:36px;padding:32px;min-width:max-content}
.spread{display:flex;gap:12px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.page{position:relative;background:var(--paper);touch-action:none}
.page canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0}
.pno{font-family:var(--num);font-size:11px;color:var(--sub)}
.selbox{position:absolute;border:1px solid var(--accent);pointer-events:none}
.selbox .h{position:absolute;width:8px;height:8px;background:var(--bg);border:1px solid var(--accent);pointer-events:auto;margin:-5px 0 0 -5px}
.tmpbox{position:absolute;border:1px dashed var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 4px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);background:transparent;border-bottom-color:var(--accent);font-weight:700}
.tab{padding:10px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>h3{margin:0;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span{font-size:11px;color:var(--sub)}
.f>input,.f>select{width:100%}
.chk{display:flex;align-items:center;gap:6px}
textarea#tText{width:100%;min-height:140px;resize:vertical;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.pf{display:flex;flex-direction:column;gap:4px}
.pfi{display:grid;grid-template-columns:8px 44px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:1px solid var(--line);padding:6px 8px;background:var(--bg)}
.pfi i{width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--sub)}
.pfi.err i{background:var(--danger)}
.pfi.warn i{background:var(--warn)}
.pfi b{font-family:var(--num);font-weight:400;color:var(--sub)}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:var(--paper);font-size:10px;line-height:16px;font-family:var(--num)}
.badge.w{background:var(--warn)}
.ok{color:var(--sub)}
#modal{position:fixed;inset:0;background:rgba(21,24,28,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal[hidden]{display:none!important}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.dlg h2{margin:0;font-size:15px}
.dlg .foot{display:flex;justify-content:flex-end;gap:6px}
.prog{height:6px;background:var(--hover);border-radius:3px;overflow:hidden}
.prog>div{height:100%;width:0;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 60vh auto auto;height:auto}
  header{flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #docInfo{flex-basis:100%;order:9}
  #left{border-right:0;border-bottom:1px solid var(--line)}
  #pages{flex-direction:row;overflow-x:auto}
  .tools{grid-template-columns:repeat(4,1fr)}
  #left,#right{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
}
#pres{position:fixed;inset:0;z-index:15;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) 10px;padding-bottom:env(safe-area-inset-bottom,0px)}
.pbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.pbar .sp,.dlg .sp{flex:1}
.pt{display:flex;flex-direction:column;line-height:1.15}
.pt>span{font-size:11px;color:var(--sub)}
.pt b,.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.pt b{font-size:18px}.pt b.big{font-size:30px}.pt small{font-family:var(--num);color:var(--sub)}
.pt .warn{color:var(--warn)}.pt .over,.num.over,td.over{color:var(--danger)}.pt .ahead{color:var(--accent)}
#pt-no{font-size:16px}#pt-rec{color:var(--danger);font-weight:700}
.pmain{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,32%);min-height:0}
.pcur{background:var(--stage);display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden;cursor:pointer}
.pcur canvas,.pnext canvas{display:block;background:var(--paper)}
.pside{display:flex;flex-direction:column;gap:8px;padding:12px;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.pnext{display:flex;flex-direction:column;gap:4px}.pnext>span,.pnh>span:first-child{font-size:11px;color:var(--sub);font-weight:700}
#p-nextw{height:clamp(80px,20vh,200px);display:flex;align-items:center;justify-content:center;background:var(--stage)}
#p-nextw.none canvas{display:none}
#p-cam{width:100%;max-height:22vh;object-fit:contain;transform:scaleX(-1);background:var(--stage)}
.pnh{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.pnh .grp button{padding:2px 8px}
.pnotes{flex:1;overflow:auto;line-height:1.7;white-space:normal;overflow-wrap:anywhere;padding-right:4px}
.hid{background:var(--line);color:transparent;border-radius:2px;cursor:pointer}
.hid.blk{display:block}.hid.rv{background:transparent;color:var(--sub)}
.ptl{display:flex;position:relative;background:var(--hover)}
.ptl i{display:block;flex-basis:0;border-right:1px solid var(--bg);background:var(--hover)}
.ptl i.done{background:var(--line)}.ptl i.cur{background:var(--accent)}
.ptl.over{background:var(--danger)}
.ptl em{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.pback{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none}
#pres.only{grid-template-rows:minmax(0,1fr)}
#pres.only .pbar,#pres.only .pside,#pres.only .ptl{display:none}
#pres.only .pmain{grid-template-columns:minmax(0,1fr)}
#pres.only.mv .pback{display:block}
.dlg.wide{width:min(880px,100%)}
.dlg.wide>*{flex-shrink:0}
.rsum{display:flex;gap:24px;flex-wrap:wrap}.rsum>div{display:flex;flex-direction:column}.rsum span{font-size:11px;color:var(--sub)}.rsum b{font-size:20px}
.dlg video,.dlg audio{width:100%;max-height:40vh;background:var(--stage)}
.rchart{width:100%;display:block;cursor:pointer;border:1px solid var(--line)}
.rleg{display:flex;gap:14px;font-size:11px;color:var(--sub)}.rleg span::before{content:"";display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.rleg .l1::before{background:var(--accent)}.rleg .l2::before{background:var(--guide)}
.rtw{overflow:auto;max-height:36vh;border:1px solid var(--line)}
.rtab{border-collapse:collapse;width:100%;font-family:var(--num);font-variant-numeric:tabular-nums}
.rtab th{position:sticky;top:0;background:var(--panel);font-family:var(--ui);font-weight:700;font-size:11px;color:var(--sub);text-align:right;padding:4px 8px;white-space:nowrap}
.rtab td{text-align:right;padding:4px 8px;border-top:1px solid var(--line)}
.rtab th:first-child,.rtab td:first-child{text-align:left}
.rtab tbody tr{cursor:pointer}.rtab tbody tr:hover{background:var(--hover)}.rtab tr.on{outline:2px solid var(--accent);outline-offset:-2px}.rtab tr.skip{color:var(--sub)}
.rscr{line-height:1.7;overflow-wrap:anywhere}.rscr u{text-decoration-color:var(--danger);text-decoration-thickness:2px}
.rmemo{white-space:pre-wrap;color:var(--sub)}
.rlist{display:flex;flex-direction:column;gap:4px}.rlist button{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:8px;text-align:left}.rlist button .num{text-align:right}
textarea#pNotes{width:100%;min-height:100px;resize:vertical;line-height:1.6}
@media (max-width:820px){
  .pmain{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,55%) minmax(0,1fr)}
  .pside{border-left:0;border-top:1px solid var(--line)}
  .pnext,#p-cam{display:none}
  .pbar{gap:10px}.pt b.big{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const HANG=new Set([...'、。，．,.']);
const SMALL=new Set([...'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ']);
const ROT=new Set([...'ー－—―…‥～〜（）「」『』【】〔〕［］｛｝〈〉《》＜＞→←＝｜：；']);
const PUNCT=new Set([...'、。，．']);
const mctx=document.createElement('canvas').getContext('2d');
const wcache=new Map(), lcache=new Map(), fontReq=new Set();
function cw(ch,f,w){const k=f+'|'+w+'|'+ch;let v=wcache.get(k);if(v==null){mctx.font=`${w} 100px "${f}", serif`;v=mctx.measureText(ch).width/100;wcache.set(k,v)}return v}
function needFont(f,w,text){const k=f+'|'+w+'|'+text;if(fontReq.has(k))return;fontReq.add(k);
  if(document.fonts&&document.fonts.load)document.fonts.load(`${w} 20px "${f}"`,text||'あ').then(()=>{wcache.clear();lcache.clear();dirtyAll()}).catch(()=>{})}
function units(str,it,V){
  const out=[],sz=it.size*PT,tr=it.track/1000*sz,ch=[...str];
  for(let i=0;i<ch.length;){
    const c=ch[i];
    if(V&&/[\x21-\x7e]/.test(c)){
      let j=i;while(j<ch.length&&/[\x20-\x7e]/.test(ch[j]))j++;
      while(j>i+1&&ch[j-1]===' ')j--;
      const run=ch.slice(i,j).join('');
      if(/^(\d{1,2}|[!?]{1,2})$/.test(run))out.push({s:run,k:'tcy',adv:sz+tr});
      else for(const x of run)out.push({s:x,k:'lat',adv:cw(x,it.font,it.weight)*sz});
      i=j;continue;
    }
    if(V)out.push({s:c,k:'cjk',adv:(c===' '?0.33*sz:sz)+tr});
    else out.push({s:c,k:'h',adv:cw(c,it.font,it.weight)*sz+tr});
    i++;
  }
  return out;
}
function layout(it){
  const key=[it.text,it.font,it.weight,it.size,it.leading,it.track,it.dir,it.align,it.w,it.h].join('\u0001');
  const old=lcache.get(it.id);if(old&&old.key===key)return old;
  const V=it.dir==='v',sz=it.size*PT,pitch=Math.max(0.1,sz*it.leading/100);
  const lim=V?it.h:it.w,across=V?it.w:it.h;
  const maxLines=across+1e-6<sz?0:Math.floor((across-sz)/pitch+1e-6)+1;
  const lines=[];
  for(const para of String(it.text).split('\n')){
    const us=units(para,it,V);let cur=[],pos=0;
    for(const u of us){
      if(pos+u.adv>lim+1e-6&&cur.length){
        if(HANG.has(u.s)&&!cur.hung){cur.push(u);cur.hung=true;lines.push(cur);cur=[];pos=0;continue}
        const carry=[];
        if(NO_START.has(u.s[0])&&cur.length>1)carry.unshift(cur.pop());
        while(cur.length>1&&NO_END.has(cur[cur.length-1].s))carry.unshift(cur.pop());
        lines.push(cur);cur=carry;pos=carry.reduce((a,c)=>a+c.adv,0);
      }
      cur.push(u);pos+=u.adv;
    }
    lines.push(cur);
  }
  const glyphs=[],n=Math.min(lines.length,maxLines);
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  for(let j=0;j<n;j++){
    const ln=lines[j];let len=0;for(const u of ln)len+=u.adv;if(ln.hung)len-=ln[ln.length-1].adv;
    let p=it.align==='center'?(lim-len)/2:it.align==='end'?lim-len:0;if(len>lim)p=0;
    const cross=V?it.w-sz/2-j*pitch:sz/2+j*pitch;
    for(const u of ln){
      const c=p+u.adv/2;
      const g={s:u.s,x:V?cross:c,y:V?c:cross,rot:false,dx:0,dy:0,sx:1};
      if(V){
        if(u.k==='lat')g.rot=true;
        else if(u.k==='tcy'){let w=0;for(const x of u.s)w+=cw(x,it.font,it.weight);if(w>1)g.sx=1/w}
        else if(ROT.has(u.s))g.rot=true;
        else if(PUNCT.has(u.s)){g.dx=.55;g.dy=-.55}
        else if(SMALL.has(u.s)){g.dx=.1;g.dy=-.1}
      }
      if(u.s.trim()){bx0=Math.min(bx0,g.x-sz/2);bx1=Math.max(bx1,g.x+sz/2);by0=Math.min(by0,g.y-sz/2);by1=Math.max(by1,g.y+sz/2)}
      glyphs.push(g);p+=u.adv;
    }
  }
  const L={key,glyphs,overflow:lines.length>maxLines,bbox:bx1>bx0?{x0:bx0,y0:by0,x1:bx1,y1:by1}:null};
  lcache.set(it.id,L);return L;
}

/* ---------- drawing ---------- */
const sepCache=new Map();
function sepCanvas(id,ch){
  const key=id+ch;let c=sepCache.get(key);if(c)return c;
  const im=S.images[id];c=document.createElement('canvas');c.width=im.w;c.height=im.h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im.img,0,0);
  const d=x.getImageData(0,0,im.w,im.h),a=d.data;
  for(let p=0;p<a.length;p+=4){
    const r=a[p]/255,g=a[p+1]/255,b=a[p+2]/255;let v;
    if(ch==='g')v=0.299*r+0.587*g+0.114*b;
    else{const C=1-r,M=1-g,Y=1-b,K=Math.min(C,M,Y);let ink;
      if(ch==='k')ink=K;else{const q=ch==='c'?C:ch==='m'?M:Y;ink=K>=1?0:(q-K)/(1-K)}
      v=1-ink}
    const gv=Math.round(v*255);a[p]=a[p+1]=a[p+2]=gv;
  }
  x.putImageData(d,0,0);sepCache.set(key,c);return c;
}
function drawText(ctx,it,ch,preview){
  const L=layout(it),sz=it.size*PT,K=100;
  needFont(it.font,it.weight,it.text);
  ctx.save();ctx.fillStyle=col(it.color,ch);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${it.weight} ${sz*K}px "${it.font}", serif`;
  for(const g of L.glyphs){
    if(!g.s.trim())continue;
    ctx.save();ctx.translate(it.x+g.x,it.y+g.y);ctx.scale(1/K,1/K);
    if(g.rot)ctx.rotate(Math.PI/2);
    if(g.sx!==1)ctx.scale(g.sx,1);
    ctx.fillText(g.s,g.dx*sz*K,g.dy*sz*K);ctx.restore();
  }
  ctx.restore();
  if(preview&&L.overflow){const q=2.2;ctx.fillStyle=TOK.danger;ctx.fillRect(it.x+it.w-q,it.y+it.h-q,q,q)}
}
function drawItem(ctx,it,ch,preview){
  if(it.type==='rect'){
    if(it.fill){ctx.fillStyle=col(it.fill,ch);ctx.fillRect(it.x,it.y,it.w,it.h)}
    if(it.stroke&&it.sw>0){ctx.strokeStyle=col(it.stroke,ch);ctx.lineWidth=it.sw;ctx.strokeRect(it.x,it.y,it.w,it.h)}
  }else if(it.type==='image'){
    const im=it.imageId&&S.images[it.imageId];
    if(im&&im.img){
      const sc=it.fit==='contain'?Math.min(it.w/im.w,it.h/im.h):Math.max(it.w/im.w,it.h/im.h);
      const dw=im.w*sc,dh=im.h*sc;
      ctx.save();ctx.beginPath();ctx.rect(it.x,it.y,it.w,it.h);ctx.clip();
      ctx.imageSmoothingQuality='high';
      ctx.drawImage(ch?sepCanvas(it.imageId,ch):im.img,it.x+(it.w-dw)/2,it.y+(it.h-dh)/2,dw,dh);ctx.restore();
    }else if(preview){
      ctx.save();ctx.strokeStyle=TOK.sub;ctx.lineWidth=0.2;ctx.beginPath();ctx.rect(it.x,it.y,it.w,it.h);
      ctx.moveTo(it.x,it.y);ctx.lineTo(it.x+it.w,it.y+it.h);ctx.moveTo(it.x+it.w,it.y);ctx.lineTo(it.x,it.y+it.h);ctx.stroke();ctx.restore();
    }
  }else if(it.type==='text'){
    if(preview&&S.guides){ctx.save();ctx.strokeStyle=TOK.line;ctx.lineWidth=0.2;ctx.setLineDash([1,1]);ctx.strokeRect(it.x,it.y,it.w,it.h);ctx.restore()}
    drawText(ctx,it,ch,preview);
  }
}
function nombreText(i){return String(S.doc.nombre.start+i)}
function drawNombre(ctx,i,ch){
  const d=S.doc,nb=d.nombre;if(d.kind==='cover'||nb.mode==='none'||d.pages[i].noNombre)return;
  const W=pw(d),H=d.trimH,L=isLeft(i),t=nombreText(i);
  let size=nb.size,x,y=H-nb.offset;
  if(nb.mode==='hidden'){size=Math.min(size,6);const half=t.length*size*PT*0.3+0.6;x=L?W-half-0.8:half+0.8;y=H-25}
  else if(nb.mode==='center')x=W/2;
  else x=L?d.margins.outer:W-d.margins.outer;
  const it={font:nb.font,weight:400};needFont(nb.font,400,'0123456789');
  ctx.save();ctx.fillStyle=col({c:0,m:0,y:0,k:100},ch);ctx.textBaseline='middle';
  ctx.textAlign=nb.mode==='outer'?(L?'left':'right'):'center';
  const K=100;ctx.translate(x,y);ctx.scale(1/K,1/K);ctx.font=`400 ${size*PT*K}px "${nb.font}", sans-serif`;ctx.fillText(t,0,0);ctx.restore();
}
function drawGuides(ctx,i){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH;
  ctx.save();ctx.lineWidth=0.25;
  ctx.strokeStyle=TOK.danger;ctx.strokeRect(-b,-b,W+2*b,H+2*b);
  ctx.strokeStyle=TOK.sub;ctx.lineWidth=0.2;ctx.strokeRect(0,0,W,H);
  ctx.strokeStyle=TOK.guide;ctx.lineWidth=0.2;
  if(d.kind==='cover'){
    const m=d.margins;ctx.strokeRect(m.outer,m.top,d.trimW-m.outer-m.inner,H-m.top-m.bottom);
    ctx.strokeRect(d.trimW+d.spine+m.inner,m.top,d.trimW-m.outer-m.inner,H-m.top-m.bottom);
    ctx.beginPath();ctx.moveTo(d.trimW,-b);ctx.lineTo(d.trimW,H+b);ctx.moveTo(d.trimW+d.spine,-b);ctx.lineTo(d.trimW+d.spine,H+b);ctx.stroke();
    const lab=d.binding==='right'?['表1','背','表4']:['表4','背','表1'];
    ctx.fillStyle=TOK.guide;ctx.textAlign='center';ctx.textBaseline='top';ctx.font='4px sans-serif';
    ctx.fillText(lab[0],d.trimW/2,2);ctx.fillText(lab[2],d.trimW*1.5+d.spine,2);if(d.spine>=4)ctx.fillText(lab[1],d.trimW+d.spine/2,2);
  }else{const m=margBox(i);ctx.strokeRect(m.x,m.y,m.w,m.h)}
  ctx.restore();
}
function drawPage(ctx,i,o){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,pg=d.pages[i];
  ctx.fillStyle='#ffffff';ctx.fillRect(-b,-b,W+2*b,H+2*b);
  ctx.save();ctx.beginPath();ctx.rect(-b,-b,W+2*b,H+2*b);ctx.clip();
  for(const it of pg.items)drawItem(ctx,it,o.ch,o.preview);
  drawNombre(ctx,i,o.ch);
  ctx.restore();
  if(o.guides)drawGuides(ctx,i);
}
function drawMarks(ctx,W,H,b,ext,ch){
  const mk=ext-1;ctx.save();ctx.strokeStyle=col(REG,ch);ctx.lineWidth=0.1;ctx.beginPath();
  const L=(x1,y1,x2,y2)=>{ctx.moveTo(x1,y1);ctx.lineTo(x2,y2)};
  for(const [cx,sx] of [[0,-1],[W,1]])for(const [cy,sy] of [[0,-1],[H,1]]){
    L(cx+sx*b,cy,cx+sx*mk,cy);L(cx,cy+sy*b,cx+sx*mk,cy+sy*b);
    L(cx,cy+sy*b,cx,cy+sy*mk);L(cx+sx*b,cy,cx+sx*b,cy+sy*mk);
  }
  const cm=(b+mk)/2;
  L(W/2,-b,W/2,-mk);L(W/2-8,-cm,W/2+8,-cm);
  L(W/2,H+b,W/2,H+mk);L(W/2-8,H+cm,W/2+8,H+cm);
  L(-b,H/2,-mk,H/2);L(-cm,H/2-8,-cm,H/2+8);
  L(W+b,H/2,W+mk,H/2);L(W+cm,H/2-8,W+cm,H/2+8);
  ctx.stroke();ctx.restore();
}

/* ---------- view ---------- */
const spreadsEl=$('#spreads'),pagesEl=$('#pages'),stage=$('#stage');
function spreadsOf(d){if(d.kind==='cover')return[[0]];const n=d.pages.length,sp=[[0]];for(let i=1;i<n;i+=2)sp.push(i+1<n?[i,i+1]:[i]);return sp}
const io=new IntersectionObserver(es=>{for(const e of es){const i=+e.target.dataset.i;if(e.isIntersecting){S.visible.add(i);S.dirty.add(i)}else S.visible.delete(i)}schedule()},{root:stage,rootMargin:'300px'});
function rebuild(){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH;S.s=PX*S.zoom;
  io.disconnect();spreadsEl.innerHTML='';pagesEl.innerHTML='';S.pageEls=[];S.thumbEls=[];S.visible.clear();lcache.clear();
  const pwpx=(W+2*b)*S.s,phpx=(H+2*b)*S.s,tS=64/H;
  for(const pair of spreadsOf(d)){
    const row=document.createElement('div');row.className='spread';
    const trow=document.createElement('div');trow.className='tsp';
    const slots=d.kind==='cover'?[[pair[0]]]:[[],[]];
    if(d.kind!=='cover')for(const i of pair)slots[isLeft(i)?0:1].push(i);
    for(const sl of slots){
      const s=document.createElement('div');s.className='slot';s.style.minWidth=pwpx+'px';
      const ts=document.createElement('div');ts.className='tslot';ts.style.minWidth=Math.round(W*tS)+'px';
      for(const i of sl){
        const pg=document.createElement('div');pg.className='page';pg.dataset.i=i;pg.style.width=pwpx+'px';pg.style.height=phpx+'px';
        const cv=document.createElement('canvas');const ov=document.createElement('div');ov.className='ov';pg.append(cv,ov);
        const no=document.createElement('div');no.className='pno';no.textContent=d.kind==='cover'?'表紙':nombreText(i);
        s.append(pg,no);S.pageEls[i]={el:pg,cv,ov};io.observe(pg);
        const tc=document.createElement('canvas');tc.className='thumb';tc.dataset.i=i;tc.style.width=Math.round(W*tS)+'px';tc.style.height='64px';
        const tn=document.createElement('div');tn.className='tno';tn.textContent=no.textContent;ts.append(tc,tn);S.thumbEls[i]=tc;S.tdirty.add(i);
      }
      row.append(s);trow.append(ts);
    }
    spreadsEl.append(row);pagesEl.append(trow);
  }
  $('#zoomLbl').textContent=Math.round(S.zoom*100)+'%';
  updateInfo();schedule();
}
function updateInfo(){const d=S.doc;const sz=Object.entries(SIZES).find(([k,v])=>v[0]===d.trimW&&v[1]===d.trimH);
  $('#docInfo').textContent=[d.name,(d.kind==='cover'?'表紙 ':'')+(sz?sz[0]+' ':'')+d.trimW+'×'+d.trimH+'mm'+(d.kind==='cover'?' 背幅'+d.spine+'mm':''),d.binding==='right'?'右綴じ':'左綴じ',d.color==='mono'?'モノクロ':'カラー',d.kind==='cover'?'':d.pages.length+'ページ'].filter(Boolean).join(' ・ ')}
let raf=0,tthumb=0;
function schedule(){if(!raf)raf=requestAnimationFrame(flush)}
function dirty(i){S.dirty.add(i);S.tdirty.add(i);schedule()}
function dirtyAll(){S.doc.pages.forEach((_,i)=>{S.dirty.add(i);S.tdirty.add(i)});schedule()}
function flush(){
  raf=0;readTokens();
  for(const i of S.dirty){if(S.visible.has(i)&&S.pageEls[i]){renderPage(i);S.dirty.delete(i)}}
  clearTimeout(tthumb);tthumb=setTimeout(()=>{for(const i of S.tdirty)renderThumb(i);S.tdirty.clear()},250);
}
function renderPage(i){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,pe=S.pageEls[i],dpr=window.devicePixelRatio||1,s=S.s;
  const w=Math.round((W+2*b)*s*dpr),h=Math.round((H+2*b)*s*dpr);
  if(pe.cv.width!==w||pe.cv.height!==h){pe.cv.width=w;pe.cv.height=h}
  const ctx=pe.cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);
  ctx.setTransform(s*dpr,0,0,s*dpr,b*s*dpr,b*s*dpr);
  drawPage(ctx,i,{ch:null,preview:true,guides:S.guides});
  drawOverlay(i);
}
function renderThumb(i){
  const c=S.thumbEls[i];if(!c)return;const d=S.doc,H=d.trimH,W=pw(d),dpr=window.devicePixelRatio||1,tS=64/H;
  c.width=Math.round(W*tS*dpr);c.height=Math.round(64*dpr);
  const ctx=c.getContext('2d');ctx.setTransform(tS*dpr,0,0,tS*dpr,0,0);drawPage(ctx,i,{ch:null,preview:false,guides:false});
  c.classList.toggle('cur',i===S.page);
}
function drawOverlay(i){
  const pe=S.pageEls[i];if(!pe)return;const b=S.doc.bleed,s=S.s;pe.ov.innerHTML='';
  const it=S.sel&&S.sel.page===i?findItem(S.sel):null;
  if(it){const box=document.createElement('div');box.className='selbox';
    Object.assign(box.style,{left:(it.x+b)*s+'px',top:(it.y+b)*s+'px',width:it.w*s+'px',height:it.h*s+'px'});
    for(const [dn,l,t] of [['nw',0,0],['n',50,0],['ne',100,0],['e',100,50],['se',100,100],['s',50,100],['sw',0,100],['w',0,50]]){
      const h=document.createElement('div');h.className='h';h.dataset.d=dn;h.style.left=l+'%';h.style.top=t+'%';h.style.cursor=dn+'-resize';box.append(h)}
    pe.ov.append(box)}
  if(S.drag&&S.drag.mode==='create'&&S.drag.pi===i){const r=S.drag.rect;if(r){const t=document.createElement('div');t.className='tmpbox';
    Object.assign(t.style,{left:(r.x+b)*s+'px',top:(r.y+b)*s+'px',width:r.w*s+'px',height:r.h*s+'px'});pe.ov.append(t)}}
}
function findItem(sel){const pg=S.doc.pages[sel.page];return pg&&pg.items.find(x=>x.id===sel.id)}
function selItem(){return S.sel?findItem(S.sel):null}
function select(pi,id){const prev=S.sel;S.sel=id?{page:pi,id}:null;if(prev&&S.pageEls[prev.page])drawOverlay(prev.page);if(S.sel)drawOverlay(pi);renderProps()}
function setPage(i){if(S.page===i)return;const o=S.page;S.page=i;if(S.thumbEls[o])S.thumbEls[o].classList.remove('cur');if(S.thumbEls[i])S.thumbEls[i].classList.add('cur');if(S.tab==='props'&&!S.sel)renderProps()}

/* ---------- history & persistence ---------- */
let saveT=0;
function commit(){const j=JSON.stringify(S.doc);if(j===S.last)return;S.undo.push(S.last);if(S.undo.length>100)S.undo.shift();S.redo=[];S.last=j;afterChange()}
function afterChange(){clearTimeout(saveT);saveT=setTimeout(autosave,800);clearTimeout(pfT);pfT=setTimeout(runPreflight,400);$('#bUndo').disabled=!S.undo.length;$('#bRedo').disabled=!S.redo.length}
function restore(j){S.last=j;S.doc=JSON.parse(j);if(S.sel&&!findItem(S.sel))S.sel=null;S.page=Math.min(S.page,S.doc.pages.length-1);rebuild();renderAll();afterChange()}
function undo(){if(!S.undo.length)return;S.redo.push(S.last);restore(S.undo.pop())}
function redo(){if(!S.redo.length)return;S.undo.push(S.last);restore(S.redo.pop())}
function resetHistory(){S.undo=[];S.redo=[];S.last=JSON.stringify(S.doc);afterChange()}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('thinbook',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function kvGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const r=t.objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
function projectData(){const used=new Set();S.doc.pages.forEach(p=>p.items.forEach(it=>{if(it.imageId)used.add(it.imageId)}));
  const images={};for(const id of used){const im=S.images[id];if(im)images[id]={src:im.src,w:im.w,h:im.h,name:im.name||''}}
  return{app:'thinbook',version:1,doc:S.doc,images}}
function autosave(){kvSet('project',projectData())}
async function loadProject(p){
  if(!p||!['thinbook','kumi'].includes(p.app)||!p.doc)throw new Error('Thinbookのプロジェクトファイルではありません');
  S.images={};
  await Promise.all(Object.entries(p.images||{}).map(([id,m])=>new Promise(res=>{const img=new Image();img.onload=()=>{S.images[id]={...m,img};res()};img.onerror=res;img.src=m.src})));
  S.doc=p.doc;S.sel=null;S.page=0;fitZoom();rebuild();renderAll();resetHistory();
}
let dlCap=null;
try{if(window.claude&&window.claude.use)dlCap=window.claude.use('downloads')}catch(e){}
async function saveFile(name,blob){
  try{const dl=dlCap&&await dlCap;if(dl){await dl.save({filename:name,data:blob});toast('保存しました：'+name);return}}
  catch(e){if(e&&e.code==='declined')return;if(e&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)){toast('保存できませんでした（'+(e.code||e.message)+'）');return}}

function readImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
  let src=fr.result,w=img.naturalWidth,h=img.naturalHeight;const MAX=16e6;
  if(w*h>MAX){const k=Math.sqrt(MAX/(w*h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c.toDataURL('image/jpeg',0.95);w=c.width;h=c.height;
    const im2=new Image();im2.onload=()=>res({src,w,h,img:im2,name:file.name});im2.src=src;return}
  res({src,w,h,img,name:file.name})};img.onerror=()=>rej(new Error('画像を読み込めませんでした'));img.src=fr.result};fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)})}

function effPpi(it){const im=S.images[it.imageId];if(!im)return 0;const sc=it.fit==='contain'?Math.min(it.w/im.w,it.h/im.h):Math.max(it.w/im.w,it.h/im.h);return Math.round(25.4/sc)}

function toMM(e,el){const r=el.getBoundingClientRect(),b=S.doc.bleed;return{x:(e.clientX-r.left)/S.s-b,y:(e.clientY-r.top)/S.s-b}}
function hit(pi,p){const its=S.doc.pages[pi].items;for(let k=its.length-1;k>=0;k--){const it=its[k];if(p.x>=it.x&&p.x<=it.x+it.w&&p.y>=it.y&&p.y<=it.y+it.h)return it}return null}
function snapLines(pi){const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,m=d.kind==='cover'?{x:d.margins.outer,y:d.margins.top,w:W-2*d.margins.outer,h:H-d.margins.top-d.margins.bottom}:margBox(pi);
  const xs=[-b,0,W/2,W,W+b,m.x,m.x+m.w],ys=[-b,0,H/2,H,H+b,m.y,m.y+m.h];if(d.kind==='cover')xs.push(d.trimW,d.trimW+d.spine);return{xs,ys}}
function snap1(vals,lines){const th=6/S.s;let best=null;for(const v of vals)for(const l of lines){const dd=l-v;if(Math.abs(dd)<th&&(best===null||Math.abs(dd)<Math.abs(best)))best=dd}return best||0}

  if(D.mode==='create'){const x=Math.min(p.x,D.p0.x),y=Math.min(p.y,D.p0.y);D.rect={x,y,w:Math.abs(dx),h:Math.abs(dy)};drawOverlay(D.pi);return}
  const it=findItem({page:D.pi,id:D.id});if(!it)return;const o=D.o,L=snapLines(D.pi);
  if(D.mode==='move'){

    let nx=o.x+dx,ny=o.y+dy;nx+=snap1([nx,nx+o.w/2,nx+o.w],L.xs);ny+=snap1([ny,ny+o.h/2,ny+o.h],L.ys);it.x=r1(nx);it.y=r1(ny);

document.addEventListener('keydown',e=>{
  const tg=e.target.tagName;const typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}

  if(e.key==='ArrowLeft'){e.preventDefault();nudge(-st,0)}else if(e.key==='ArrowRight'){e.preventDefault();nudge(st,0)}

let pfT=0,PF=[];
function preflight(){
  const d=S.doc,b=d.bleed,W=pw(d),H=d.trimH,out=[],safe=3;
  if(d.kind==='body'&&d.pages.length%4!==0)out.push({lv:'warn',page:null,msg:`ページ数が4の倍数ではありません（${d.pages.length}ページ）`});
  if(d.kind==='cover'&&!(d.spine>0))out.push({lv:'warn',page:0,msg:'背幅が0mmです。印刷所の背幅計算で確認してください'});
  let rgb=false;
  d.pages.forEach((pg,i)=>{
    const lab=d.kind==='cover'?'表紙':nombreText(i);
    for(const it of pg.items){
      const at={page:i,id:it.id,lab};
      if(it.type==='text'){
        const L=layout(it);
        if(L.overflow)out.push({lv:'err',...at,msg:'テキストがフレームからあふれています'});
        if(L.bbox){const x0=it.x+L.bbox.x0,x1=it.x+L.bbox.x1,y0=it.y+L.bbox.y0,y1=it.y+L.bbox.y1;
          if(x0<safe||y0<safe||x1>W-safe||y1>H-safe)out.push({lv:'warn',...at,msg:`文字が仕上がり線から${safe}mm以内にあります（断裁で切れる恐れ）`})}
      }else{
        if(it.type==='image'){
          if(!it.imageId)out.push({lv:'warn',...at,msg:'画像が配置されていない画像フレームがあります'});
          else{const ppi=effPpi(it);if(ppi<300)out.push({lv:'warn',...at,msg:`画像の実効解像度が低めです（${ppi}ppi、推奨350ppi以上）`});if(d.color==='cmyk')rgb=true}

        const e=0.01;const short=(it.x<-e&&it.x>-b+e)||(it.y<-e&&it.y>-b+e)||(it.x+it.w>W+e&&it.x+it.w<W+b-e)||(it.y+it.h>H+e&&it.y+it.h<H+b-e);
        const touchTrim=(Math.abs(it.x)<0.3)||(Math.abs(it.y)<0.3)||(Math.abs(it.x+it.w-W)<0.3)||(Math.abs(it.y+it.h-H)<0.3);
        if(short)out.push({lv:'err',...at,msg:`塗り足しが不足しています（仕上がり線の外へ${b}mmまで伸ばしてください）`});
        else if(touchTrim)out.push({lv:'warn',...at,msg:'オブジェクトの端が仕上がり線ぴったりです。断裁ずれで白が出る恐れがあります'});
      }
    }
  });
  if(rgb)out.push({lv:'info',page:null,msg:'RGB画像は書き出し時にCMYKへ変換されます。色味が変わる場合があります'});
  return out;
}

const enc=new TextEncoder();

async function ensureFonts(){

async function exportPDF(opt,progress){

  const pxW=Math.round(mw*s),pxH=Math.round(mh*s),cmyk=d.color==='cmyk',chans=cmyk?['c','m','y','k']:['g'],nc=chans.length;

    }

    const cs=`q ${f(mw)} 0 0 ${f(mh)} 0 0 cm /Im0 Do Q`;
    obj(cid,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(mw)} ${f(mh)}] /BleedBox [${f(ext-b)} ${f(ext-b)} ${f(ext+W+b)} ${f(ext+H+b)}] /TrimBox [${f(ext)} ${f(ext)} ${f(ext+W)} ${f(ext+H)}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageB /ImageC] >> /Contents ${cid} 0 R >>`);
  }

  obj(1,'<< /Type /Catalog /Pages 2 0 R /OutputIntents [3 0 R] >>');
  obj(2,`<< /Type /Pages /Kids [${kids.map(x=>x+' 0 R').join(' ')}] /Count ${kids.length} >>`);
  obj(3,'<< /Type /OutputIntent /S /GTS_PDFX /OutputConditionIdentifier (JC200103) /OutputCondition (Japan Color 2001 Coated) /RegistryName (http://www.color.org) /Info (Japan Color 2001 Coated) >>');
  obj(4,`<< /Title ${pdfStr(d.name||'無題')} /Creator (Thinbook) /Producer (Thinbook) /CreationDate (${dt}) /ModDate (${dt}) /GTS_PDFXVersion (PDF/X-1:2001) /GTS_PDFXConformance (PDF/X-1a:2001) /Trapped /False >>`);

function presCfg(){const d=S.doc;if(!d.pres)d.pres={min:5,alloc:'equal',media:'none',chime:true,lang:'ja',hide:0,from:'first',noteSize:18};return d.pres}

function presDraw(cv,i,bw,bh){
  const d=S.doc,W=pw(d),H=d.trimH,dpr=window.devicePixelRatio||1;
  if(!(bw>0&&bh>0)||i<0||i>=d.pages.length){cv.width=1;cv.height=1;cv.style.width=cv.style.height='0px';return}

function budgets(n,total,alloc){
  let w=new Array(n).fill(1);
  if(alloc==='notes')w=w.map((_,i)=>Math.max(20,[...noteOf(i)].length));
  if(alloc==='last'){const r=recs()[0];if(r&&r.dur)w=w.map((_,i)=>Math.max(5,r.dur[i]||0))}

}
function words(text,lang){
  try{const sg=new Intl.Segmenter(lang==='en'?'en':'ja',{granularity:'word'});return[...sg.segment(text)]}
  catch(e){return text.split(/(\s+)/).map(s=>({segment:s,isWordLike:/\S/.test(s)}))}
}
function normW(s){return s.toLowerCase().replace(/[^\p{L}\p{N}']/gu,'')}
/* memorization: 0 全文 / 1 一部を隠す / 2 頭文字のみ / 3 隠す */
function hideHTML(text,lvl,lang){
  if(!text)return'';
  if(lvl===0)return esc(text).replace(/\n/g,'<br>');
  if(lvl===3)return `<span class="hid blk" data-rv>${esc(text).replace(/\n/g,'<br>')}</span>`;
  let k=0,h='';
  for(const s of words(text,lang)){
    const t=s.segment;
    if(t.includes('\n')){h+=esc(t).replace(/\n/g,'<br>');continue}
    if(!s.isWordLike){h+=esc(t);continue}
    k++;
    if(lvl===1){h+=(k%3===0||(k%5===2))?`<span class="hid" data-rv>${esc(t)}</span>`:esc(t);continue}
    const ch=[...t];h+=esc(ch[0])+(ch.length>1?`<span class="hid" data-rv>${esc(ch.slice(1).join(''))}</span>`:'');
  }
  return h;
}

    if(v&&blob){const t=v.currentTime+(r.recOffset||0);x.fillStyle=ink;x.fillRect(Math.round(X(t))-1,0,2,H)}};
  if(cv){cv.style.height='120px';requestAnimationFrame(drawChart);cv.onclick=e=>{const b=cv.getBoundingClientRect();seek((e.clientX-b.left)/b.width*Math.max(r.total,r.vol.length*VSTEP))};if(v)v.ontimeupdate=drawChart}
  $('#r-memo').oninput=e=>{r.memo=e.target.value;clearTimeout(commitT);commitT=setTimeout(commit,600)};
  const close=()=>{if(url)URL.revokeObjectURL(url);if(window.speechSynthesis)speechSynthesis.cancel();commit();closeModal()};
  $('#r-close').onclick=close;
  const dl=$('#r-dl');if(dl)dl.onclick=()=>{const ext=/mp4/.test(blob.type)?(r.media==='video'?'mp4':'m4a'):(r.media==='video'?'webm':'weba');saveFile(`${S.doc.name||'無題'}_練習_${r.date.slice(0,16).replace(/[-:T]/g,'')}.${ext}`,blob)};
  $('#r-del').onclick=()=>{const R=recs(),k=R.indexOf(r);if(k>=0)R.splice(k,1);kvDel('rec:'+r.id);if(url)URL.revokeObjectURL(url);commit();closeModal();toast('記録を削除しました')};
}

/* ---------- boot ---------- */
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(dirtyAll,150)});
if(document.fonts)document.fonts.addEventListener('loadingdone',()=>{wcache.clear();lcache.clear();if(S.doc)dirtyAll()});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>dirtyAll());
(async()=>{
  const saved=await kvGet('project');
  try{if(saved&&saved.doc){await loadProject(saved);return}}catch(e){}
  S.doc=sampleDoc();fitZoom();rebuild();renderAll();resetHistory();
})();
window.__thinbook={S,exportPDF,preflight,layout};
</script>
